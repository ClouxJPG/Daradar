<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Радар без утечек памяти</title>
  <style>
    body {
      background: #121214;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
    }

    /* === ВИДЖЕТ И СЛОИ === */
    .radar-widget {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      
      /* Жестко ставим поверх всего интерфейса */
      z-index: 99999;
      isolation: isolate; 
      
      width: 90%;
      max-width: 500px;
      background: #1e1e24;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      padding: 20px;
      box-sizing: border-box;

      /* Плавность появления/исчезания */
      opacity: 1;
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Состояние плавной анимации при закрытии */
    .radar-widget.is-closing {
      opacity: 0;
      transform: translate(-50%, -45%) scale(0.95);
      pointer-events: none; /* Запрещаем клики во время угасания */
    }

    /* Полное скрытие ПОСЛЕ окончания анимации */
    .radar-widget.is-hidden {
      display: none !important;
    }

    /* Оформление элементов */
    .radar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .radar-canvas {
      width: 100%;
      height: 250px;
      background: #000;
      border-radius: 8px;
      display: block;
    }
    button {
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
    }
    .btn-open { background: #4caf50; color: white; }
    .btn-close { background: #ff4d4d; color: white; }
  </style>
</head>
<body>

  <!-- Кнопка вызова -->
  <button class="btn-open" onclick="radar.open()">Открыть радар</button>

  <!-- Модалка/Виджет -->
  <div id="radar-modal" class="radar-widget is-hidden">
    <div class="radar-header">
      <h3 style="margin: 0;">Радар осадков</h3>
      <button class="btn-close" onclick="radar.close()">✕</button>
    </div>
    <canvas id="radar-canvas" class="radar-canvas"></canvas>
  </div>

  <!-- ЛОГИКА ОЧИСТКИ И АНИМАЦИИ -->
  <script>
    class RadarWidget {
      constructor(modalId, canvasId) {
        this.container = document.getElementById(modalId);
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;

        this.animFrameId = null;
        this.boundResize = this.onResize.bind(this);
      }

      // 1. Открытие
      open() {
        // Показываем блок
        this.container.classList.remove('is-hidden', 'is-closing');
        
        // Настраиваем Canvas под размеры
        this.onResize();
        window.addEventListener('resize', this.boundResize);

        // Запускаем рендер
        this.startLoop();
      }

      // 2. Цикл анимации (пример работы с Canvas/GPU)
      startLoop() {
        let angle = 0;

        const render = () => {
          if (!this.ctx) return;
          const w = this.canvas.width;
          const h = this.canvas.height;

          // Отрисовка имитации радара
          this.ctx.fillStyle = 'rgba(0, 20, 0, 0.1)';
          this.ctx.fillRect(0, 0, w, h);

          this.ctx.beginPath();
          this.ctx.arc(w / 2, h / 2, Math.min(w, h) / 2 - 10, 0, Math.PI * 2);
          this.ctx.strokeStyle = '#00ff00';
          this.ctx.stroke();

          this.ctx.beginPath();
          this.ctx.moveTo(w / 2, h / 2);
          this.ctx.lineTo(w / 2 + Math.cos(angle) * (w / 2 - 10), h / 2 + Math.sin(angle) * (h / 2 - 10));
          this.ctx.strokeStyle = '#00ff00';
          this.ctx.lineWidth = 2;
          this.ctx.stroke();

          angle += 0.05;

          // Запоминаем ID, чтобы потом отменить!
          this.animFrameId = requestAnimationFrame(render);
        };

        render();
      }

      onResize() {
        if (this.canvas) {
          this.canvas.width = this.canvas.clientWidth;
          this.canvas.height = this.canvas.clientHeight;
        }
      }

      // 3. Закрытие (плавное + без вылетов)
      close() {
        if (this.container.classList.contains('is-closing')) return;

        // Шаг 1: Запускаем угасание в CSS
        this.container.classList.add('is-closing');

        // Шаг 2: МГНОВЕННО останавливаем тяжелую нагрузку на CPU/GPU
        this.cleanup();

        // Шаг 3: Убираем из видимости только ПОСЛЕ того, как закончилась CSS-анимация
        const onAnimationEnd = (e) => {
          if (e.propertyName !== 'opacity') return; // Реагируем только на прозрачность
          
          this.container.removeEventListener('transitionend', onAnimationEnd);
          this.container.classList.add('is-hidden');
          this.container.classList.remove('is-closing');
        };

        this.container.addEventListener('transitionend', onAnimationEnd);
      }

      // 4. Очистка ресурсов (Убирает лаги и вылеты сайта)
      cleanup() {
        // Убиваем бесконечный цикл анимации
        if (this.animFrameId) {
          cancelAnimationFrame(this.animFrameId);
          this.animFrameId = null;
        }

        // Отписываемся от слушателей событий
        window.removeEventListener('resize', this.boundResize);

        // Сбрасываем Canvas, чтобы освободить видеопамять (VRAM)
        if (this.canvas) {
          this.canvas.width = 0;
          this.canvas.height = 0;
        }
      }
    }

    // Инициализация
    const radar = new RadarWidget('radar-modal', 'radar-canvas');
  </script>
</body>
</html>
