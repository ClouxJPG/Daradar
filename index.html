<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Метео Радар Pro</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --bg-glass: rgba(15, 20, 31, 0.85);
            --bg-glass-hover: rgba(26, 33, 50, 0.95);
            --bg-card: rgba(19, 25, 38, 0.96);
            --border: rgba(255, 255, 255, 0.12);
            --border-light: rgba(255, 255, 255, 0.22);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.45);
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-std: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07090e;
            color: var(--text-primary);
            user-select: none;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #07090e;
        }

        /* Попап погоды */
        .leaflet-popup-content-wrapper {
            background: var(--bg-card) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-light) !important;
            box-shadow: var(--shadow) !important;
            border-radius: 18px !important;
            backdrop-filter: blur(20px);
            padding: 2px !important;
        }

        .leaflet-popup-tip {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-light) !important;
        }

        .leaflet-popup-content {
            margin: 12px 14px !important;
        }

        .weather-pop-card { min-width: 200px; }
        .pop-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .pop-temp {
            font-size: 24px;
            font-weight: 800;
            color: #60a5fa;
        }
        .pop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 11px;
        }
        .pop-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 5px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-secondary);
        }
        .pop-item b { color: var(--text-primary); }

        /* Кнопки зума */
        .leaflet-control-zoom {
            border: none !important;
            margin-bottom: 110px !important;
            margin-right: 14px !important;
        }
        .leaflet-control-zoom a {
            background: var(--bg-glass) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border) !important;
            border-radius: 12px !important;
            width: 38px !important;
            height: 38px !important;
            line-height: 38px !important;
            margin-top: 6px;
            backdrop-filter: blur(16px);
        }

        /* Верхняя панель */
        .top-deck {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            pointer-events: none;
        }

        .glass-pill {
            pointer-events: auto;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
        }

        .brand-pill {
            padding: 0 14px;
            height: 44px;
            font-size: 13px;
            font-weight: 800;
            gap: 8px;
            color: #fff;
            flex-shrink: 0;
        }

        .brand-pill i { color: var(--accent); }

        .search-pill {
            flex: 1;
            max-width: 360px;
            height: 44px;
            padding: 0 14px;
            gap: 8px;
        }

        .search-pill input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
        }

        .tools-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .btn-glass {
            width: 44px;
            height: 44px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .btn-glass.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Легенда */
        .legend-pill {
            position: absolute;
            top: 68px;
            left: 14px;
            z-index: 9;
            padding: 6px 12px;
            flex-direction: column;
            gap: 4px;
            pointer-events: auto;
        }

        .legend-bar {
            width: 120px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, #00e676, #ffeb3b, #ff9800, #f44336, #9c27b0);
        }

        /* Линейка */
        .ruler-badge {
            position: absolute;
            top: 68px;
            right: 14px;
            z-index: 9;
            padding: 6px 12px;
            font-size: 12px;
            gap: 10px;
            pointer-events: auto;
            display: none;
        }
        .ruler-badge.active { display: flex; }

        /* Плеер */
        .player-deck {
            position: absolute;
            bottom: 16px;
            left: 14px;
            right: 14px;
            z-index: 10;
            max-width: 580px;
            margin: 0 auto;
            padding: 12px 16px;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }

        .player-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--warning);
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 3px 10px;
            border-radius: 12px;
        }

        .time-readout {
            font-size: 15px;
            font-weight: 800;
            color: #60a5fa;
        }

        .player-body {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .play-btn-main {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .range-container {
            flex: 1;
            display: flex;
            align-items: center;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--accent);
            cursor: pointer;
        }

        /* НАСТРОЙКА БОКОВОЙ ПАНЕЛИ (ЖЕСТКО СКРЫТА ПО УМОЛЧАНИЮ) */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s var(--ease-std), visibility 0.3s;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .drawer-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 101;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            transform: translateY(100%);
            visibility: hidden;
            pointer-events: none;
            transition: transform 0.3s var(--ease-spring), visibility 0.3s;
        }

        .drawer-sheet.active {
            transform: translateY(0);
            visibility: visible;
            pointer-events: auto;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 800;
            margin: 14px 0 8px 0;
        }

        .option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: 0.3s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(18px); }

        .base-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 6px;
        }

        .btn-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 0;
            border-radius: 10px;
            font-size: 11px;
            text-align: center;
            cursor: pointer;
        }

        .btn-card.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.25);
            color: #60a5fa;
            font-weight: 700;
        }

        .toast {
            position: fixed;
            top: 68px;
            left: 50%;
            z-index: 200;
            background: var(--accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -10px);
            transition: all 0.3s var(--ease-std);
        }
        .toast.active {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (min-width: 640px) {
            .drawer-sheet {
                top: 68px;
                right: 14px;
                left: auto;
                bottom: auto;
                width: 320px;
                border-radius: 18px;
                border: 1px solid var(--border-light);
                transform: translateY(-10px);
                opacity: 0;
            }
            .drawer-sheet.active {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div id="map"></div>
<div class="toast" id="toast"></div>

<!-- Верхняя панель -->
<div class="top-deck">
    <div class="glass-pill brand-pill">
        <i class="fa-solid fa-cloud-bolt"></i> РАДАР
    </div>

    <div class="glass-pill search-pill">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-secondary); font-size: 12px;"></i>
        <input type="text" id="searchInput" placeholder="Поиск города..." onkeydown="if(event.key==='Enter') searchCity()">
    </div>

    <div class="tools-group">
        <button class="btn-glass" onclick="locateUser()" title="Мое местоположение">
            <i class="fa-solid fa-location-arrow"></i>
        </button>
        <button class="btn-glass" id="rulerBtn" onclick="toggleRuler()" title="Линейка">
            <i class="fa-solid fa-ruler-combined"></i>
        </button>
        <button class="btn-glass" onclick="toggleDrawer()" title="Слои">
            <i class="fa-solid fa-sliders"></i>
        </button>
    </div>
</div>

<!-- Легенда -->
<div class="glass-pill legend-pill">
    <span style="font-size: 9px; color: var(--text-secondary); font-weight:800;">ОСАДКИ</span>
    <div class="legend-bar"></div>
</div>

<!-- Табло измерителя -->
<div class="glass-pill ruler-badge" id="rulerBadge">
    <span>Дистанция: <b id="rulerDist" style="color:var(--accent);">0 км</b></span>
    <i class="fa-solid fa-xmark" style="cursor:pointer; color:var(--danger);" onclick="clearRuler()"></i>
</div>

<!-- Плеер -->
<div class="glass-pill player-deck">
    <div class="player-top">
        <div class="status-badge" id="statusBadge"><span id="statusText">АРХИВ</span></div>
        <div class="time-readout" id="timeReadout">--:--</div>
    </div>
    <div class="player-body">
        <button class="play-btn-main" id="playBtn" onclick="togglePlay()">
            <i class="fa-solid fa-play"></i>
        </button>
        <div class="range-container">
            <input type="range" id="timeSlider" min="0" max="100" value="0" oninput="onSeek(this.value)">
        </div>
        <button class="btn-glass" style="width:36px; height:36px; font-size:11px; font-weight:700;" onclick="changeSpeed()">
            <span id="speedVal">1x</span>
        </button>
    </div>
</div>

<!-- Боковая панель (Шторка) -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer-sheet" id="drawerSheet">
    <div class="drawer-header">
        <span>Слои и карты</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="toggleDrawer()"></i>
    </div>

    <div class="section-title">Радар</div>
    <div class="option-row">
        <span>Включить радар</span>
        <label class="toggle-switch">
            <input type="checkbox" id="radarCheck" checked onchange="toggleRadar(this.checked)">
            <span class="slider"></span>
        </label>
    </div>
    <div style="margin: 4px 0 10px 0;">
        <div class="option-row" style="color:var(--text-secondary); font-size:11px;">
            <span>Прозрачность</span>
            <span id="opLabel">75%</span>
        </div>
        <input type="range" min="0" max="100" value="75" oninput="setOpacity(this.value)">
    </div>

    <div class="section-title">Карта-подложка</div>
    <div class="base-grid">
        <div class="btn-card active" onclick="setBase('dark', this)">Темная</div>
        <div class="btn-card" onclick="setBase('sat', this)">Спутник</div>
        <div class="btn-card" onclick="setBase('light', this)">Светлая</div>
        <div class="btn-card" onclick="setBase('osm', this)">Схема</div>
    </div>
</div>

<script>
    // Инициализация карты
    const map = L.map('map', {
        center: [55.7512, 37.6184],
        zoom: 6,
        zoomControl: false,
        fadeAnimation: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const basemaps = {
        dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }),
        sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
        light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }),
        osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
    };

    let activeBase = basemaps.dark;
    activeBase.addTo(map);

    function setBase(type, btn) {
        map.removeLayer(activeBase);
        activeBase = basemaps[type];
        activeBase.addTo(map);
        document.querySelectorAll('.btn-card').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // ЛЕГКИЙ РАДАР (ЕДИНСТВЕННЫЙ СЛОЙ — УСТРАНЯЕТ ВЫЛЕТЫ И ЛАГИ)
    let frames = [];
    let currentIndex = 0;
    let isPlaying = false;
    let playTimer = null;
    let animSpeed = 500;
    let currentOpacity = 0.75;
    let isRadarVisible = true;

    // Один постоянный слой Leaflet
    const radarTileLayer = L.tileLayer('', {
        opacity: currentOpacity,
        zIndex: 100
    }).addTo(map);

    async function initRadar() {
        try {
            const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const data = await res.json();
            const past = data.radar.past || [];
            const nowcast = data.radar.nowcast || [];
            frames = [...past, ...nowcast];

            if (!frames.length) return;

            currentIndex = past.length > 0 ? past.length - 1 : 0;
            showFrame(currentIndex);
        } catch (e) {
            document.getElementById('timeReadout').innerText = "Ошибка API";
        }
    }

    function showFrame(idx) {
        if (!frames.length || !frames[idx]) return;

        if (isRadarVisible) {
            const time = frames[idx].time;
            radarTileLayer.setUrl(`https://tilecache.rainviewer.com/v2/radar/${time}/256/{z}/{x}/{y}/2/1_1.png`);
        }

        const date = new Date(frames[idx].time * 1000);
        document.getElementById('timeReadout').innerText = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const nowSec = Math.floor(Date.now() / 1000);
        const statusText = document.getElementById('statusText');
        if (frames[idx].time > nowSec) {
            statusText.innerText = "ПРОГНОЗ";
        } else {
            statusText.innerText = "АРХИВ";
        }

        const slider = document.getElementById('timeSlider');
        slider.value = (idx / (frames.length - 1)) * 100;
        slider.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${slider.value}%, rgba(255,255,255,0.2) ${slider.value}%, rgba(255,255,255,0.2) 100%)`;
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('playBtn');
        if (isPlaying) {
            btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            playTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % frames.length;
                showFrame(currentIndex);
            }, animSpeed);
        } else {
            btn.innerHTML = '<i class="fa-solid fa-play"></i>';
            clearInterval(playTimer);
        }
    }

    function onSeek(val) {
        if (!frames.length) return;
        currentIndex = Math.round((val / 100) * (frames.length - 1));
        showFrame(currentIndex);
    }

    function changeSpeed() {
        const speeds = [500, 250, 1000];
        const labels = ['1x', '2x', '0.5x'];
        let i = speeds.indexOf(animSpeed);
        i = (i + 1) % speeds.length;
        animSpeed = speeds[i];
        document.getElementById('speedVal').innerText = labels[i];

        if (isPlaying) {
            togglePlay();
            togglePlay();
        }
    }

    function toggleRadar(show) {
        isRadarVisible = show;
        if (show) {
            radarTileLayer.setOpacity(currentOpacity);
            showFrame(currentIndex);
        } else {
            radarTileLayer.setOpacity(0);
        }
    }

    function setOpacity(val) {
        document.getElementById('opLabel').innerText = val + '%';
        currentOpacity = val / 100;
        if (isRadarVisible) {
            radarTileLayer.setOpacity(currentOpacity);
        }
    }

    // ИНСПЕКТОР ПОГОДЫ В ТОЧКЕ
    map.on('click', async (e) => {
        if (rulerActive) {
            addRulerPoint(e.latlng);
            return;
        }

        const lat = e.latlng.lat.toFixed(4);
        const lon = e.latlng.lng.toFixed(4);

        const popup = L.popup({ offset: [0, -5] })
            .setLatLng(e.latlng)
            .setContent(`<div style="font-size:11px; color:var(--text-secondary); text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> Загрузка...</div>`)
            .openOn(map);

        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,wind_speed_10m&wind_speed_unit=ms`;
            const res = await fetch(url);
            const data = await res.json();
            const c = data.current;

            popup.setContent(`
                <div class="weather-pop-card">
                    <div class="pop-head">
                        <div>
                            <div style="font-size:13px; font-weight:800; color:#fff;">Погода в точке</div>
                            <div style="font-size:10px; color:var(--text-secondary);">${lat}, ${lon}</div>
                        </div>
                    </div>
                    <div style="display:flex; align-items:baseline; gap:6px; margin-bottom:8px;">
                        <div class="pop-temp">${c.temperature_2m > 0 ? '+' : ''}${Math.round(c.temperature_2m)}°C</div>
                        <div style="font-size:10px; color:var(--text-secondary);">Ощ. <b style="color:#fff">${Math.round(c.apparent_temperature)}°C</b></div>
                    </div>
                    <div class="pop-grid">
                        <div class="pop-item">Ветер <b>${c.wind_speed_10m} м/с</b></div>
                        <div class="pop-item">Влажн. <b>${c.relative_humidity_2m}%</b></div>
                        <div class="pop-item">Осадки <b>${c.precipitation} мм</b></div>
                    </div>
                </div>
            `);
        } catch (err) {
            popup.setContent(`<div style="font-size:11px; color:var(--danger);">Ошибка данных</div>`);
        }
    });

    // ЛИНЕЙКА
    let rulerActive = false;
    let rulerPoints = [];
    let rulerPolyline = null;
    let rulerMarkers = [];

    function toggleRuler() {
        rulerActive = !rulerActive;
        const btn = document.getElementById('rulerBtn');
        const badge = document.getElementById('rulerBadge');

        if (rulerActive) {
            btn.classList.add('active');
            badge.classList.add('active');
            showToast("Кликайте по карте");
        } else {
            btn.classList.remove('active');
            badge.classList.remove('active');
            clearRuler();
        }
    }

    function addRulerPoint(latlng) {
        rulerPoints.push(latlng);
        const m = L.circleMarker(latlng, { radius: 4, color: '#3b82f6', fillColor: '#ffffff', fillOpacity: 1 }).addTo(map);
        rulerMarkers.push(m);

        if (rulerPoints.length > 1) {
            if (rulerPolyline) map.removeLayer(rulerPolyline);
            rulerPolyline = L.polyline(rulerPoints, { color: '#3b82f6', weight: 3, dashArray: '6, 6' }).addTo(map);

            let total = 0;
            for (let i = 0; i < rulerPoints.length - 1; i++) {
                total += rulerPoints[i].distanceTo(rulerPoints[i + 1]);
            }
            document.getElementById('rulerDist').innerText = (total / 1000).toFixed(1) + ' км';
        }
    }

    function clearRuler() {
        rulerPoints = [];
        if (rulerPolyline) map.removeLayer(rulerPolyline);
        rulerMarkers.forEach(m => map.removeLayer(m));
        rulerMarkers = [];
        document.getElementById('rulerDist').innerText = '0 км';
    }

    // ПОИСК И ГЕОЛОКАЦИЯ
    async function searchCity() {
        const q = document.getElementById('searchInput').value;
        if (!q) return;

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
            const data = await res.json();
            if (data.length > 0) {
                map.flyTo([data[0].lat, data[0].lon], 9, { duration: 1.2 });
            } else {
                showToast("Не найдено");
            }
        } catch (e) {
            showToast("Ошибка поиска");
        }
    }

    function locateUser() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(
            pos => map.flyTo([pos.coords.latitude, pos.coords.longitude], 10, { duration: 1.2 }),
            () => showToast("Геолокация недоступна")
        );
    }

    // ШТОРКА (БОКОВАЯ ПАНЕЛЬ)
    function toggleDrawer() {
        document.getElementById('drawerSheet').classList.toggle('active');
        document.getElementById('drawerOverlay').classList.toggle('active');
    }

    let toastTimer = null;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('active');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.classList.remove('active'); }, 2000);
    }

    initRadar();
</script>
</body>
</html>
