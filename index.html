<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Радиолокационная информация</title>

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:13px Arial,Helvetica,sans-serif;color:#000;background:#b1b1b1;-webkit-user-select:none;user-select:none}

#sh{margin:4px 4px 0;height:30px;border-radius:5px;background:linear-gradient(#f9b84e,#eeaf47);color:#fff;font:bold 15px/30px Arial;padding-left:16px;text-shadow:0 1px 1px #0005;cursor:move;touch-action:none}
#sc{position:absolute;right:9px;top:8px;width:20px;height:20px;border-radius:3px;background:#fbe08c;color:#e08a10;font:bold 15px/19px Arial;text-align:center;cursor:pointer;text-shadow:none}
#sx .yl{position:absolute;left:6px;top:40px;line-height:10px;font-size:10px}#sst{position:absolute;left:49px;top:45px;font:10px "Courier New",monospace}#sx canvas{position:absolute;left:42px;top:55px;background:#b8b8b8;border-left:1px solid #666;border-bottom:1px solid #666}
#sx .yt{position:absolute;left:22px;width:16px;text-align:right;font-size:10px;line-height:10px}#sx .xl{position:absolute;left:0;right:0;bottom:12px;text-align:center}
#zl{position:absolute;left:484px;top:67px;width:42px;background:#fff;text-align:left;font-size:11px;padding:0 0 1px 1px}#zl b{display:block;font-size:12px;line-height:14px;text-align:center;margin-bottom:1px}#zl div{height:11px;display:flex;align-items:center;font-size:11px}#zl i{width:14px;height:10px;border:1px solid #444;margin-right:3px;flex:none}
#dlg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9999}#dlg>div{background:#f0f0f0;border:1px solid #555;padding:12px;width:330px;max-width:92vw}#dlg label{display:block;margin:7px 0}#dlg input[type=text]{width:100%;margin-top:3px}#dlg button{width:100%;margin-top:6px;height:26px}
#msg{left:70px;bottom:92px;font-size:11px;color:#a00;background:#fffd;padding:0 4px;pointer-events:none}
@media(max-width:700px){#bp{font-size:11px}#hrs div,#hrs{font-size:10px}#dl{font-size:11px}#di{width:92px}#bp .dr .b{width:26px}#leg{transform:scale(.85);transform-origin:left bottom;bottom:92px}#logo{display:none}#sx{top:60px;right:2vw}}
</style></head><body>
<div id="map"></div>
<div class="ov" id="zc"><div id="zi">+</div><div id="zo">−</div></div>
<button class="ov wb" id="rl"><svg width="18" height="14" viewBox="0 0 18 14"><rect x="1" y="5" width="16" height="6" transform="rotate(-30 9 8)" fill="#e8e8e8" stroke="#333"/><path d="M4 9v-2M7 8v-2M10 6.5v-2M13 5v-2" stroke="#333" transform="rotate(-0 9 8)"/></svg></button>
<button class="ov wb" id="vc">VC</button>
<div class="ov" id="lp"><button class="wb" id="lb"><svg width="10" height="10" viewBox="0 0 10 10" style="vertical-align:-1px"><path d="M1 1h4M1 1v4M1 1l7 7" stroke="#000" fill="none"/><path d="M5 5l4 1-1 3z"/></svg></button><div id="li"></div><button class="wb" id="sat">Sat</button></div>
<div class="ov" id="leg"></div>
<div class="ov" id="logo"><svg width="40" height="44" viewBox="0 0 40 44"><circle cx="20" cy="22" r="19" fill="#fff" stroke="#1f5fa8" stroke-width="2"/><circle cx="20" cy="22" r="14" fill="#1f78d0"/><path d="M7 24q6-8 13 0t13 0" stroke="#fff" stroke-width="3" fill="none"/></svg><svg width="30" height="42" viewBox="0 0 30 42"><rect width="30" height="42" fill="#fff" stroke="#333"/><rect x="1" y="1" width="14" height="22" fill="#e8102e"/><rect x="15" y="1" width="14" height="22" fill="#1a4fb0"/><rect x="1" y="23" width="28" height="12" fill="#f4d000"/><text x="15" y="39" font-size="6" text-anchor="middle" fill="#a00" font-weight="bold">1941</text></svg></div>
<button class="ov" id="hp">?</button><button class="ov wb" id="fs"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 12L12 2M6 2h6v6" stroke="#4a76a8" stroke-width="2" fill="none"/></svg></button>
<div class="ov" id="ll">Шир: —  Дол: —</div><div class="ov" id="msg"></div>
<div class="ov" id="bp"><div class="tt" id="tt">Метеоявления</div><div class="st"><button class="b red" data-m="S">S</button><button class="b" data-m="R">R</button><button class="b" data-m="H">H</button></div>
<div class="dr"><span id="dl"></span><button class="b" id="n1">&lt;&lt;</button><button class="b" id="n2">&lt;</button><button class="b" id="n3">|&gt;</button><button class="b" id="n4">&gt;</button><button class="b" id="n5">&gt;&gt;</button><input id="di" type="date"><input id="ck" type="checkbox" title="Автообновление"></div>
<div id="hrs"></div><canvas id="bar" height="17"></canvas></div>
<div class="ov" id="sx"><div id="sh">Вертикальное сечение р/л отражаемости Z</div><div id="sc">×</div><div class="yl">Высота,<br>км</div><div id="sst"></div><canvas id="sp" width="440" height="222"></canvas><div id="yt"></div><div class="xl">Расстояние, км</div><div id="zl"></div></div>
<div id="dlg"><div><b>Настройки</b><label>Адрес сервера<input type="text" id="api" placeholder="https://your.server:8080"></label><label>URL спутниковых тайлов (Sat), {z}/{x}/{y}<input type="text" id="sau"></label><button id="ap">Применить</button><button id="cl">Закрыть</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,'0');
const L2=[['Обл. в. ср. яр.','#9caab1'],['Слоист. обл.','#a2c6ff'],['Ос. слаб.','#46ff93'],['Ос. умер.','#00c25a'],['Ос. сильн.','#009800'],['Куч. обл.','#ffff80'],['Лив. слаб.','#3e88ff'],['Лив. умер.','#0138ff'],['Лив. сильн.','#000074'],['Гроза (R)','#ffaa7f'],['Гроза R)','#ff557f'],['Гроза R','#ff0000'],['Град слаб.','#cc6600'],['Град умер.','#884400'],['Град сильн.','#5f0000'],['Гроз+Шкв слаб.','#ffaaff'],['Гроз+Шкв умер.','#ff55ff'],['Гроз+Шкв сильн.','#c700c7'],['Смерч','#3f3f5f']];
const P=L2.map(l=>[1,3,5].map(i=>parseInt(l[1].substr(i,2),16))),TOL=48;
const ZT=[-30,-10,-5,0,5,10,15,20,25,30,35,40,45,50,55,60,65,70],ZC=['#dcdcdc','#a6a6a4','#a9d3ec','#cdff97','#56ff3d','#10a5f9','#0c4bee','#0003b9','#000079','#ffff00','#ff8c00','#ff4a2a','#ff0000','#3fd01a','#0aa104','#ec08f3','#a405f5','#710100'];
$('leg').innerHTML=L2.map(l=>`<div><i style="background:${l[1]}"></i>${l[0]}</div>`).join('');
$('zl').innerHTML='<b>Z,dbZ</b>'+ZT.map((t,i)=>`<div><i style="background:${ZC[i]}"></i>&gt;${t<0?'-'+(-t):t}</div>`).join('');
const TTL={S:'Метеоявления',R:'Радиолокационная отражаемость',H:'Высота верхней границы облачности'};
const LG={wwlln:['WWLLN','#e6e600'],planeta:['Планета','#000'],vgi:['ВГИ','#e22'],alves:['Алвес','#f80']};
const S={api:localStorage.api||'',sat:localStorage.sat||'',m:'S',T:null,play:0,tm:null,auto:0,vc:0,rl:0,lg:{},tk:0};
$('li').innerHTML=Object.keys(LG).map(k=>`<div class="it off" data-k="${k}"><i style="color:${LG[k][1]}">+</i>${LG[k][0]}</div>`).join('');
const map=L.map('map',{zoomControl:false,worldCopyJump:true,minZoom:2,attributionControl:true}).setView([56,50],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap'}).addTo(map);
const msg=t=>$('msg').textContent=t||'';
const jf=async p=>{const r=await fetch(S.api+p);if(!r.ok)throw 0;return r.json()};
const wd=['вс','пн','вт','ср','чт','пт','сб'],mn=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const stp=d=>`${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}_${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00`;
const dstr=d=>`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const latest=()=>new Date(Math.floor(Date.now()/6e5)*6e5-6e5);S.T=latest();
// ---- нижняя панель ----
$('hrs').innerHTML=[...Array(24)].map((_,i)=>`<div data-h="${i}">${i}</div>`).join('');
function ui(){const d=S.T;$('dl').textContent=`${wd[d.getUTCDay()]}, ${d.getUTCDate()} ${mn[d.getUTCMonth()]} ${d.getUTCFullYear()} г., ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} UTC`;$('di').value=dstr(d);$('tt').textContent=TTL[S.m];
document.querySelectorAll('.st .b').forEach(b=>b.classList.toggle('red',b.dataset.m==S.m));$('leg').style.display=S.m=='S'?'block':'none';bar()}
function bar(){const c=$('bar'),w=c.width=$('bp').clientWidth-2,g=c.getContext('2d'),d0=Date.UTC(S.T.getUTCFullYear(),S.T.getUTCMonth(),S.T.getUTCDate()),nw=Date.now()-6e5;g.fillStyle='#d3d3d3';g.fillRect(0,0,w,17);
for(let i=0;i<144;i++){const t=d0+i*6e5,x=Math.round(i*w/144),x2=Math.round((i+1)*w/144),ok=t<=nw;g.fillStyle=ok?'#268c26':'#d3d3d3';g.fillRect(x,0,x2-x,17);g.fillStyle=ok?'#0d5a0d':'#fff';g.fillRect(x,0,1,17)}
const x=(S.T-d0)/864e5*w;g.fillStyle='#f0ff20';g.fillRect(Math.round(x)-1,0,3,17);document.querySelectorAll('#hrs div').forEach(e=>e.classList.toggle('c',+e.dataset.h==S.T.getUTCHours()))}
const setT=d=>{S.T=d;ui();show();if(S.vb)sect();lightning()};
$('n1').onclick=()=>setT(new Date(S.T-36e5));$('n2').onclick=()=>setT(new Date(S.T-6e5));$('n4').onclick=()=>setT(new Date(+S.T+6e5));$('n5').onclick=()=>setT(new Date(+S.T+36e5));
$('n3').onclick=()=>{S.play^=1;$('n3').classList.toggle('on',!!S.play);clearInterval(S.tm);if(S.play)S.tm=setInterval(()=>{const n=new Date(+S.T+6e5);setT(n>Date.now()?new Date(+S.T-36e5):n)},800)};
$('di').onchange=e=>{const [y,m,d]=e.target.value.split('-').map(Number);if(y)setT(new Date(Date.UTC(y,m-1,d,S.T.getUTCHours(),S.T.getUTCMinutes())))};
$('hrs').onclick=e=>{const h=e.target.dataset.h;if(h!=null)setT(new Date(Date.UTC(S.T.getUTCFullYear(),S.T.getUTCMonth(),S.T.getUTCDate(),+h)))};
$('bar').onclick=e=>{const r=e.target.getBoundingClientRect(),f=(e.clientX-r.left)/r.width,d0=Date.UTC(S.T.getUTCFullYear(),S.T.getUTCMonth(),S.T.getUTCDate());setT(new Date(d0+Math.floor(f*144)*6e5))};
$('ck').onchange=e=>{S.auto=+e.target.checked;if(S.auto)setT(latest())};setInterval(()=>{if(S.auto){S.T=latest();ui();show()}},60000);
document.querySelectorAll('.st .b').forEach(b=>b.onclick=()=>{S.m=b.dataset.m;ui();show()});
// ---- радары и кадры ----
let RD=[],OV={},RG=[],C={};
async function init(){if(!S.api){msg('Укажите адрес сервера: кнопка «?»');return}try{RD=await jf('/api/radars');msg('');RG.forEach(x=>x.remove());RG=RD.map(r=>L.circleMarker([r.lat,r.lon],{radius:3,color:'#2a8a2a',weight:1,fillOpacity:0}).addTo(map).bindTooltip(r.name));show()}catch(e){msg('сервер недоступен: '+S.api)}}
async function frame(r,ts){const k=r.id+ts;if(C[k])return C[k];const im=new Image();im.crossOrigin='anonymous';await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=`${S.api}/api/img/${r.id}/${ts}?p=4&m=S`});
const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);const d=g.getImageData(0,0,c.width,c.height).data,a=new Int8Array(c.width*c.height);
for(let p=0;p<a.length;p++){a[p]=-1;if(d[p*4+3]<128)continue;let m=1e9,q0=-1;for(let q=0;q<19;q++){const e=(d[p*4]-P[q][0])**2+(d[p*4+1]-P[q][1])**2+(d[p*4+2]-P[q][2])**2;if(e<m){m=e;q0=q}}if(m<=TOL*TOL)a[p]=q0}return C[k]={w:c.width,h:c.height,a}}
function url(f){const c=document.createElement('canvas');c.width=f.w;c.height=f.h;const g=c.getContext('2d'),im=g.createImageData(f.w,f.h),d=im.data;for(let p=0;p<f.a.length;p++){const q=f.a[p];if(q<0)continue;d[p*4]=P[q][0];d[p*4+1]=P[q][1];d[p*4+2]=P[q][2];d[p*4+3]=255}g.putImageData(im,0,0);return c.toDataURL()}
async function show(){if(!RD.length)return;const z=map.getZoom(),b=map.getBounds(),tk=++S.tk,ts=stp(S.T),bb=r=>[[r.bounds[0],r.bounds[1]],[r.bounds[2],r.bounds[3]]];
const vis=z>=5?RD.filter(r=>b.intersects(bb(r))).slice(0,10):[];Object.keys(OV).forEach(id=>{if(!vis.find(r=>r.id==id)){OV[id].remove();delete OV[id]}});let bad=0;
await Promise.all(vis.map(async r=>{try{const src=S.m=='S'?url(await frame(r,ts)):`${S.api}/api/img/${r.id}/${ts}?p=4&m=${S.m}`;if(tk!=S.tk)return;if(OV[r.id])OV[r.id].setUrl(src);else OV[r.id]=L.imageOverlay(src,bb(r),{opacity:.92,zIndex:300}).addTo(map)}catch(e){bad++;if(OV[r.id]){OV[r.id].remove();delete OV[r.id]}}}));
if(tk==S.tk)msg(vis.length&&bad==vis.length?'нет данных за '+ts+' UTC':z<5&&RD.length?'приблизьте карту (zoom ≥ 5)':'')}
map.on('moveend',()=>{show();lightning()});
// ---- координаты ----
const dms=v=>{const a=Math.abs(v),d=Math.floor(a),m=Math.floor((a-d)*60),s=Math.round(((a-d)*60-m)*60);return d+'°'+pad(m)+"'"+pad(s)+'"'};
map.on('mousemove',e=>$('ll').textContent=`Шир: ${dms(e.latlng.lat)} Дол: ${dms(e.latlng.lng)}`);
// ---- кнопки на карте ----
$('zi').onclick=()=>map.zoomIn();$('zo').onclick=()=>map.zoomOut();
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
$('lb').onclick=()=>{const v=$('li').style.display=='none';$('li').style.display=v?'':'none';$('sat').style.display=v?'':'none'};
$('hp').onclick=()=>{$('api').value=S.api;$('sau').value=S.sat;$('dlg').style.display='flex'};$('cl').onclick=()=>$('dlg').style.display='none';
$('ap').onclick=()=>{S.api=$('api').value.trim().replace(/\/$/,'');S.sat=$('sau').value.trim();localStorage.api=S.api;localStorage.sat=S.sat;$('dlg').style.display='none';C={};init()};
let satL=null;$('sat').onclick=()=>{if(satL){satL.remove();satL=null;$('sat').classList.remove('on');return}if(!S.sat){msg('Sat: укажите URL тайлов в «?»');return}satL=L.tileLayer(S.sat,{zIndex:100}).addTo(map);$('sat').classList.add('on')};
// ---- молнии ----
const LL={};async function lightning(){for(const k in LG){if(LL[k]){LL[k].remove();delete LL[k]}if(!S.lg[k]||!S.api)continue;try{const b=map.getBounds(),t1=new Date(+S.T+6e5).toISOString(),t0=new Date(+S.T).toISOString(),j=await jf(`/api/lightning?src=${k}&from=${t0}&to=${t1}&s=${b.getSouth()}&w=${b.getWest()}&n=${b.getNorth()}&e=${b.getEast()}`);
if(!S.lg[k])continue;LL[k]=L.layerGroup(j.slice(0,3000).map(p=>L.marker(p,{interactive:false,icon:L.divIcon({className:'',html:`<b style="color:${LG[k][1]};font:bold 16px/10px Arial;position:absolute;left:-5px;top:-5px">+</b>`,iconSize:[0,0]})}))).addTo(map)}catch(e){msg('молнии '+LG[k][0]+': нет данных')}}}
$('li').onclick=e=>{const k=e.target.closest('.it');if(!k)return;const n=k.dataset.k;S.lg[n]=!S.lg[n];k.classList.toggle('off',!S.lg[n]);lightning()};
// ---- линейка ----
let rp=[],rpl=null,rtt=null;$('rl').onclick=()=>{S.rl^=1;$('rl').classList.toggle('on',!!S.rl);if(!S.rl){rp=[];if(rpl)rpl.remove();if(rtt)rtt.remove();rpl=rtt=null}else{S.vc=0;$('vc').classList.remove('on')}};
// ---- вертикальное сечение ----
let va,vb,vl,vm=[];$('vc').onclick=()=>{S.vc^=1;$('vc').classList.toggle('on',!!S.vc);if(S.vc){S.rl=0;$('rl').classList.remove('on');vclear()}else vclear()};
function vclear(){va=vb=S.va=S.vb=null;if(vl)vl.remove();vm.forEach(m=>m.remove());vm=[];vl=null;$('sx').style.display='none'}
map.on('click',e=>{if(S.rl){rp.push(e.latlng);if(rpl)rpl.setLatLngs(rp);else rpl=L.polyline(rp,{color:'#222',weight:2,dashArray:'4 3'}).addTo(map);let d=0;for(let i=1;i<rp.length;i++)d+=rp[i-1].distanceTo(rp[i]);if(rtt)rtt.remove();rtt=L.tooltip({permanent:true,direction:'right'}).setLatLng(e.latlng).setContent((d/1000).toFixed(1)+' км').addTo(map);return}
if(!S.vc)return;if(!S.va){S.va=e.latlng;vm.push(L.marker(e.latlng,{interactive:false,icon:L.divIcon({className:'',html:'<div style="color:#7a1030;font:bold 12px Arial;margin:-8px 0 0 -4px">▲A</div>',iconSize:[0,0]})}).addTo(map))}
else if(!S.vb){S.vb=e.latlng;vl=L.polyline([S.va,S.vb],{color:'#7a1030',weight:1.5,interactive:false}).addTo(map);vm.push(L.circleMarker(S.vb,{radius:4,color:'#c33',weight:2,fillOpacity:0}).addTo(map));S.vc=0;$('vc').classList.remove('on');sect()}});
for(let k=1;k<=15;k++){const d=document.createElement('div');d.className='yt';d.style.top=(55+222*(15-k)/15+2)+'px';d.textContent=k;$('yt').appendChild(d)}
async function sect(){$('sx').style.display='block';const c=$('sp'),g=c.getContext('2d');g.fillStyle='#b8b8b8';g.fillRect(0,0,440,222);$('sst').textContent='Данные загружаются...';
const mid=L.latLng((S.va.lat+S.vb.lat)/2,(S.va.lng+S.vb.lng)/2);let r=RD.slice().sort((a,b)=>mid.distanceTo([a.lat,a.lon])-mid.distanceTo([b.lat,b.lon]))[0];
try{if(!r)throw 0;const j=await jf(`/api/section?id=${r.id}&ts=${stp(S.T)}&a=${S.va.lat},${S.va.lng}&b=${S.vb.lat},${S.vb.lng}`),n=j.z.length,cw=440/n,rh=222/15;$('sst').textContent='';
j.z.forEach((col,i)=>col.forEach((v,k)=>{if(v==null||v<=-30)return;let q=0;while(q+1<ZT.length&&v>ZT[q+1])q++;g.fillStyle=ZC[q];g.fillRect(Math.floor(i*cw),Math.round(222-(k+1)*rh),Math.ceil(cw),Math.ceil(rh))}));
g.strokeStyle='#888';g.setLineDash([4,3]);[5,10,15].forEach(k=>{g.beginPath();g.moveTo(0,222-k*rh+.5);g.lineTo(440,222-k*rh+.5);g.stroke()});g.setLineDash([])}catch(e){$('sst').textContent='Нет данных вертикального сечения (сервер не отдаёт объёмные данные)'}}
$('sc').onclick=()=>$('sx').style.display='none';
(()=>{const h=$('sh'),w=$('sx');let o=null;h.onpointerdown=e=>{h.setPointerCapture(e.pointerId);const r=w.getBoundingClientRect();o=[e.clientX-r.left,e.clientY-r.top]};h.onpointermove=e=>{if(!o)return;w.style.left=(e.clientX-o[0])+'px';w.style.top=(e.clientY-o[1])+'px';w.style.right='auto'};h.onpointerup=()=>o=null})();
addEventListener('resize',bar);ui();init();
</script></body></html>
