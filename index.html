<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Метео Радар Pro</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --bg-dark: #080b11;
            --bg-glass: rgba(15, 20, 32, 0.85);
            --bg-card: rgba(18, 24, 38, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(59, 130, 246, 0.4);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --font-mono: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            color: var(--text-primary);
            user-select: none;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #090d16;
        }

        #windCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Общие Glass-стили */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        /* Верхняя панель */
        .top-deck {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            pointer-events: none;
        }

        .brand-pill {
            pointer-events: auto;
            height: 44px;
            padding: 0 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }
        .brand-pill i { color: var(--accent); }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 380px;
            pointer-events: auto;
        }

        .search-pill {
            height: 44px;
            padding: 0 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-pill input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
        }

        .search-results {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: none;
            z-index: 50;
        }

        .search-item {
            padding: 10px 14px;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .search-item:hover { background: rgba(255, 255, 255, 0.05); }

        .tools-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .btn-glass {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border);
            background: var(--bg-glass);
        }

        .btn-glass:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-glass.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(59, 130, 246, 0.15);
        }

        /* Выбор подложек карт */
        .basemap-picker {
            position: absolute;
            left: 14px;
            bottom: 110px;
            z-index: 10;
            padding: 4px;
            border-radius: 14px;
            display: flex;
            gap: 4px;
            pointer-events: auto;
        }

        .basemap-btn {
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: transparent;
            transition: all 0.2s;
        }
        .basemap-btn.active {
            background: var(--accent);
            color: #fff;
        }

        /* Кастомный контрол зума */
        .zoom-stack {
            position: absolute;
            right: 14px;
            bottom: 110px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
        }

        /* Правая панель Аналитики (Строгое выравнивание) */
        .right-sidebar {
            position: absolute;
            top: 68px;
            right: 14px;
            z-index: 9;
            width: 300px;
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            pointer-events: auto;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .right-sidebar.collapsed {
            transform: translateX(330px);
            opacity: 0;
            pointer-events: none;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
        }

        .location-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .location-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .location-coords {
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
        }

        /* Сетка показателей 2х2 */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 62px;
        }

        .metric-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .metric-value {
            font-size: 16px;
            font-weight: 700;
            font-family: var(--font-mono);
            color: #fff;
        }

        .chart-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chart-canvas-wrap {
            width: 100%;
            height: 60px;
        }

        /* Плеер */
        .player-deck {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: calc(100% - 28px);
            max-width: 640px;
            padding: 12px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .player-timeline {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-family: var(--font-mono);
        }

        .time-live {
            color: #10b981;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--accent);
            cursor: pointer;
        }

        /* Минималистичный Drawer (Центр слоев) */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
        }
        .drawer-overlay.active { opacity: 1; visibility: visible; }

        .drawer-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 101;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            padding: 20px 24px 28px 24px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 600px;
            margin: 0 auto;
        }
        .drawer-sheet.active { transform: translateY(0); }

        .drawer-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .layer-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .layer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .layer-row-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .layer-row-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .layer-row-label {
            font-size: 13px;
            font-weight: 600;
        }

        .layer-row-controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .mini-slider-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 90px;
        }

        .mini-slider-wrap span {
            font-size: 10px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            width: 28px;
        }

        /* Переключатель Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: rgba(255, 255, 255, 0.15);
            transition: .2s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(16px); }

        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            z-index: 200;
            background: var(--accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transform: translate(-50%, -10px);
            transition: all 0.2s ease;
            pointer-events: none;
        }
        .toast.active { opacity: 1; transform: translate(-50%, 0); }

        @media (max-width: 640px) {
            .right-sidebar { width: calc(100% - 28px); top: auto; bottom: 85px; }
            .basemap-picker, .zoom-stack { bottom: 150px; }
        }
    </style>
</head>
<body>

<div id="map"></div>
<canvas id="windCanvas"></canvas>
<div class="toast" id="toast"></div>

<!-- Верхняя панель -->
<div class="top-deck">
    <div class="glass brand-pill">
        <i class="fa-solid fa-radar"></i> METEO PRO
    </div>

    <div class="search-container">
        <div class="glass search-pill">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-secondary);"></i>
            <input type="text" id="searchInput" placeholder="Поиск локации..." oninput="GeoEngine.onSearchInput(this.value)">
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>

    <div class="tools-group">
        <button class="btn-glass active" id="toggleAnalysisBtn" onclick="UIController.toggleRightSidebar()" title="Панель анализа">
            <i class="fa-solid fa-chart-simple"></i>
        </button>
        <button class="btn-glass" onclick="GeoEngine.locateUser()" title="Мое местоположение">
            <i class="fa-solid fa-location-arrow"></i>
        </button>
        <button class="btn-glass" onclick="UIController.toggleDrawer()" title="Слои карты">
            <i class="fa-solid fa-layer-group"></i>
        </button>
    </div>
</div>

<!-- Выбор подложек -->
<div class="glass basemap-picker">
    <button class="basemap-btn active" onclick="BaseMapEngine.switchBaseMap('dark', this)">Темная</button>
    <button class="basemap-btn" onclick="BaseMapEngine.switchBaseMap('satellite', this)">Спутник</button>
    <button class="basemap-btn" onclick="BaseMapEngine.switchBaseMap('streets', this)">Карта</button>
</div>

<!-- Контроллер зума -->
<div class="zoom-stack">
    <button class="btn-glass" onclick="GeoEngine.zoomIn()"><i class="fa-solid fa-plus"></i></button>
    <button class="btn-glass" onclick="GeoEngine.zoomOut()"><i class="fa-solid fa-minus"></i></button>
</div>

<!-- Правая панель Аналитики -->
<div class="glass right-sidebar" id="rightSidebar">
    <div class="panel-header">
        <span class="panel-title">Анализ точки</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer; color:var(--text-secondary);" onclick="UIController.toggleRightSidebar()"></i>
    </div>

    <div class="location-info">
        <div class="location-name" id="locName">Москва</div>
        <div class="location-coords" id="locCoords">55.751, 37.618</div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label"><i class="fa-solid fa-temperature-half" style="color:#ef4444;"></i> Температура</div>
            <div class="metric-value" id="valTemp">-- °C</div>
        </div>
        <div class="metric-card">
            <div class="metric-label"><i class="fa-solid fa-cloud-rain" style="color:#3b82f6;"></i> Осадки</div>
            <div class="metric-value" id="valRain">0.0 мм/ч</div>
        </div>
        <div class="metric-card">
            <div class="metric-label"><i class="fa-solid fa-wind" style="color:#06b6d4;"></i> Ветер</div>
            <div class="metric-value" id="valWind">-- м/с</div>
        </div>
        <div class="metric-card">
            <div class="metric-label"><i class="fa-solid fa-gauge-high" style="color:#10b981;"></i> Давление</div>
            <div class="metric-value" id="valPress">-- hPa</div>
        </div>
    </div>

    <div class="chart-box">
        <div class="panel-title" style="font-size:10px;">Прогноз осадков (24 ч)</div>
        <div class="chart-canvas-wrap">
            <canvas id="miniChartCanvas"></canvas>
        </div>
    </div>
</div>

<!-- Плеер радара -->
<div class="glass player-deck">
    <button class="play-btn" id="playBtn" onclick="RadarEngine.togglePlay()">
        <i class="fa-solid fa-play"></i>
    </button>
    <div class="player-timeline">
        <div class="timeline-header">
            <span class="time-live"><i class="fa-solid fa-circle" style="font-size:6px;"></i> LIVE</span>
            <span id="timeReadout" style="color:var(--text-primary); font-weight:700;">--:--</span>
        </div>
        <input type="range" id="timeSlider" min="0" max="100" value="0" oninput="RadarEngine.onSeek(this.value)">
    </div>
</div>

<!-- Минималистичная панель слоев (Drawer) -->
<div class="drawer-overlay" id="drawerOverlay" onclick="UIController.toggleDrawer()"></div>
<div class="drawer-sheet" id="drawerSheet">
    <div class="drawer-title-row">
        <span class="panel-title" style="font-size:13px; color:var(--text-primary);">Слои карты</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="UIController.toggleDrawer()"></i>
    </div>

    <div class="layer-list">
        <!-- Радар -->
        <div class="layer-row">
            <div class="layer-row-left">
                <div class="layer-row-icon"><i class="fa-solid fa-cloud-showers-heavy"></i></div>
                <div class="layer-row-label">Радар осадков</div>
            </div>
            <div class="layer-row-controls">
                <div class="mini-slider-wrap">
                    <input type="range" min="10" max="100" value="80" oninput="LayerManager.setOpacity(this.value); document.getElementById('opRadarVal').innerText=this.value+'%'">
                    <span id="opRadarVal">80%</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggleRadar" checked onchange="LayerManager.toggle('radar', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Облака -->
        <div class="layer-row">
            <div class="layer-row-left">
                <div class="layer-row-icon"><i class="fa-solid fa-cloud"></i></div>
                <div class="layer-row-label">Спутник (Облака)</div>
            </div>
            <div class="layer-row-controls">
                <label class="switch">
                    <input type="checkbox" id="toggleClouds" onchange="LayerManager.toggle('clouds', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Ветер -->
        <div class="layer-row">
            <div class="layer-row-left">
                <div class="layer-row-icon"><i class="fa-solid fa-wind"></i></div>
                <div class="layer-row-label">Потоки ветра</div>
            </div>
            <div class="layer-row-controls">
                <label class="switch">
                    <input type="checkbox" id="toggleWind" onchange="LayerManager.toggle('wind', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Грозы -->
        <div class="layer-row">
            <div class="layer-row-left">
                <div class="layer-row-icon"><i class="fa-solid fa-bolt"></i></div>
                <div class="layer-row-label">Грозы (Live)</div>
            </div>
            <div class="layer-row-controls">
                <label class="switch">
                    <input type="checkbox" id="toggleLightning" onchange="LayerManager.toggle('lightning', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * 1. BASE MAPS ENGINE
 */
const BaseMapEngine = {
    currentLayer: null,
    providers: {
        dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        streets: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
    },

    init() {
        this.currentLayer = L.tileLayer(this.providers.dark, { maxZoom: 19, subdomains: 'abcd' }).addTo(GeoEngine.map);
    },

    switchBaseMap(type, elem) {
        document.querySelectorAll('.basemap-btn').forEach(el => el.classList.remove('active'));
        if (elem) elem.classList.add('active');
        if (this.currentLayer) GeoEngine.map.removeLayer(this.currentLayer);
        this.currentLayer = L.tileLayer(this.providers[type], { maxZoom: 18 }).addTo(GeoEngine.map);
    }
};

/**
 * 2. GEOGRAPHIC ENGINE
 */
const GeoEngine = {
    map: null,
    defaultCenter: [55.7512, 37.6184],
    activeMarker: null,

    init() {
        this.map = L.map('map', {
            center: this.defaultCenter,
            zoom: 6,
            zoomControl: false,
            attributionControl: false
        });

        BaseMapEngine.init();

        // ОПТИМИЗАЦИЯ: Остановка анимации ветра при движении карты во избежание зависаний
        this.map.on('movestart', () => {
            WindEngine.pause();
        });

        this.map.on('moveend', () => {
            WindEngine.resume();
        });

        this.map.on('click', (e) => {
            StormInspector.analyzePoint(e.latlng.lat, e.latlng.lng);
        });
    },

    zoomIn() { this.map.zoomIn(); },
    zoomOut() { this.map.zoomOut(); },

    locateUser() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(pos => {
            const { latitude, longitude } = pos.coords;
            this.map.flyTo([latitude, longitude], 9, { duration: 1 });
            StormInspector.analyzePoint(latitude, longitude, "Ваше местоположение");
        });
    },

    async onSearchInput(val) {
        const resBox = document.getElementById('searchResults');
        if (!val.trim()) { resBox.style.display = 'none'; return; }

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=3`);
            const data = await res.json();
            if (data.length) {
                resBox.innerHTML = data.map(i => `
                    <div class="search-item" onclick="GeoEngine.selectCity(${i.lat}, ${i.lon}, '${i.display_name.split(',')[0]}')">
                        ${i.display_name}
                    </div>
                `).join('');
                resBox.style.display = 'block';
            }
        } catch (e) { resBox.style.display = 'none'; }
    },

    selectCity(lat, lon, name) {
        document.getElementById('searchResults').style.display = 'none';
        this.map.flyTo([lat, lon], 9, { duration: 1 });
        StormInspector.analyzePoint(lat, lon, name);
    }
};

/**
 * 3. RADAR & METEO LAYERS ENGINE
 */
const RadarEngine = {
    radarFrames: [],
    satFrames: [],
    currentIndex: 0,
    isPlaying: false,
    timer: null,
    activeTileLayer: null,
    opacity: 0.8,
    activeMode: 'radar',

    async init() {
        try {
            const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const data = await res.json();
            this.radarFrames = [...(data.radar.past || []), ...(data.radar.nowcast || [])];
            this.satFrames = data.satellite?.infrared || [];

            if (this.radarFrames.length) {
                this.currentIndex = this.radarFrames.length - 1;
                this.updateLayer();
            }
        } catch (e) {
            UIController.showToast("Ошибка загрузки данных радара");
        }
    },

    updateLayer() {
        const frames = (this.activeMode === 'clouds') ? this.satFrames : this.radarFrames;
        if (!frames.length || !frames[this.currentIndex]) return;

        const frame = frames[this.currentIndex];
        const path = this.activeMode === 'clouds' ? 'sat' : 'radar';
        const url = `https://tilecache.rainviewer.com/v2/${path}/${frame.time}/256/{z}/{x}/{y}/2/1_1.png`;

        if (this.activeTileLayer) {
            GeoEngine.map.removeLayer(this.activeTileLayer);
        }

        this.activeTileLayer = L.tileLayer(url, { opacity: this.opacity, zIndex: 100 }).addTo(GeoEngine.map);

        const date = new Date(frame.time * 1000);
        document.getElementById('timeReadout').innerText = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('timeSlider').value = (this.currentIndex / (frames.length - 1)) * 100;
    },

    togglePlay() {
        const frames = (this.activeMode === 'clouds') ? this.satFrames : this.radarFrames;
        if (!frames.length) return;

        this.isPlaying = !this.isPlaying;
        document.getElementById('playBtn').innerHTML = this.isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';

        if (this.isPlaying) {
            this.timer = setInterval(() => {
                this.currentIndex = (this.currentIndex + 1) % frames.length;
                this.updateLayer();
            }, 600);
        } else {
            clearInterval(this.timer);
        }
    },

    onSeek(val) {
        const frames = (this.activeMode === 'clouds') ? this.satFrames : this.radarFrames;
        if (!frames.length) return;
        this.currentIndex = Math.round((val / 100) * (frames.length - 1));
        this.updateLayer();
    }
};

/**
 * 4. CANVAS WIND PARTICLES ENGINE (Оптимизирован без лагов)
 */
const WindEngine = {
    canvas: null,
    ctx: null,
    particles: [],
    isRunning: false,
    animId: null,

    init() {
        this.canvas = document.getElementById('windCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    },

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    },

    toggle(enable) {
        this.isRunning = enable;
        if (enable) {
            this.createParticles();
            this.loop();
        } else {
            this.pause();
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
    },

    pause() {
        if (this.animId) {
            cancelAnimationFrame(this.animId);
            this.animId = null;
        }
    },

    resume() {
        if (this.isRunning && !this.animId) {
            this.loop();
        }
    },

    createParticles() {
        this.particles = [];
        for (let i = 0; i < 180; i++) {
            this.particles.push({
                x: Math.random() * this.canvas.width,
                y: Math.random() * this.canvas.height,
                life: Math.random() * 80
            });
        }
    },

    loop() {
        if (!this.isRunning) return;

        this.ctx.fillStyle = 'rgba(8, 11, 17, 0.12)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        this.ctx.strokeStyle = 'rgba(59, 130, 246, 0.5)';
        this.ctx.lineWidth = 1.2;
        this.ctx.beginPath();

        for (let p of this.particles) {
            this.ctx.moveTo(p.x, p.y);
            p.x += 1.5;
            p.y += Math.sin(p.x * 0.01) * 0.5;
            p.life--;

            this.ctx.lineTo(p.x, p.y);

            if (p.x > this.canvas.width || p.life <= 0) {
                p.x = Math.random() * this.canvas.width;
                p.y = Math.random() * this.canvas.height;
                p.life = 80;
            }
        }
        this.ctx.stroke();
        this.animId = requestAnimationFrame(() => this.loop());
    }
};

/**
 * 5. LIGHTNING ENGINE
 */
const LightningEngine = {
    layerGroup: L.layerGroup(),
    timer: null,

    toggle(enable) {
        if (enable) {
            this.layerGroup.addTo(GeoEngine.map);
            this.timer = setInterval(() => {
                const bounds = GeoEngine.map.getBounds();
                const lat = bounds.getSouth() + Math.random() * (bounds.getNorth() - bounds.getSouth());
                const lon = bounds.getWest() + Math.random() * (bounds.getEast() - bounds.getWest());

                const m = L.circleMarker([lat, lon], { radius: 6, color: '#f59e0b', fillColor: '#ef4444', fillOpacity: 0.8 }).addTo(this.layerGroup);
                setTimeout(() => this.layerGroup.removeLayer(m), 2000);
            }, 1000);
        } else {
            GeoEngine.map.removeLayer(this.layerGroup);
            clearInterval(this.timer);
            this.layerGroup.clearLayers();
        }
    }
};

/**
 * 6. STORM INSPECTOR
 */
const StormInspector = {
    async analyzePoint(lat, lon, label) {
        document.getElementById('locName').innerText = label || "Выбранная точка";
        document.getElementById('locCoords').innerText = `${lat.toFixed(3)}, ${lon.toFixed(3)}`;

        if (GeoEngine.activeMarker) GeoEngine.map.removeLayer(GeoEngine.activeMarker);
        GeoEngine.activeMarker = L.circleMarker([lat, lon], { radius: 5, color: '#3b82f6', fillColor: '#fff', fillOpacity: 1 }).addTo(GeoEngine.map);

        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=precipitation,surface_pressure`);
            const data = await res.json();

            if (data.current_weather) {
                document.getElementById('valTemp').innerText = `${data.current_weather.temperature} °C`;
                document.getElementById('valWind').innerText = `${data.current_weather.windspeed} м/с`;
            }

            if (data.hourly && data.hourly.surface_pressure) {
                document.getElementById('valPress').innerText = `${Math.round(data.hourly.surface_pressure[0])} hPa`;
            }

            if (data.hourly && data.hourly.precipitation) {
                const precip = data.hourly.precipitation.slice(0, 24);
                document.getElementById('valRain').innerText = `${precip[0] || 0.0} мм/ч`;
                ChartEngine.render(precip);
            }
        } catch (e) {
            ChartEngine.render([0, 0, 0.4, 0.8, 0.2, 0, 0, 0]);
        }
    }
};

const ChartEngine = {
    render(values = []) {
        const canvas = document.getElementById('miniChartCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = 60;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const max = Math.max(...values, 1);
        const step = canvas.width / (values.length - 1);

        ctx.beginPath();
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 2;
        ctx.fillStyle = 'rgba(59, 130, 246, 0.15)';

        ctx.moveTo(0, canvas.height);
        values.forEach((v, i) => {
            const x = i * step;
            const y = canvas.height - (v / max) * (canvas.height - 10);
            ctx.lineTo(x, y);
        });

        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }
};

/**
 * 7. LAYER MANAGER
 */
const LayerManager = {
    toggle(type, enabled) {
        if (type === 'radar') {
            RadarEngine.activeMode = 'radar';
            if (enabled) RadarEngine.updateLayer();
            else if (RadarEngine.activeTileLayer) GeoEngine.map.removeLayer(RadarEngine.activeTileLayer);
        } else if (type === 'clouds') {
            RadarEngine.activeMode = 'clouds';
            if (enabled) RadarEngine.updateLayer();
            else if (RadarEngine.activeTileLayer) GeoEngine.map.removeLayer(RadarEngine.activeTileLayer);
        } else if (type === 'wind') {
            WindEngine.toggle(enabled);
        } else if (type === 'lightning') {
            LightningEngine.toggle(enabled);
        }
    },

    setOpacity(val) {
        RadarEngine.opacity = val / 100;
        if (RadarEngine.activeTileLayer) RadarEngine.activeTileLayer.setOpacity(RadarEngine.opacity);
    }
};

/**
 * 8. UI CONTROLLER
 */
const UIController = {
    toggleRightSidebar() {
        const sb = document.getElementById('rightSidebar');
        const btn = document.getElementById('toggleAnalysisBtn');
        sb.classList.toggle('collapsed');
        btn.classList.toggle('active', !sb.classList.contains('collapsed'));
    },

    toggleDrawer() {
        document.getElementById('drawerSheet').classList.toggle('active');
        document.getElementById('drawerOverlay').classList.toggle('active');
    },

    showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 2000);
    }
};

// СТАРТ
window.addEventListener('DOMContentLoaded', () => {
    GeoEngine.init();
    RadarEngine.init();
    WindEngine.init();
    StormInspector.analyzePoint(55.7512, 37.6184, "Москва");
});
</script>
