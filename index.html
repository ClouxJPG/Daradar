<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Quantum Meteo — Радиолокационная информация</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
*{box-sizing:border-box}

:root{
 --sat:env(safe-area-inset-top,0px);
 --sar:env(safe-area-inset-right,0px);
 --sab:env(safe-area-inset-bottom,0px);
 --sal:env(safe-area-inset-left,0px)
}

html,body{
 margin:0;
 height:100%;
 overflow:hidden;
 font:16px Arial,Helvetica,sans-serif;
 color:#000;
 background:#b1b1b1;
 -webkit-user-select:none;
 user-select:none
}

#map{
 position:absolute;
 inset:0;
 background:#b1b1b1
}

.leaflet-tile-pane{
 filter:saturate(.3) brightness(.94) contrast(.92)
}

.leaflet-image-layer{
 image-rendering:pixelated
}

.leaflet-container{
 font:15px Arial
}

.ov{
 position:absolute;
 z-index:1000;
}

.wb{
 background:#f2f2f2;
 border:1px solid #aaa;
 border-radius:5px;
 box-shadow:0 1px 3px #0004;
 cursor:pointer;
 padding:0;
 font:15px Arial;
 color:#000;
 -webkit-tap-highlight-color:transparent;
 touch-action:manipulation
}

.wb.on{
 background:#9fc3e8;
 border-color:#4a76a8
}

/* =========================================================
   ЛЕВЫЕ КНОПКИ
   ========================================================= */

#zc{
 left:10px;
 top:calc(10px + var(--sat));
 width:34px;
 height:66px;
 background:#6b7da1;
 border-radius:5px;
 border:2px solid #ffffff55;
 display:flex;
 flex-direction:column;
 color:#fff;
 font:bold 28px/30px Arial;
 text-align:center
}

#zc div{
 flex:1;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center
}

#rl{
 left:54px;
 top:17px;
 width:37px;
 height:33px;
 touch-action:manipulation
}

#vc{
 left:99px;
 top:17px;
 width:38px;
 height:33px;
 font-size:15px;
 font-weight:600;
 touch-action:manipulation
}

/* =========================================================
   ПАНЕЛЬ СЛОЁВ — УМЕНЬШЕНА
   ========================================================= */

#lp{
 left:0;
 top:calc(84px + var(--sat));
 width:145px;
 background:rgba(224,224,224,.82);
 padding:3px 2px 4px;
 line-height:20px;
 font-size:12px
}

#lp .wb{
 height:21px;
 line-height:19px;
 padding:0 3px;
 border-radius:3px;
 margin:0 2px
}

#lp .it{
 cursor:pointer;
 display:flex;
 align-items:center;
 height:23px;
 padding-left:3px;
 white-space:nowrap
}

#lp .it i{
 font:bold 17px/11px Arial;
 font-style:normal;
 width:17px;
 margin-right:3px;
 display:inline-block;
 text-align:center
}

#lp .it span{
 overflow:hidden;
 text-overflow:ellipsis
}

#lp .it.off{
 opacity:.35
}

/* =========================================================
   ЛЕГЕНДА
   ========================================================= */

#leg{
 left:var(--sal);
 bottom:var(--sab);
 width:145px;
 max-height:calc(100vh - 10px - var(--sat) - var(--sab));
 overflow:auto;
 background:rgba(200,200,200,.68);
 padding:4px 3px 3px 4px;
 font-size:14px
}

#leg div{
 height:20px;
 display:flex;
 align-items:center;
 white-space:nowrap
}

#leg i{
 width:17px;
 height:17px;
 margin-right:4px;
 border:1px solid #333;
 flex:none
}

/* =========================================================
   QUANTUM METEO
   ========================================================= */

#logo{
 right:calc(9px + var(--sar));
 top:calc(6px + var(--sat));
 width:174px;
 height:66px;
 display:flex;
 align-items:center;
 justify-content:center;
 pointer-events:none
}

#qm-mark{
 width:170px;
 height:62px;
 display:flex;
 align-items:center;
 justify-content:flex-end
}

#qm-svg{
 width:170px;
 height:62px;
 display:block;
 filter:drop-shadow(0 1px 2px #0003)
}

/* =========================================================
   ПРАВАЯ КНОПКА
   ========================================================= */

#fs{
 right:calc(8px + var(--sar));
 top:calc(9px + var(--sat));
 width:35px;
 height:35px;
 background:#e8eef8cc
}

/* =========================================================
   НИЖНЯЯ ПАНЕЛЬ / ТАЙМЛАЙН
   ========================================================= */

#bp{
 right:var(--sar);
 bottom:var(--sab);
 width:min(570px,calc(100vw - var(--sal) - var(--sar)));
 max-width:calc(100vw - var(--sal) - var(--sar));
 border:1px solid #444;
 background:#e2e2e2;
 font-size:16px;
 overflow:hidden;
 z-index:1100
}

#bp .tt{
 min-height:22px;
 line-height:21px;
 background:#dcdcdc;
 padding:0 5px;
 white-space:nowrap;
 overflow:hidden;
 font-weight:600;
 font-size:16px
}

/* =========================================================
   ИНФОРМАЦИЯ
   ========================================================= */

#meta{
 min-height:42px;
 background:#c9c9c9;
 border-top:1px solid #aaa;
 border-bottom:1px solid #999;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:flex-start;
 gap:1px;
 padding:3px 6px;
 overflow:hidden;
 white-space:nowrap;
 font-size:14px;
 line-height:17px
}

#coords{
 white-space:nowrap;
 overflow:visible
}

#dl{
 white-space:nowrap;
 overflow:visible;
 font-size:14px
}

#bp .st{
 height:23px;
 background:#808080;
 display:flex;
 align-items:center;
 padding-left:3px;
 gap:7px
}

.b{
 height:24px;
 min-width:38px;
 border:1px solid #4a8fa5;
 background:#a9dbea;
 font:16px/18px Arial;
 padding:0 5px;
 cursor:pointer;
 color:#000
}

.b.red{
 background:#f08080;
 border-color:#a05050
}

.st .b{
 height:21px;
 width:38px
}

#bp .dr{
 height:31px;
 display:flex;
 align-items:center;
 padding-left:3px;
 gap:4px;
 white-space:nowrap;
 font-size:16px;
 min-width:0;
 overflow:hidden
}

#bp .dr .b{
 height:25px;
 width:40px;
 font-weight:bold;
 margin:0;
 flex:0 0 40px
}

#di{
 height:25px;
 width:145px;
 min-width:85px;
 border:1px solid #888;
 background:#fff;
 font:15px Arial;
 padding:0 4px;
 margin-left:6px;
 flex:0 1 145px
}

#ck{
 width:20px;
 height:20px;
 margin:0 5px 0 0;
 flex:0 0 20px
}

/* =========================================================
   ЧАСЫ ТАЙМЛАЙНА
   ========================================================= */

#hrs{
 display:flex;
 height:22px;
 border-top:1px solid #555;
 overflow:hidden
}

#hrs div{
 flex:1;
 min-width:0;
 text-align:center;
 border-left:1px solid #555;
 line-height:21px;
 cursor:pointer;
 background:#e2e2e2;
 font-size:12px;
 overflow:hidden
}

#hrs div:first-child{
 border-left:0
}

#hrs div.c{
 background:#cfe4ff;
 font-weight:bold
}

/* =========================================================
   ГЛАВНЫЙ ТАЙМЛАЙН
   ========================================================= */

#bar{
 display:block;
 width:100%;
 height:25px;
 border-top:1px solid #555;
 cursor:grab;
 touch-action:none
}

#bar:active{
 cursor:grabbing
}

/* =========================================================
   ВЕРТИКАЛЬНОЕ СЕЧЕНИЕ
   ОСТАВЛЕНО БЕЗ ИЗМЕНЕНИЙ
   ========================================================= */

#sx{
 display:none;
 right:calc(37px + var(--sar));
 top:calc(15px + var(--sat));
 width:530px;
 max-width:530px;
 height:310px;
 background:#eee;
 border-radius:6px;
 box-shadow:0 2px 10px #0006;
 font:10px Arial;
 transform-origin:top right;
 z-index:1200
}

#sh{
 margin:4px 4px 0;
 height:30px;
 border-radius:5px;
 background:linear-gradient(#f9b84e,#eeaf47);
 color:#fff;
 font:bold 15px/30px Arial;
 padding-left:16px;
 text-shadow:0 1px 1px #0005;
 cursor:move;
 touch-action:none
}

#sc{
 position:absolute;
 right:9px;
 top:8px;
 width:20px;
 height:20px;
 border-radius:3px;
 background:#fbe08c;
 color:#e08a10;
 font:bold 15px/19px Arial;
 text-align:center;
 cursor:pointer;
 text-shadow:none
}

#sx .yl{
 position:absolute;
 left:6px;
 top:40px;
 line-height:10px;
 font-size:10px
}

#sst{
 position:absolute;
 left:49px;
 top:45px;
 font:10px "Courier New",monospace
}

#sx canvas{
 position:absolute;
 left:42px;
 top:55px;
 background:#b8b8b8;
 border-left:1px solid #666;
 border-bottom:1px solid #666
}

#sx .yt{
 position:absolute;
 left:22px;
 width:16px;
 text-align:right;
 font-size:10px;
 line-height:10px
}

#sx .xl{
 position:absolute;
 left:0;
 right:0;
 bottom:12px;
 text-align:center
}

#zl{
 position:absolute;
 left:484px;
 top:67px;
 width:42px;
 background:#fff;
 text-align:left;
 font-size:11px;
 padding:0 0 1px 1px
}

#zl b{
 display:block;
 font-size:12px;
 line-height:14px;
 text-align:center;
 margin-bottom:1px
}

#zl div{
 height:11px;
 display:flex;
 align-items:center;
 font-size:11px
}

#zl i{
 width:14px;
 height:10px;
 border:1px solid #444;
 margin-right:3px;
 flex:none
}

/* =========================================================
   СООБЩЕНИЯ
   ========================================================= */

#msg{
 left:95px;
 bottom:calc(120px + var(--sab));
 font-size:14px;
 color:#a00;
 background:#fffd;
 padding:2px 5px;
 pointer-events:none;
 max-width:calc(100vw - 105px);
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap
}

/* =========================================================
   МОБИЛЬНАЯ АДАПТАЦИЯ
   ========================================================= */

@media(max-width:700px){

 #bp{
  width:calc(100vw - var(--sal) - var(--sar));
  max-width:calc(100vw - var(--sal) - var(--sar));
  right:var(--sar);
  bottom:var(--sab)
 }

 #meta{
  font-size:12px;
  line-height:15px;
  min-height:39px
 }

 #coords,
 #dl{
  font-size:12px
 }

 #hrs div,
 #hrs{
  font-size:10px
 }

 #di{
  width:96px;
  min-width:72px;
  flex-basis:96px
 }

 #bp .dr .b{
  width:32px;
  min-width:32px;
  flex-basis:32px;
  font-size:13px
 }

 #logo{
  transform:scale(.82);
  transform-origin:top right;
  right:3px
 }

 #sx{
  top:calc(58px + var(--sat));
  right:3px
 }

 #leg{
  width:135px;
  font-size:12px
 }

 #leg div{
  height:19px
 }

 #leg i{
  width:16px;
  height:16px
 }

 #lp{
  width:135px
 }

 #lp .it{
  height:21px;
  font-size:11px
 }

 #lp .it i{
  font-size:16px;
  width:16px
 }
}

@media(max-width:390px){

 #bp .dr{
  gap:2px
 }

 #bp .dr .b{
  width:27px;
  min-width:27px;
  flex-basis:27px;
  padding:0 2px
 }

 #di{
  width:78px;
  min-width:65px;
  flex-basis:78px;
  font-size:12px
 }

 #coords,
 #dl{
  font-size:10px
 }

 #logo{
  transform:scale(.7)
 }

 #lp{
  width:130px
 }

 #lp .it{
  font-size:10px
 }
}

@media(max-height:520px){
 #sx{
  top:4px
 }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="ov" id="zc">
 <div id="zi">+</div>
 <div id="zo">−</div>
</div>

<button class="ov wb" id="rl">
 <svg width="23" height="18" viewBox="0 0 18 14">
  <rect x="1" y="5" width="16" height="6"
   transform="rotate(-30 9 8)"
   fill="#e8e8e8"
   stroke="#333"/>
  <path d="M4 9v-2M7 8v-2M10 6.5v-2M13 5v-2"
   stroke="#333"/>
 </svg>
</button>

<button class="ov wb" id="vc">VC</button>

<!-- =========================================================
     СЛОИ
     ========================================================= -->

<div class="ov" id="lp">

 <button class="wb" id="lb">
  <svg width="12" height="12" viewBox="0 0 10 10" style="vertical-align:-1px">
   <path d="M1 1h4M1 1v4M1 1l7 7"
    stroke="#000"
    fill="none"/>
   <path d="M5 5l4 1-1 3z"/>
  </svg>
 </button>

 <div id="li"></div>

</div>

<div class="ov" id="leg"></div>

<!-- =========================================================
     QUANTUM METEO
     ========================================================= -->

<div class="ov" id="logo">

 <div id="qm-mark">

  <svg id="qm-svg"
       viewBox="0 0 300 108"
       xmlns="http://www.w3.org/2000/svg"
       aria-label="Quantum Meteo">

   <defs>

    <linearGradient id="qmBlue"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

     <stop offset="0" stop-color="#1d82d0"/>
     <stop offset="1" stop-color="#124d91"/>

    </linearGradient>

    <linearGradient id="qmOrange"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

     <stop offset="0" stop-color="#ffbd43"/>
     <stop offset="1" stop-color="#df7810"/>

    </linearGradient>

   </defs>

   <rect x="3"
         y="3"
         width="294"
         height="102"
         rx="18"
         fill="#ffffffee"
         stroke="#174f87"
         stroke-width="3"/>

   <circle cx="53"
           cy="54"
           r="34"
           fill="#edf6ff"
           stroke="url(#qmBlue)"
           stroke-width="4"/>

   <path d="M27 54a26 26 0 0 0 52 0"
         fill="none"
         stroke="#2d88d3"
         stroke-width="3"/>

   <path d="M34 54a19 19 0 0 0 38 0"
         fill="none"
         stroke="#2d88d3"
         stroke-width="3"/>

   <path d="M53 54L79 36A34 34 0 0 0 53 20Z"
         fill="#2d88d3"
         opacity=".28"/>

   <path d="M53 54L81 35"
         stroke="#155ca8"
         stroke-width="4"
         stroke-linecap="round"/>

   <circle cx="53"
           cy="54"
           r="5"
           fill="url(#qmOrange)"/>

   <path d="M25 31C35 8 70 8 82 31"
         fill="none"
         stroke="url(#qmOrange)"
         stroke-width="3"
         stroke-linecap="round"/>

   <circle cx="82"
           cy="31"
           r="3.5"
           fill="#ef9c17"/>

   <text x="98"
         y="49"
         font-family="Arial,Helvetica,sans-serif"
         font-size="27"
         font-weight="700"
         letter-spacing=".5"
         fill="#174f87">
    QUANTUM
   </text>

   <text x="100"
         y="78"
         font-family="Arial,Helvetica,sans-serif"
         font-size="22"
         font-weight="700"
         letter-spacing="2"
         fill="#df8615">
    METEO
   </text>

  </svg>

 </div>

</div>

<button class="ov wb" id="fs">

 <svg width="19"
      height="19"
      viewBox="0 0 14 14">

  <path d="M2 12L12 2M6 2h6v6"
        stroke="#4a76a8"
        stroke-width="2"
        fill="none"/>

 </svg>

</button>

<div class="ov" id="msg"></div>

<!-- =========================================================
     ТАЙМЛАЙН
     ========================================================= -->

<div class="ov" id="bp">

 <div class="tt" id="tt">
  Метеоявления
 </div>

 <div id="meta">

  <span id="coords">
   Шир: —  Дол: —
  </span>

  <span id="dl"></span>

 </div>

 <div class="st">

  <button class="b red" data-m="S">S</button>
  <button class="b" data-m="R">R</button>
  <button class="b" data-m="H">H</button>

 </div>

 <div class="dr">

  <button class="b" id="n1">&lt;&lt;</button>
  <button class="b" id="n2">&lt;</button>
  <button class="b" id="n3">|&gt;</button>
  <button class="b" id="n4">&gt;</button>
  <button class="b" id="n5">&gt;&gt;</button>

  <input id="di"
         type="date">

  <input id="ck"
         type="checkbox"
         title="Автообновление">

 </div>

 <div id="hrs"></div>

 <canvas id="bar"
         height="25"></canvas>

</div>

<!-- =========================================================
     ВЕРТИКАЛЬНОЕ СЕЧЕНИЕ
     ========================================================= -->

<div class="ov" id="sx">

 <div id="sh">
  Вертикальное сечение р/л отражаемости Z
 </div>

 <div id="sc">×</div>

 <div class="yl">
  Высота,<br>км
 </div>

 <div id="sst"></div>

 <canvas id="sp"
         width="440"
         height="222"></canvas>

 <div id="yt"></div>

 <div class="xl">
  Расстояние, км
 </div>

 <div id="zl"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/radar-cleaner-v2.js"></script>

</body>
</html>
