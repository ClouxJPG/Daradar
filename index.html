<script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // 1. Инициализация карты (как у тебя настроено с GPT)
        const map = L.map('map').setView([55.7558, 37.6173], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Функция окрашивания реальных уровней отражаемости ДМРЛ-С
        function getRadarStyle(feature) {
            // Во внутренней матрице Росгидромета сила осадков пишется в параметр GRAY_INDEX или dbz
            const dbz = feature.properties.GRAY_INDEX || feature.properties.dbz || 0;
            let color = '#00a8f3'; // Слабый дождь
            
            if (dbz >= 45) color = '#ed1c24';      // Град / Сильный ливень
            else if (dbz >= 35) color = '#ff7f27'; // Сильный дождь
            else if (dbz >= 25) color = '#fff200'; // Умеренный дождь
            
            return {
                fillColor: color,
                weight: 0.5,
                opacity: 0.9,
                fillOpacity: 0.5,
                color: color
            };
        }

        // 2. Стучимся к твоему новому серверу за НАСТОЯЩИМИ данными
        // Замени '/api/radar' на полный URL твоего сервера на Vercel, если запускаешь с GitHub Pages
        fetch('/api/radar') 
            .then(response => response.json())
            .then(realRadarGeoJSON => {
                
                // Отрисовываем живой векторный слой Росгидромета на Leaflet
                L.geoJSON(realRadarGeoJSON, {
                    style: getRadarStyle,
                    filter: function(feature) {
                        // Отсекаем пустые зоны, где радар ничего не зафиксировал (dBZ близко к нулю)
                        const dbz = feature.properties.GRAY_INDEX || feature.properties.dbz || 0;
                        return dbz > 10; 
                    },
                    onEachFeature: function (feature, layer) {
                        const dbz = feature.properties.GRAY_INDEX || feature.properties.dbz || 0;
                        layer.bindPopup(`<b>Физическое эхо:</b> ${dbz} dBZ<br><b>Код станции:</b> ${feature.properties.station_id || 'ДМРЛ-С'}`);
                    }
                }).addTo(map);

            })
            .catch(error => {
                console.error("Ошибка загрузки живого радара:", error);
            });
    });
   <script src="radar.js"></script>
 
</script>
