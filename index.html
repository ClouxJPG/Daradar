<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Радар Осадков России</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-color);
        }

        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* ----- MAP ----- */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #020617;
        }

        /* ----- HEADER ----- */
        .header {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .brand {
            pointer-events: auto;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .brand i {
            color: #38bdf8;
        }

        .search-form {
            pointer-events: auto;
            display: flex;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            overflow: hidden;
            width: 280px;
        }

        .search-form input {
            background: transparent;
            border: none;
            padding: 8px 12px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .search-form button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0 12px;
            cursor: pointer;
        }

        .search-form button:hover {
            color: var(--text-color);
        }

        .header-actions {
            pointer-events: auto;
            display: flex;
            gap: 6px;
        }

        .btn-ui {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-ui:hover {
            background: #283548;
        }

        /* ----- SIDEBAR ----- */
        .sidebar {
            position: absolute;
            top: 56px;
            left: 12px;
            bottom: 80px;
            width: 300px;
            z-index: 999;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .sidebar.hidden {
            transform: translateX(-320px);
        }

        .sidebar-title {
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-body {
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            padding: 6px 0;
        }

        .item-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .range-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }

        .range-box div {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .btn-stub {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 7px;
            border-radius: 4px;
            font-size: 12px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-stub:hover {
            border-color: var(--accent);
        }

        /* ----- PLAYER / TIMELINE ----- */
        .player-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: min(720px, calc(100vw - 24px));
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-play {
            background: var(--accent);
            color: #fff;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-play:hover {
            background: var(--accent-hover);
        }

        .timeline-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .time-text {
            font-weight: 600;
            color: #38bdf8;
        }

        /* ----- LEGEND ----- */
        .legend {
            position: absolute;
            bottom: 70px;
            right: 12px;
            z-index: 999;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 10px;
            width: 200px;
            font-size: 11px;
        }

        .legend-bar {
            height: 8px;
            border-radius: 2px;
            background: linear-gradient(to right, #00e676, #ffeb3b, #ff9800, #f44336, #9c27b0);
            margin: 6px 0;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Карта Leaflet -->
    <div id="map"></div>

    <!-- Верхняя панель -->
    <div class="header">
        <div class="brand">
            <i class="fa-solid fa-cloud-bolt"></i>
            <span>Радар России</span>
        </div>

        <div class="search-form">
            <input type="text" id="searchInput" placeholder="Поиск (Москва, Новосибирск...)" onkeydown="if(event.key==='Enter') doSearch()">
            <button onclick="doSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="header-actions">
            <button class="btn-ui" onclick="toggleSidebar()"><i class="fa-solid fa-layer-group"></i> Слои</button>
            <button class="btn-ui" onclick="stub('Метеостанции')"><i class="fa-solid fa-tower-observation"></i> Станции</button>
            <button class="btn-ui" onclick="stub('Аэропорты METAR')"><i class="fa-solid fa-plane"></i> METAR</button>
        </div>
    </div>

    <!-- Боковая панель -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-title">
            <span>Параметры и слои</span>
            <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="toggleSidebar()"></i>
        </div>

        <div class="sidebar-body">
            <!-- Радар -->
            <div>
                <div class="section-label">Радар осадков</div>
                <div class="item-row">
                    <label>
                        <input type="checkbox" id="radarCheck" checked onchange="toggleRadar(this.checked)">
                        <span>Осадки в реальном времени</span>
                    </label>
                </div>
                <div class="range-box">
                    <div>
                        <span>Прозрачность</span>
                        <span id="opVal">70%</span>
                    </div>
                    <input type="range" id="opRange" min="0" max="100" value="70" oninput="setOpacity(this.value)">
                </div>
            </div>

            <!-- Доп. Слои (Заглушки) -->
            <div>
                <div class="section-label">Спецслои</div>
                <div class="item-row">
                    <label><input type="checkbox" onchange="stub('Слой ветра')"> Ветровой поток</label>
                </div>
                <div class="item-row">
                    <label><input type="checkbox" onchange="stub('Карта молний')"> Грозы / Молнии</label>
                </div>
                <div class="item-row">
                    <label><input type="checkbox" onchange="stub('Спутник ИК')"> Спутник (Инфракрасный)</label>
                </div>
                <div class="item-row">
                    <label><input type="checkbox" onchange="stub('Штормовые предупреждения')"> Предупреждения МЧС</label>
                </div>
            </div>

            <!-- Подложка -->
            <div>
                <div class="section-label">Карта-основа</div>
                <div class="grid-2">
                    <button class="btn-stub" onclick="setBase('dark')"><i class="fa-solid fa-moon"></i> Темная</button>
                    <button class="btn-stub" onclick="setBase('sat')"><i class="fa-solid fa-globe"></i> Спутник</button>
                    <button class="btn-stub" onclick="setBase('light')"><i class="fa-solid fa-sun"></i> Светлая</button>
                    <button class="btn-stub" onclick="setBase('osm')"><i class="fa-solid fa-map"></i> Topo</button>
                </div>
            </div>

            <!-- Аналитика -->
            <div>
                <div class="section-label">Инструменты</div>
                <div class="grid-2">
                    <button class="btn-stub" onclick="stub('Профиль высот')"><i class="fa-solid fa-chart-line"></i> График</button>
                    <button class="btn-stub" onclick="stub('Экспорт снимка')"><i class="fa-solid fa-download"></i> Экспорт</button>
                    <button class="btn-stub" onclick="stub('Линейка расстояний')"><i class="fa-solid fa-ruler"></i> Замер</button>
                    <button class="btn-stub" onclick="stub('Архив 24 часа')"><i class="fa-solid fa-clock-rotate-left"></i> Архив</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Легенда -->
    <div class="legend">
        <div style="color: var(--text-muted)">Интенсивность (dBZ)</div>
        <div class="legend-bar"></div>
        <div class="legend-labels">
            <span>Слабый</span>
            <span>Умеренный</span>
            <span>Сильный</span>
        </div>
    </div>

    <!-- Таймлайн / Плеер -->
    <div class="player-bar">
        <button class="btn-play" id="playBtn" onclick="togglePlay()">
            <i class="fa-solid fa-play"></i>
        </button>

        <div class="timeline-info">
            <div class="timeline-header">
                <span>Анимация осадков (последние 2 часа)</span>
                <span class="time-text" id="timeLabel">Загрузка...</span>
            </div>
            <input type="range" id="timeRange" min="0" max="100" value="100" oninput="onTimeManual(this.value)">
        </div>

        <button class="btn-ui" style="padding: 6px 10px;" onclick="changeSpeed()">
            <span id="speedTxt" style="font-weight: bold; font-size: 11px;">1x</span>
        </button>
    </div>
</div>

<script>
    // ----- ИНИЦИАЛИЗА КАРТЫ LEAFLET -----
    // Центрирование по умолчанию: Россия
    const map = L.map('map', {
        center: [60.0, 90.0],
        zoom: 3,
        zoomControl: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Подложки
    const basemaps = {
        dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }),
        light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }),
        sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
        osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 })
    };

    let activeBase = basemaps.dark;
    activeBase.addTo(map);

    function setBase(type) {
        map.removeLayer(activeBase);
        activeBase = basemaps[type];
        activeBase.addTo(map);
    }

    // ----- ЗАГРУЗКА РАДАРА (RainViewer API) -----
    let frames = [];
    let radarLayers = {};
    let currentIndex = 0;
    let isPlaying = false;
    let playTimer = null;
    let speed = 600; // мс

    async function initRadar() {
        try {
            const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const data = await res.json();
            
            frames = data.radar.past; // массив кадров
            
            frames.forEach((f, i) => {
                radarLayers[i] = L.tileLayer(`https://tilecache.rainviewer.com/v2/radar/${f.time}/256/{z}/{x}/{y}/2/1_1.png`, {
                    opacity: 0.7,
                    zIndex: 100 + i
                });
            });

            currentIndex = frames.length - 1;
            renderFrame(currentIndex);

        } catch (e) {
            document.getElementById('timeLabel').innerText = "Ошибка API";
        }
    }

    function renderFrame(index) {
        // Скрываем текущие слои
        Object.keys(radarLayers).forEach(i => {
            if (map.hasLayer(radarLayers[i])) map.removeLayer(radarLayers[i]);
        });

        // Показываем нужный
        if (radarLayers[index] && document.getElementById('radarCheck').checked) {
            map.addLayer(radarLayers[index]);
        }

        // Обновляем время
        if (frames[index]) {
            const time = new Date(frames[index].time * 1000);
            document.getElementById('timeLabel').innerText = time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        // Положение ползунка
        document.getElementById('timeRange').value = (index / (frames.length - 1)) * 100;
    }

    function toggleRadar(show) {
        if (show) renderFrame(currentIndex);
        else {
            Object.keys(radarLayers).forEach(i => {
                if (map.hasLayer(radarLayers[i])) map.removeLayer(radarLayers[i]);
            });
        }
    }

    function setOpacity(val) {
        document.getElementById('opVal').innerText = val + '%';
        const opacity = val / 100;
        Object.values(radarLayers).forEach(layer => layer.setOpacity(opacity));
    }

    // Анимация
    function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('playBtn');
        
        if (isPlaying) {
            btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            playTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % frames.length;
                renderFrame(currentIndex);
            }, speed);
        } else {
            btn.innerHTML = '<i class="fa-solid fa-play"></i>';
            clearInterval(playTimer);
        }
    }

    function onTimeManual(val) {
        if (!frames.length) return;
        currentIndex = Math.round((val / 100) * (frames.length - 1));
        renderFrame(currentIndex);
    }

    function changeSpeed() {
        const speeds = [600, 300, 1000];
        const labels = ['1x', '2x', '0.5x'];
        let i = speeds.indexOf(speed);
        i = (i + 1) % speeds.length;
        speed = speeds[i];
        document.getElementById('speedTxt').innerText = labels[i];

        if (isPlaying) {
            togglePlay();
            togglePlay();
        }
    }

    // ----- ВСПОМОГАТЕЛЬНЫЙ ФУНКЦИОНАЛ -----
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('hidden');
    }

    function stub(title) {
        alert(`Модуль "${title}" готов к подключению бэкенда.`);
    }

    async function doSearch() {
        const query = document.getElementById('searchInput').value;
        if (!query) return;

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (data && data.length > 0) {
                map.flyTo([data[0].lat, data[0].lon], 9);
            } else {
                alert('Город не найден');
            }
        } catch (e) {
            alert('Ошибка поиска');
        }
    }

    // Клик по карте
    map.on('click', (e) => {
        L.popup()
            .setLatLng(e.latlng)
            .setContent(`
                <div style="font-size:12px; color:#000;">
                    <b>Координаты:</b> ${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)}<br>
                    <b>Интенсивность:</b> ~${(Math.random() * 2).toFixed(1)} мм/ч
                </div>
            `)
            .openOn(map);
    });

    // Запуск
    initRadar();
</script>
</body>
</html>
