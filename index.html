html,body{

#map{

.leaflet-container{

.ov{

}

.wb{

#zc{

#rl{

}

#vc{

/* =========================================================

/* =========================================================
   СООБЩЕНИЯ

#msg{

 color:#a00;
 background:#fffd;
 padding:2px 5px;
 pointer-events:none;
 max-width:calc(100vw - 105px);
 overflow:hidden;
 text-overflow:ellipsis;

/* =========================================================
   МОБИЛЬНАЯ АДАПТАЦИЯ

@media(max-width:700px){

  width:16px;

 #lp{
  width:135px

  height:21px;
  font-size:11px
 }

 #lp .it i{
  font-size:16px;
  width:16px

@media(max-width:390px){

  width:130px

 #lp .it{
  font-size:10px

}

@media(max-height:520px){
 #sx{
  top:4px
 }
}
</style>
</head>

/* =========================================================

   ========================================================= */

/* =========================================================
   ПОСЛЕДНИЙ ЗАВЕРШЁННЫЙ РАДАРНЫЙ КАДР
   ========================================================= */

const latest=()=>
 new Date(
  Math.floor(
   Date.now()/STEP_MS
  )*STEP_MS-STEP_MS
 );

S.T=latest();

/* =========================================================
   ПРЕДЕЛЫ 12-ЧАСОВОГО ТАЙМЛАЙНА
   ========================================================= */

function timelineStart(){

 return new Date(
  +latest()-
  (ARCHIVE_STEPS-1)*STEP_MS
 );
}

function clampTime(d){

 let n=new Date(d);

 n=new Date(
  Math.floor(+n/STEP_MS)*STEP_MS
 );

 const mx=latest();
 const mn0=timelineStart();

 if(+n>+mx)
  n=mx;

 if(+n<+mn0)
  n=mn0;

 return n;
}

/* =========================================================
   ТАЙМЛАЙН
   ========================================================= */

function renderHours(){

 const hrs=$('hrs');

 const start=timelineStart();
 const end=latest();

 const interval=60*60*1000;

 const first=
  new Date(
   Math.ceil(+start/interval)*interval
  );

 hrs.innerHTML='';

 for(
  let t=+first;
  t<=+end;
  t+=interval
 ){

  const d=new Date(t);
  const m=toMSK(d);

  const x=
   document.createElement('div');

  x.textContent=
   pad(m.getUTCHours());

  x.dataset.t=String(+d);

  if(
   Math.abs(+d-+S.T)<STEP_MS
  )
   x.classList.add('c');

  hrs.appendChild(x);
 }

 if(!hrs.children.length){

  const d=new Date(S.T);
  const m=toMSK(d);

  const x=
   document.createElement('div');

  x.textContent=
   pad(m.getUTCHours());

  x.dataset.t=String(+d);

  x.classList.add('c');

  hrs.appendChild(x);
 }
}

function bar(){

 const c=$('bar');

 const w=Math.max(
  1,
  $('bp').clientWidth-2
 );

 c.width=w;

 const g=c.getContext('2d');

 const start=timelineStart();
 const end=latest();

 const total=+end-+start;

 g.clearRect(
  0,
  0,
  w,
  25
 );

 for(
  let i=0;
  i<ARCHIVE_STEPS;
  i++
 ){

  const t=
   new Date(
    +start+i*STEP_MS
   );

  if(+t>+end)
   break;

  const x=
   Math.round(
    ((+t-+start)/total)*w
   );

  const x2=
   Math.round(
    ((+t-+start+STEP_MS)/total)*w
   );

  g.fillStyle='#268c26';

  g.fillRect(
   x,
   0,
   Math.max(1,x2-x),
   25
  );

  g.fillStyle='#0d5a0d';

  g.fillRect(
   x,
   0,
   1,
   25
  );
 }

 const interval=60*60*1000;

 const first=
  new Date(
   Math.ceil(+start/interval)*interval
  );

 for(
  let t=+first;
  t<=+end;
  t+=interval
 ){

  const x=
   ((t-+start)/total)*w;

  g.fillStyle='#064d06';

  g.fillRect(
   Math.round(x),
   0,
   1,
   25
  );
 }

 let x=
  ((+S.T-+start)/total)*w;

 x=Math.max(
  0,
  Math.min(
   w-1,
   x
  )
 );

 g.fillStyle='#f0ff20';

 g.fillRect(
  Math.round(x)-1,
  0,
  3,
  25
 );

 document
  .querySelectorAll('#hrs div')
  .forEach(e=>{

   const t=
    Number(e.dataset.t);

   e.classList.toggle(
    'c',
    Math.abs(t-+S.T)<STEP_MS
   );

  });
}

function barTime(e){

  (e.clientX-r.left)/r.width;

 f=Math.max(
  0,
  Math.min(
   1,
   f

 );

 const start=timelineStart();
 const end=latest();

 let d=
  new Date(
   +start+
   Math.floor(
    f*((+end-+start)/STEP_MS)
   )*STEP_MS
  );

 return clampTime(d);
}

   ========================================================= */

let C={};

async function frame(r,ts){

 const k=
  r.id+ts;

 if(C[k])
  return C[k];

 const im=
  new Image();

 im.crossOrigin='anonymous';

 await new Promise(
  (ok,no)=>{

   im.onload=ok;

   im.onerror=no;

   im.src=
    `${S.api}/api/img/${r.id}/${ts}?p=4&m=S`;
  }
 );

 const c=
  document.createElement('canvas');

 c.width=im.width;
 c.height=im.height;

 const g=
  c.getContext('2d');

 g.drawImage(
  im,
  0,
  0
 );

 const d=
  g.getImageData(
   0,
   0,
   c.width,
   c.height
  ).data;

 const a=
  new Int8Array(
   c.width*c.height
  );

 for(let p=0;p<a.length;p++){

  a[p]=-1;

  if(
   d[p*4+3]<128
  )
   continue;

  let m=1e9;
  let q0=-1;

  for(
   let q=0;
   q<19;
   q++
  ){

   const e=
    (d[p*4]-P[q][0])**2+
    (d[p*4+1]-P[q][1])**2+
    (d[p*4+2]-P[q][2])**2;

   if(e<m){

    m=e;
    q0=q;
   }
  }

  if(
   m<=TOL*TOL
  )
   a[p]=q0;
 }

 return C[k]={
  w:c.width,
  h:c.height,
  a
 };
}

/* =========================================================
   ПЕРЕКРАСКА
   ========================================================= */

function url(f){

 const c=
  document.createElement('canvas');

 c.width=f.w;
 c.height=f.h;

 const g=
  c.getContext('2d');

 const im=
  g.createImageData(
   f.w,
   f.h
  );

 const d=im.data;

 for(
  let p=0;
  p<f.a.length;
  p++
 ){

  const q=f.a[p];

  if(q<0)
   continue;

  d[p*4]=P[q][0];
  d[p*4+1]=P[q][1];
  d[p*4+2]=P[q][2];
  d[p*4+3]=255;
 }

 g.putImageData(
  im,
  0,
  0
 );

 return c.toDataURL();
}

async function show(){

 if(
  !RD.length||
  !S.api
 )
  return;

 const z=
  map.getZoom();

 const b=
  map.getBounds();

 const tk=++S.tk;

 const ts=
  stp(S.T);

 const bb=r=>[
  [r.bounds[0],r.bounds[1]],
  [r.bounds[2],r.bounds[3]]
 ];

 const vis=
  z>=5?
  RD
   .filter(r=>
    b.intersects(
     bb(r)
    )
   )
   .slice(0,10):
  [];

 Object.keys(OV).forEach(id=>{

  if(
   !vis.find(
    r=>r.id==id
   )
  ){

   OV[id].remove();

   delete OV[id];
  }
 });

 let bad=0;

 await Promise.all(

  vis.map(
   async r=>{

    try{

     const src=
      S.m=='S'?
      url(
       await frame(
        r,
        ts
       )
      ):
      `${S.api}/api/img/${r.id}/${ts}?p=4&m=${S.m}`;

     if(
      tk!=S.tk
     )
      return;

     if(
      OV[r.id]
     )

      OV[r.id]
       .setUrl(src);

     else

      OV[r.id]=
       L.imageOverlay(
        src,
        bb(r),
        {
         opacity:.92,
         zIndex:300
        }
       ).addTo(map);

    }catch(e){

     bad++;

     if(
      OV[r.id]
     ){

      OV[r.id].remove();

      delete OV[r.id];
     }
    }
   }
  )
 );

 if(
  tk==S.tk
 ){

  msg(
   vis.length&&
   bad==vis.length?
   'нет данных за '+ts+' UTC':
   z<5&&RD.length?
   'приблизьте карту (zoom ≥ 5)':
   ''
  );
 }
}

const dms=v=>{

 const a=Math.abs(v);

 let d=Math.floor(a);

 let m=
  Math.floor(
   (a-d)*60
  );

 let s=
  Math.round(
   ((a-d)*60-m)*60
  );

 if(s>=60){

  s=0;

  m++;

  if(m>=60){

   m=0;

   d++;
  }
 }

 return d+'°'+
  pad(m)+"'"+
  pad(s)+'"';
};

function clampSX(){

 const w=$('sx');

 if(
  $('sx').style.display=='none'
 )
  return;

 const scale=
  parseFloat(
   w.dataset.scale||'1'
  );

 const ww=
  530*scale;

 const hh=
  310*scale;

 if(w.style.left){

  let left=
   parseFloat(
    w.style.left
   )||0;

  let top=
   parseFloat(
    w.style.top
   )||0;

  left=Math.max(
   0,
   Math.min(
    left,
    innerWidth-ww
   )
  );

  top=Math.max(
   0,
   Math.min(
    top,
    innerHeight-hh
   )
  );

  w.style.left=
   left+'px';

  w.style.top=
   top+'px';

 }else{

  w.style.right=
   Math.max(
    0,
    Math.min(
     37,
     innerWidth-ww
    )
   )+'px';

  w.style.top=
   Math.max(
    0,
    Math.min(
     15,
     innerHeight-hh
    )
   )+'px';
 }
}

function fitSX(){

 const w=$('sx');

 if(
  !$('sx').style.display||
  $('sx').style.display=='none'
 )
  return;

 const scale=
  Math.min(
   1,
   Math.max(
    .58,
    (innerWidth-8)/530
   ),
   Math.max(
    .58,
    (innerHeight-8)/310
   )
  );

 w.dataset.scale=
  scale;

 w.style.transform=
  `scale(${scale})`;

 clampSX();
}

     ' км'
    )
    .addTo(map);

   return;
  }

  if(!S.vc)
   return;

  if(
   S.va&&S.vb
  ){

   if(vl)
    vl.remove();

   vm.forEach(
    m=>m.remove()
   );

   vm=[];

   vl=null;

   S.va=null;
   S.vb=null;

   va=null;
   vb=null;

   $('sx').style.display=
    'none';
  }

  if(!S.va){

   S.va=e.latlng;

   vm.push(

    L.marker(
     e.latlng,
     {
      interactive:false,

      icon:L.divIcon({
       className:'',
       html:
        '<div style="color:#7a1030;font:bold 12px Arial;margin:-8px 0 0 -4px">▲A</div>',
       iconSize:[0,0]
      })
     }
    ).addTo(map)

   );

   return;
  }

  if(!S.vb){

   S.vb=e.latlng;

   vl=
    L.polyline(
     [S.va,S.vb],
     {
      color:'#7a1030',
      weight:1.5,
      interactive:false
     }
    ).addTo(map);

   vm.push(

    L.circleMarker(
     S.vb,
     {
      radius:4,
      color:'#c33',
      weight:2,
      fillOpacity:0
     }
    ).addTo(map)

   );

   sect();
  }

 }
);

/* =========================================================
   ШКАЛА ВЫСОТЫ
   ========================================================= */

for(
 let k=1;
 k<=15;
 k++
){

 const d=
  document.createElement(
   'div'
  );

 d.className='yt';

 d.style.top=
  (55+
   222*(15-k)/15+
   2)+'px';

 d.textContent=k;

 $('yt').appendChild(
  d
 );
}

/* =========================================================
   ОТРИСОВКА СЕЧЕНИЯ
   ========================================================= */

async function sect(){

 $('sx').style.display=
  'block';

 fitSX();

 const c=$('sp');

 const g=
  c.getContext('2d');

 g.fillStyle=
  '#b8b8b8';

 g.fillRect(
  0,
  0,
  440,
  222
 );

 $('sst').textContent=
  'Данные загружаются...';

 const mid=
  L.latLng(
   (S.va.lat+S.vb.lat)/2,
   (S.va.lng+S.vb.lng)/2
  );

 let r=
  RD.slice().sort(
   (a,b)=>
    mid.distanceTo(
     [a.lat,a.lon]
    )-
    mid.distanceTo(
     [b.lat,b.lon]
    )
  )[0];

 try{

  if(!r)
   throw 0;

  const j=
   await jf(
    `/api/section?id=${r.id}&ts=${stp(S.T)}&a=${S.va.lat},${S.va.lng}&b=${S.vb.lat},${S.vb.lng}`
   );

  const n=
   j.z.length;

  const cw=
   440/n;

  const rh=
   222/15;

  $('sst').textContent='';

  j.z.forEach(
   (col,i)=>
    col.forEach(
     (v,k)=>{

      if(
       v==null||
       v<=-30
      )
       return;

      let q=0;

      while(
       q+1<ZT.length&&
       v>ZT[q+1]
      )
       q++;

      g.fillStyle=
       ZC[q];

      g.fillRect(
       Math.floor(i*cw),
       Math.round(
        222-(k+1)*rh
       ),
       Math.ceil(cw),
       Math.ceil(rh)
      );
     }
    )
  );

  g.strokeStyle='#888';

  g.setLineDash([
   4,3
  ]);

  [5,10,15].forEach(k=>{

   g.beginPath();

   g.moveTo(
    0,
    222-k*rh+.5
   );

   g.lineTo(
    440,
    222-k*rh+.5
   );

   g.stroke();
  });

  g.setLineDash([]);

 }catch(e){

  $('sst').textContent=
   'Нет данных вертикального сечения (сервер не отдаёт объёмные данные)';
 }

 fitSX();
}

/* =========================================================
   КРЕСТИК
   ========================================================= */

$('sc').onclick=()=>{
 vclear();
};

/* =========================================================
   ПЕРЕТАСКИВАНИЕ ОКНА
   ========================================================= */

(()=>{

 const h=$('sh');
 const w=$('sx');

 let o=null;

 h.onpointerdown=e=>{

  h.setPointerCapture(
   e.pointerId
  );

  const r=
   w.getBoundingClientRect();

  w.style.right=
   'auto';

  w.style.left=
   r.left+'px';

  w.style.top=
   r.top+'px';

  w.style.transformOrigin=
   'top left';

  o=[
   e.clientX-r.left,
   e.clientY-r.top
  ];

  e.preventDefault();
 };

 h.onpointermove=e=>{

  if(!o)
   return;

  const scale=
   parseFloat(
    w.dataset.scale||'1'
   );

  const ww=
   530*scale;

  const hh=
   310*scale;

  let left=
   e.clientX-o[0];

  let top=
   e.clientY-o[1];

  left=Math.max(
   0,
   Math.min(
    left,
    innerWidth-ww
   )
  );

  top=Math.max(
   0,
   Math.min(
    top,
    innerHeight-hh
   )
  );

  w.style.left=
   left+'px';

  w.style.top=
   top+'px';
 };

 const stop=()=>{

  o=null;

  clampSX();
 };

 h.onpointerup=stop;

 h.onpointercancel=stop;

})();

   RESIZE

addEventListener(
 'resize',

  renderHours();

  bar();

  const bp=$('bp');

  bp.style.left='';
  bp.style.top='';
  bp.style.right='var(--sar)';
  bp.style.bottom='var(--sab)';

  if(
   $('sx').style.display!='none'
  )
   fitSX();

  if(
   window.RadarPoints &&
   typeof window.RadarPoints.update==='function'
  ){
   window.RadarPoints.update();
  }
 });

/* =========================================================
   ЗАПУСК
   ========================================================= */

ui();

init();

</script>
