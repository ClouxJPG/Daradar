<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парсинг физических метеоданных (WMS)</title>
    
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        html, body, #map {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #111;
        }
        .info-panel {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 8px; font-family: monospace; font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 280px; color: #333;
        }
        h4 { margin: 0 0 10px 0; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="info-panel">
        <h4>Физические данные радара</h4>
        <div id="output">Кликните в любую точку на карте, чтобы отправить точечный запрос к матрице метеослужбы...</div>
    </div>

    <script>
        // Инициализируем карту (центрируем на тестовую зону с открытым WMS)
        const map = L.map('map').setView([39.8283, -98.5795], 5);

        // Ставим базовую темную карту
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        // Базовый URL официального WMS-сервера метеослужбы (NOAA/NEXRAD)
        const wmsUrl = 'https://noaa.gov';

        // 1. Отображаем визуальный радарный слой на карте
        const radarLayer = L.tileLayer.wms(wmsUrl, {
            layers: '1',
            format: 'image/png',
            transparent: true,
            opacity: 0.5,
            attribution: 'NOAA / NEXRAD'
        }).addTo(map);

        // 2. Ловим клик мыши, чтобы вытащить «сырое» значение из матрицы
        map.on('click', function(e) {
            document.getElementById('output').innerHTML = "⏳ Запрос к серверу...";

            // Получаем текущие параметры экрана и координат для ГИС-запроса
            const size = map.getSize();
            const bounds = map.getBounds();
            const crs = map.options.crs;

            // Конвертируем координаты клика в пиксели экрана
            const point = map.latLngToContainerPoint(e.latlng);

            // Формируем стандартизированный ГИС-запрос GetFeatureInfo
            // Он просит сервер вернуть текстовое описание данных в конкретном пикселе
            const url = wmsUrl + L.Util.getParamString({
                request: 'GetFeatureInfo',
                service: 'WMS',
                version: '1.3.0',
                layers: '1',
                query_layers: '1',
                bbox: crs.project(bounds.getSouthWest()).x + ',' + crs.project(bounds.getSouthWest()).y + ',' +
                      crs.project(bounds.getNorthEast()).x + ',' + crs.project(bounds.getNorthEast()).y,
                crs: 'EPSG:3857',
                width: size.x,
                height: size.y,
                x: Math.floor(point.x),
                y: Math.floor(point.y),
                info_format: 'text/html' // Просим сервер вернуть структуру данных
            }, wmsUrl);

            // Делаем микро-запрос напрямую к серверу метеослужбы без прокси
            fetch(url)
                .then(res => res.text())
                .then(htmlData => {
                    // Парсим ответ сервера. Обычно ГИС-сервер возвращает мини-таблицу HTML 
                    // или JSON с физическими параметрами (отражаемость в dBZ, тип осадков)
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlData, 'text/html');
                    
                    // Ищем текстовые данные внутри ответа сервера
                    const bodyText = doc.body.innerText.trim();

                    if (bodyText && bodyText.length > 10) {
                        document.getElementById('output').innerHTML = `
                            <b>Координаты:</b> ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}<br><br>
                            <b>Ответ матрицы:</b><br>
                            <pre style="white-space: pre-wrap; font-size:11px;">${bodyText}</pre>
                        `;
                    } else {
                        document.getElementById('output').innerHTML = `
                            <b>Координаты:</b> ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}<br><br>
                            <b>Осадки:</b> Нет (ячейка матрицы пуста)
                        `;
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('output').innerText = "Ошибка запроса к метеоматрице";
                });
        });
    </script>
</body>
</html>
