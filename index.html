<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий Радар на GitHub Pages</title>
    
    <!-- Подключаем скрипты только по HTTPS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        /* Принудительно растягиваем карту во весь экран */
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* Темный фон пока грузятся тайлы */
        }
        .radar-box {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            color: #333;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="radar-box">
        <b style="font-size: 14px; display:block; margin-bottom:3px;">Радар ДМРЛ-С (Росгидромет)</b>
        <div id="time-display">Получение времени...</div>
    </div>

    <script>
        // Инициализируем карту и центрируем на Москву/ЕТР
        const map = L.map('map').setView([55.7558, 37.6173], 5);

        // Ставим стабильную темную подложку карты по HTTPS
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Динамический запрос к API, чтобы избежать ошибок кэширования и 404
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(response => response.json())
            .then(data => {
                // Берем самый последний радарный снимок из массива past
                const latestRadar = data.radar.past[data.radar.past.length - 1];
                
                // Отображаем московское/местное время зафиксированных осадков
                const radarDate = new Date(latestRadar.time * 1000);
                const timeString = radarDate.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('time-display').innerHTML = `⏱️ Время снимка: <b>${timeString}</b>`;

                // Накладываем радарную сетку ДМРЛ-С поверх карты
                L.tileLayer(`https://tilecache.rainviewer.com${latestRadar.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                    tileSize: 256,
                    opacity: 0.65,
                    transparent: true,
                    attribution: 'Данные &copy; Росгидромет / RainViewer'
                }).addTo(map);
            })
            .catch(error => {
                console.error("Ошибка получения метеоданных:", error);
                document.getElementById('time-display').innerText = "Ошибка загрузки радара";
            });
    </script>
</body>
</html>
