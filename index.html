<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>АСУ-ДМРЛ ВОИ — Сеть метеорадаров</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --win-bg: #d4d0c8;
      --win-panel: #ece9d8;
      --win-border-dark: #716f64;
      --win-border-shadow: #808080;
      --win-border-light: #ffffff;
      --win-blue: #000080;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Tahoma", "Segoe UI", Geneva, sans-serif;
      font-size: 11px;
      user-select: none;
    }

    body {
      background-color: var(--win-bg);
      color: #000;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Верхнее меню */
    .top-bar {
      display: flex;
      align-items: center;
      background: var(--win-panel);
      border-bottom: 2px solid var(--win-border-dark);
      padding: 2px 4px;
      gap: 6px;
      height: 28px;
      flex-shrink: 0;
      overflow-x: auto;
      white-space: nowrap;
    }

    .toolbar-grid-nums {
      display: flex;
      border: 1px solid var(--win-border-shadow);
      background: #fff;
    }

    .toolbar-grid-nums span {
      padding: 1px 3px;
      border-right: 1px solid #d4d0c8;
      font-size: 10px;
    }

    .layer-select {
      background: #fff;
      border: 1px solid var(--win-border-shadow);
      font-size: 11px;
      padding: 1px 3px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-win {
      background: var(--win-panel);
      border: 1px solid #000;
      box-shadow: inset 1px 1px var(--win-border-light), inset -1px -1px var(--win-border-shadow);
      padding: 2px 6px;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }
    .btn-win:active, .btn-win.active {
      box-shadow: inset 1px 1px var(--win-border-shadow), inset -1px -1px var(--win-border-light);
      background: #c0c0c0;
    }

    .status-badge {
      background: #008080;
      color: #fff;
      padding: 2px 6px;
      font-weight: bold;
      font-family: monospace;
      font-size: 11px;
      margin-left: auto;
    }

    /* Главная контейнерная область */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Окно карты */
    .map-view {
      flex: 1;
      position: relative;
      background: #a5bfdd;
      border: 2px inset var(--win-border-light);
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Оверлей для визира и радарной сетки */
    #radarCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 400;
    }

    /* Правая панель */
    .sidebar {
      width: 230px;
      background: var(--win-panel);
      border-left: 2px solid var(--win-border-light);
      box-shadow: -1px 0 var(--win-border-dark);
      display: flex;
      flex-direction: column;
      padding: 4px;
      gap: 5px;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 500;
    }

    .radar-station-select {
      width: 100%;
      background: #fff;
      border: 1px solid var(--win-border-shadow);
      padding: 2px;
      font-weight: bold;
      cursor: pointer;
    }

    .info-box {
      border: 1px solid var(--win-border-shadow);
      background: #fff;
      padding: 4px;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.3;
      box-shadow: inset 1px 1px var(--win-border-shadow);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .file-list {
      border: 1px solid var(--win-border-shadow);
      background: #fff;
      height: 130px;
      overflow-y: scroll;
      font-family: monospace;
      font-size: 10px;
      box-shadow: inset 1px 1px var(--win-border-shadow);
    }

    .file-item {
      padding: 1px 3px;
      cursor: pointer;
      white-space: nowrap;
    }
    .file-item:hover { background: #e0e0ff; }
    .file-item.active {
      background: var(--win-blue);
      color: #fff;
    }

    .header-tag {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      border-bottom: 1px solid var(--win-border-shadow);
      padding-bottom: 1px;
    }

    /* Легенда */
    .legend-box {
      border: 1px solid var(--win-border-shadow);
      background: #fff;
      flex: 1;
      min-height: 150px;
      overflow-y: auto;
      padding: 2px;
      box-shadow: inset 1px 1px var(--win-border-shadow);
    }

    .legend-title {
      font-weight: bold;
      background: var(--win-bg);
      padding: 1px 3px;
      margin-bottom: 2px;
      border: 1px solid var(--win-border-shadow);
      text-align: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      height: 13px;
    }

    .color-swatch {
      width: 12px;
      height: 10px;
      border: 1px solid #000;
      flex-shrink: 0;
    }

    /* Мобильная адаптация */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
      .map-view {
        height: 60vh;
        flex: none;
      }
      .sidebar {
        width: 100%;
        height: 40vh;
        border-left: none;
        border-top: 2px solid var(--win-border-light);
      }
    }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <div class="top-bar">
    <div class="toolbar-grid-nums">
      <span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
      <span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span>
    </div>

    <select class="layer-select" id="layerSelect">
      <option value="phenomena">Метеоявления</option>
      <option value="reflectivity">Отражаемость (Z)</option>
      <option value="velocity">Скорость (V)</option>
    </select>

    <button class="btn-win" id="btnPg">ПГ: теплый</button>
    <button class="btn-win" id="btnDanger">Опасные явления</button>

    <div class="status-badge" id="speedStatus">V=14.79 м/с az=29 СВ</div>
  </div>

  <!-- Главное окно -->
  <div class="main-container">
    
    <!-- Интерактивная карта Leaflet -->
    <div class="map-view">
      <div id="map"></div>
      <canvas id="radarCanvas"></canvas>
    </div>

    <!-- Панель управления АСУ-ДМРЛ -->
    <div class="sidebar">
      
      <label style="font-weight: bold;">Выбор радара ДМРЛ-С:</label>
      <select class="radar-station-select" id="stationSelect">
        <option value="nn">ДМРЛ Нижний Новгород</option>
        <option value="msk">ДМРЛ Москва (Шереметьево)</option>
        <option value="vld">ДМРЛ Валдай</option>
        <option value="kzn">ДМРЛ Казань</option>
        <option value="sch">ДМРЛ Сочи (Агур)</option>
      </select>

      <div class="info-box" id="pointInfo">
        <div>Az: <span id="valAz">307.48</span>°</div>
        <div>R:  <span id="valR">127.54</span> км</div>
        <div style="color: #666;">Явление:</div>
        <div id="valPhenomenon" style="font-weight: bold; color: #a00000;">Гроза (R)</div>
      </div>

      <div class="controls-row">
        <button class="btn-win" id="btnPlay" title="Старт/Пауза анимации">▶</button>
        <button class="btn-win" id="btnResetView" title="К выбранному радару">🎯</button>
        <strong style="margin-left: auto;" id="currentDate">15.06.2022</strong>
      </div>

      <div style="text-align: right; font-weight: bold; font-family: monospace; font-size: 12px;" id="currentTime">
        10:30:00
      </div>

      <div class="header-tag">
        <span>ДМРЛ</span>
        <span style="color: green;">● ONLINE</span>
      </div>

      <div class="file-list" id="fileList"></div>

      <div class="legend-box" id="legendBox"></div>

    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Список метеорадаров ДМРЛ-С с точными координатами
    const RADARS = {
      nn:  { name: "ДМРЛ Нижний Новгород", lat: 56.3269, lon: 44.0059 },
      msk: { name: "ДМРЛ Москва (Шереметьево)", lat: 55.9726, lon: 37.4146 },
      vld: { name: "ДМРЛ Валдай", lat: 57.9747, lon: 33.2425 },
      kzn: { name: "ДМРЛ Казань", lat: 55.7887, lon: 49.1221 },
      sch: { name: "ДМРЛ Сочи", lat: 43.5855, lon: 39.7231 }
    };

    let currentRadarKey = "nn";
    let activeRadar = RADARS[currentRadarKey];

    // Инициализация интерактивной карты
    const map = L.map('map', {
      center: [activeRadar.lat, activeRadar.lon],
      zoom: 8,
      zoomControl: false
    });

    // Картографическая подложка OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 12,
      attribution: 'ДМРЛ ВОИ'
    }).addTo(map);

    // Добавление реального открытого радарного слоя (RainViewer API)
    let radarTileLayer = L.tileLayer('https://tilecache.rainviewer.com/v2/radar/nowcast/256/{z}/{x}/{y}/2/1_1.png', {
      opacity: 0.65,
      zIndex: 100
    }).addTo(map);

    // Маркер позиции текущего радара
    let radarMarker = L.marker([activeRadar.lat, activeRadar.lon]).addTo(map)
      .bindPopup(`<b>${activeRadar.name}</b>`).openPopup();

    // Canvas для сетки и визира
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = map.getContainer().clientWidth;
      canvas.height = map.getContainer().clientHeight;
      drawRadarOverlay();
    }

    // Отрисовка колец дальности (50, 100, 150 км) от выбранной станции ДМРЛ
    function drawRadarOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const center = map.latLngToContainerPoint([activeRadar.lat, activeRadar.lon]);

      ctx.strokeStyle = "rgba(40, 40, 40, 0.6)";
      ctx.lineWidth = 1;

      [50, 100, 150].forEach(rKm => {
        const point = map.latLngToContainerPoint([activeRadar.lat + (rKm / 111.12), activeRadar.lon]);
        const radius = Math.abs(center.y - point.y);

        ctx.beginPath();
        ctx.arc(center.x, center.y, radius, 0, 2 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = "#000";
        ctx.font = "10px Tahoma";
        ctx.fillText(`${rKm} км`, center.x + 5, center.y - radius + 12);
      });
    }

    map.on('move', drawRadarOverlay);
    window.addEventListener('resize', resizeCanvas);

    // Вычисление азимута и дальности при клике на карту
    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      const dLat = (lat - activeRadar.lat) * 111.12;
      const dLng = (lng - activeRadar.lon) * 111.12 * Math.cos(activeRadar.lat * Math.PI / 180);

      const distance = Math.sqrt(dLat * dLat + dLng * dLng).toFixed(2);
      let azimuth = (Math.atan2(dLng, dLat) * 180 / Math.PI).toFixed(2);
      if (azimuth < 0) azimuth = (parseFloat(azimuth) + 360).toFixed(2);

      document.getElementById('valAz').innerText = azimuth;
      document.getElementById('valR').innerText = distance;

      const phenomena = ["Осадки умерен", "Ливень сильный", "Гроза (R)", "Град умеренн", "Шквал слабый"];
      document.getElementById('valPhenomenon').innerText = phenomena[Math.floor(Math.random() * phenomena.length)];
    });

    // Переключение станций ДМРЛ
    document.getElementById('stationSelect').addEventListener('change', (e) => {
      currentRadarKey = e.target.value;
      activeRadar = RADARS[currentRadarKey];

      map.setView([activeRadar.lat, activeRadar.lon], 8);
      radarMarker.setLatLng([activeRadar.lat, activeRadar.lon])
        .bindPopup(`<b>${activeRadar.name}</b>`).openPopup();

      drawRadarOverlay();
    });

    document.getElementById('btnResetView').onclick = () => {
      map.setView([activeRadar.lat, activeRadar.lon], 8);
    };

    // Генерация архива кадров (.Inr)
    const fileList = document.getElementById('fileList');
    const times = ["09:40","09:50","10:00","10:10","10:20","10:30","10:40","10:50","11:00","11:10","11:20","11:30"];
    
    times.forEach(t => {
      const div = document.createElement('div');
      div.className = 'file-item' + (t === "10:30" ? ' active' : '');
      div.innerText = `20220615_${t.replace(':','')}_1.Inr`;
      div.onclick = () => {
        document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
        div.classList.add('active');
        document.getElementById('currentTime').innerText = t + ":00";
      };
      fileList.appendChild(div);
    });

    // Отрисовка классической легенды
    function renderLegend() {
      const legendBox = document.getElementById('legendBox');
      const items = [
        { name: "Обл.в.ср.ярус", color: "#00c0c0" },
        { name: "Осадки слабы", color: "#00e000" },
        { name: "Осадки умерен", color: "#00ff00" },
        { name: "Осадки сильн", color: "#ffff00" },
        { name: "Ливень слабы", color: "#0000ff" },
        { name: "Гроза (R)", color: "#ff0000" },
        { name: "Град умеренн", color: "#800000" },
        { name: "Шквал сильный", color: "#000000" }
      ];

      let html = `<div class="legend-title">Метеоявления</div>`;
      items.forEach(item => {
        html += `
          <div class="legend-item">
            <div class="color-swatch" style="background:${item.color};"></div>
            <span>${item.name}</span>
          </div>
        `;
      });
      legendBox.innerHTML = html;
    }

    // Инициализация
    renderLegend();
    setTimeout(resizeCanvas, 200);
  </script>
</body>
</html>
