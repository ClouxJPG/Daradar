<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Daradar — Радиолокационная карта России</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
/* =========================================================
   DARADAR — RADAR MAP
   Один файл: HTML + CSS + JavaScript
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #080b10;
  color: #fff;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
}

/* =========================================================
   HEADER
   ========================================================= */

#topbar {
  position: absolute;
  z-index: 1000;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;

  display: flex;
  align-items: center;
  gap: 18px;

  padding: 0 16px;

  background: rgba(10, 13, 19, .96);
  border-bottom: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 2px 12px rgba(0,0,0,.45);
}

.logo {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.5px;
  white-space: nowrap;
}

.logo span {
  color: #4da3ff;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;

  font-size: 12px;
  color: #aeb7c4;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #43d17a;
  box-shadow: 0 0 8px rgba(67,209,122,.7);
}

.top-buttons {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

.top-btn {
  height: 34px;
  padding: 0 11px;

  border: 1px solid rgba(255,255,255,.1);
  border-radius: 6px;

  background: #151a22;
  color: #d9e0e8;

  cursor: pointer;
  font-size: 13px;
}

.top-btn:hover {
  background: #202733;
}

/* =========================================================
   MAP
   ========================================================= */

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #10151d;
}

.leaflet-control-zoom {
  margin-top: 65px !important;
}

.leaflet-control-attribution {
  background: rgba(8,11,16,.75) !important;
  color: #9aa5b3 !important;
}

.leaflet-control-attribution a {
  color: #7fbaff !important;
}

/* =========================================================
   LEFT PANEL
   ========================================================= */

#leftPanel {
  position: absolute;
  z-index: 900;

  left: 12px;
  top: 68px;

  width: 270px;
  max-height: calc(100vh - 150px);

  background: rgba(10,14,20,.94);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 9px;

  box-shadow: 0 8px 30px rgba(0,0,0,.45);

  overflow: hidden;
}

.panel-title {
  padding: 12px 14px;

  font-size: 13px;
  font-weight: 700;

  border-bottom: 1px solid rgba(255,255,255,.08);
  color: #dfe7f1;
}

.panel-section {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.section-label {
  margin-bottom: 7px;

  color: #8995a5;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.select {
  width: 100%;
  height: 36px;

  padding: 0 9px;

  color: #e9eef5;
  background: #171d26;

  border: 1px solid rgba(255,255,255,.1);
  border-radius: 5px;

  outline: none;
}

.select:focus {
  border-color: #3f91ef;
}

.option-row {
  display: flex;
  align-items: center;
  gap: 8px;

  min-height: 30px;

  color: #cbd3de;
  font-size: 13px;
}

.option-row input {
  accent-color: #398ff0;
}

/* =========================================================
   RADAR LEGEND
   ========================================================= */

#legend {
  position: absolute;
  z-index: 900;

  right: 14px;
  top: 68px;

  width: 285px;

  padding: 11px 12px;

  background: rgba(10,14,20,.94);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px;

  box-shadow: 0 8px 30px rgba(0,0,0,.4);
}

.legend-title {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}

.legend-bar {
  width: 100%;
  height: 14px;
  border-radius: 3px;

  background:
    linear-gradient(
      to right,
      #163cff 0%,
      #00aaff 10%,
      #00e6d0 20%,
      #00c840 30%,
      #72e600 40%,
      #e7e600 50%,
      #ffb000 60%,
      #ff6500 70%,
      #ff1800 80%,
      #d00000 90%,
      #ff00ff 100%
    );
}

.legend-values {
  display: flex;
  justify-content: space-between;

  margin-top: 4px;

  color: #aeb7c3;
  font-size: 10px;
}

/* =========================================================
   STATIONS
   ========================================================= */

.radar-station {
  width: 12px;
  height: 12px;

  border-radius: 50%;

  background: #50a8ff;
  border: 2px solid white;

  box-shadow:
    0 0 0 2px rgba(80,168,255,.3),
    0 0 10px rgba(80,168,255,.8);
}

/* =========================================================
   TIMELINE
   ========================================================= */

#timeline {
  position: absolute;
  z-index: 950;

  left: 50%;
  bottom: 15px;
  transform: translateX(-50%);

  width: min(850px, calc(100vw - 30px));

  padding: 11px 13px;

  background: rgba(10,14,20,.95);

  border: 1px solid rgba(255,255,255,.1);
  border-radius: 9px;

  box-shadow: 0 8px 30px rgba(0,0,0,.5);
}

.timeline-top {
  display: flex;
  align-items: center;
  gap: 9px;
}

#play {
  width: 38px;
  height: 32px;

  border: 0;
  border-radius: 5px;

  color: white;
  background: #267ee0;

  cursor: pointer;
  font-size: 15px;
}

#play:hover {
  background: #318dec;
}

#range {
  flex: 1;
  accent-color: #3b92ed;
}

#timeLabel {
  min-width: 150px;
  text-align: right;

  color: #dbe4ef;
  font-size: 12px;
}

.timeline-bottom {
  display: flex;
  justify-content: space-between;

  margin-top: 6px;

  color: #7f8b9b;
  font-size: 10px;
}

/* =========================================================
   COORDINATES
   ========================================================= */

#coords {
  position: absolute;
  z-index: 900;

  left: 12px;
  bottom: 88px;

  padding: 7px 9px;

  color: #c8d0dc;
  background: rgba(10,14,20,.88);

  border: 1px solid rgba(255,255,255,.08);
  border-radius: 5px;

  font-family: monospace;
  font-size: 11px;
}

/* =========================================================
   LOADING
   ========================================================= */

#loading {
  position: absolute;
  z-index: 2000;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  padding: 12px 18px;

  background: rgba(8,11,16,.94);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 7px;

  color: #dce5ef;
  font-size: 13px;

  display: none;
}

#loading.show {
  display: block;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

  #topbar {
    height: 48px;
    padding: 0 10px;
    gap: 10px;
  }

  .logo {
    font-size: 18px;
  }

  .status {
    display: none;
  }

  .top-btn {
    padding: 0 8px;
    font-size: 11px;
  }

  #leftPanel {
    left: 8px;
    top: 57px;
    width: 220px;
    max-height: 48vh;
  }

  #legend {
    right: 8px;
    top: auto;
    bottom: 115px;
    width: 190px;
  }

  #coords {
    display: none;
  }

  #timeline {
    bottom: 8px;
    width: calc(100vw - 16px);
  }

  #timeLabel {
    min-width: 105px;
    font-size: 10px;
  }

  .leaflet-control-zoom {
    margin-top: 58px !important;
  }
}

/* =========================================================
   HIDE LEAFLET DEFAULT BORDER
   ========================================================= */

.leaflet-bar {
  border: 0 !important;
  box-shadow: 0 2px 8px rgba(0,0,0,.4) !important;
}

.leaflet-bar a {
  background: #151b24 !important;
  color: #dce5ef !important;
  border-bottom-color: #2a323e !important;
}

.leaflet-bar a:hover {
  background: #202833 !important;
}
</style>
</head>

<body>

<div id="app">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header id="topbar">

    <div class="logo">
      Dara<span>dar</span>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      <span id="statusText">Система готова</span>
    </div>

    <div class="top-buttons">
      <button class="top-btn" id="homeBtn">Россия</button>
      <button class="top-btn" id="locateBtn">⌖</button>
      <button class="top-btn" id="fullscreenBtn">⛶</button>
    </div>

  </header>


  <!-- =====================================================
       MAP
       ===================================================== -->

  <div id="map"></div>


  <!-- =====================================================
       LEFT CONTROL PANEL
       ===================================================== -->

  <aside id="leftPanel">

    <div class="panel-title">
      Радиолокационные данные
    </div>

    <div class="panel-section">

      <div class="section-label">
        Продукт
      </div>

      <select id="product" class="select">

        <option value="reflectivity">
          Отражаемость (dBZ)
        </option>

        <option value="precipitation">
          Интенсивность осадков
        </option>

        <option value="velocity">
          Радиальная скорость
        </option>

        <option value="echo-top">
          Высота ВГО
        </option>

      </select>

    </div>


    <div class="panel-section">

      <div class="section-label">
        Слои
      </div>

      <label class="option-row">
        <input type="checkbox" id="radarLayer" checked>
        Радиолокационное поле
      </label>

      <label class="option-row">
        <input type="checkbox" id="stationsLayer" checked>
        ДМРЛ
      </label>

      <label class="option-row">
        <input type="checkbox" id="coverageLayer">
        Зоны действия
      </label>

    </div>


    <div class="panel-section">

      <div class="section-label">
        Режим
      </div>

      <label class="option-row">
        <input type="checkbox" id="autoUpdate" checked>
        Автообновление
      </label>

      <label class="option-row">
        <input type="checkbox" id="animation">
        Анимация кадров
      </label>

    </div>


    <div class="panel-section">

      <div class="section-label">
        Масштаб
      </div>

      <button
        class="top-btn"
        style="width:100%"
        id="networkBtn"
      >
        Вся сеть ДМРЛ
      </button>

    </div>

  </aside>


  <!-- =====================================================
       LEGEND
       ===================================================== -->

  <div id="legend">

    <div class="legend-title">
      Отражаемость, dBZ
    </div>

    <div class="legend-bar"></div>

    <div class="legend-values">
      <span>-30</span>
      <span>0</span>
      <span>20</span>
      <span>40</span>
      <span>50</span>
      <span>60+</span>
    </div>

  </div>


  <!-- =====================================================
       COORDINATES
       ===================================================== -->

  <div id="coords">
    55.7558° N&nbsp;&nbsp;37.6173° E
  </div>


  <!-- =====================================================
       TIMELINE
       ===================================================== -->

  <div id="timeline">

    <div class="timeline-top">

      <button id="play">▶</button>

      <input
        id="range"
        type="range"
        min="0"
        max="17"
        value="17"
      >

      <div id="timeLabel">
        Последний кадр
      </div>

    </div>

    <div class="timeline-bottom">

      <span id="oldTime">
        −3 ч
      </span>

      <span id="frameInfo">
        Кадр 18 / 18
      </span>

      <span id="newTime">
        сейчас
      </span>

    </div>

  </div>


  <div id="loading">
    Загрузка радиолокационных данных…
  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   DARADAR
   Основной JavaScript
   ========================================================= */


/* =========================================================
   MAP
   ========================================================= */

const map = L.map("map", {
  zoomControl: true,
  preferCanvas: true,
  minZoom: 3,
  maxZoom: 12
}).setView([60, 90], 4);


/* =========================================================
   BASE MAP
   ========================================================= */

const baseMap = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }
);

baseMap.addTo(map);


/* =========================================================
   RUSSIA BOUNDS
   ========================================================= */

const RUSSIA_BOUNDS = [
  [41, 19],
  [82, 180]
];


/* =========================================================
   HOME
   ========================================================= */

function showRussia() {

  map.fitBounds(RUSSIA_BOUNDS, {
    padding: [20, 20]
  });

}

document
  .getElementById("homeBtn")
  .addEventListener("click", showRussia);

document
  .getElementById("networkBtn")
  .addEventListener("click", showRussia);


/* =========================================================
   COORDINATES
   ========================================================= */

map.on("mousemove", function(e) {

  const lat = e.latlng.lat.toFixed(4);
  const lon = e.latlng.lng.toFixed(4);

  document.getElementById("coords").textContent =
    `${lat}° N    ${lon}° E`;

});


/* =========================================================
   RADAR STATIONS
   ========================================================= */

/*
   Это реальные географические точки ДМРЛ,
   но список является только интерфейсным слоем.

   Само наличие станции здесь НЕ означает,
   что через неё уже получаются радиолокационные данные.

   Когда будет настоящий feed, этот массив можно
   заменить автоматической загрузкой станции из backend.
*/

const radarStations = [

  ["Москва", 55.60, 37.30],
  ["Санкт-Петербург", 59.95, 30.30],
  ["Нижний Новгород", 56.25, 43.95],
  ["Казань", 55.80, 49.10],
  ["Самара", 53.20, 50.15],
  ["Уфа", 54.75, 56.00],
  ["Екатеринбург", 56.85, 60.60],
  ["Челябинск", 55.15, 61.40],
  ["Омск", 54.95, 73.40],
  ["Новосибирск", 55.05, 82.90],
  ["Красноярск", 56.00, 92.90],
  ["Иркутск", 52.30, 104.30],
  ["Владивосток", 43.10, 131.90],
  ["Ростов-на-Дону", 47.25, 39.70],
  ["Волгоград", 48.70, 44.50],
  ["Сочи", 43.60, 39.70]
];


const stationLayer = L.layerGroup();


radarStations.forEach(station => {

  const name = station[0];
  const lat = station[1];
  const lon = station[2];

  const icon = L.divIcon({
    className: "",
    html: `<div class="radar-station"></div>`,
    iconSize: [12,12],
    iconAnchor: [6,6]
  });

  const marker = L.marker(
    [lat, lon],
    { icon }
  );

  marker.bindPopup(`
    <b>${name}</b><br>
    ДМРЛ<br>
    Координаты: ${lat.toFixed(2)}, ${lon.toFixed(2)}
  `);

  marker.addTo(stationLayer);

});


stationLayer.addTo(map);


/* =========================================================
   COVERAGE
   ========================================================= */

const coverageLayer = L.layerGroup();


radarStations.forEach(station => {

  L.circle(
    [station[1], station[2]],
    {
      radius: 120000,
      color: "#3e9cff",
      weight: 1,
      opacity: .16,
      fillColor: "#3e9cff",
      fillOpacity: .035
    }
  ).addTo(coverageLayer);

});


/* =========================================================
   RADAR DATA LAYER
   ========================================================= */

/*
   ВАЖНО:

   Здесь НЕ используется фальшивый radar tile.

   Когда будет настоящий источник, функция ниже должна
   возвращать реальный radar product.

   Возможные варианты backend:

   /api/radar/tiles/{z}/{x}/{y}
   /api/radar/wms
   /api/radar/bufr
   /api/radar/baltrad

   Сам URL намеренно не выдумываем.
*/

let radarLayer = null;


/* =========================================================
   REAL RADAR CONNECTOR
   ========================================================= */

async function loadRealRadar() {

  /*
     Здесь будет подключение реального источника.

     Пример архитектуры:

     const response = await fetch(
       "/api/radar/latest"
     );

     const data = await response.json();

     renderRadar(data);

     Но пока реального разрешённого endpoint
     у Daradar нет.
  */

  document.getElementById("statusText").textContent =
    "Ожидание источника радиолокационных данных";

}


/* =========================================================
   TIMELINE
   ========================================================= */

const range = document.getElementById("range");
const play = document.getElementById("play");
const timeLabel = document.getElementById("timeLabel");
const frameInfo = document.getElementById("frameInfo");

let playing = false;
let timer = null;

const FRAME_COUNT = 18;


function updateTimeline() {

  const frame = Number(range.value);

  frameInfo.textContent =
    `Кадр ${frame + 1} / ${FRAME_COUNT}`;

  if (frame === FRAME_COUNT - 1) {

    timeLabel.textContent = "Последний кадр";

  } else {

    const minutesAgo =
      (FRAME_COUNT - 1 - frame) * 10;

    timeLabel.textContent =
      `${minutesAgo} мин назад`;

  }

  /*
     Здесь при наличии backend вызывается:

     loadRadarFrame(frame);
  */

}


range.addEventListener(
  "input",
  updateTimeline
);


function startAnimation() {

  if (playing) return;

  playing = true;
  play.textContent = "Ⅱ";

  timer = setInterval(() => {

    let next = Number(range.value) + 1;

    if (next >= FRAME_COUNT) {
      next = 0;
    }

    range.value = next;

    updateTimeline();

  }, 700);

}


function stopAnimation() {

  playing = false;
  play.textContent = "▶";

  if (timer) {
    clearInterval(timer);
    timer = null;
  }

}


play.addEventListener("click", () => {

  if (playing) {
    stopAnimation();
  } else {
    startAnimation();
  }

});


/* =========================================================
   LAYER CONTROLS
   ========================================================= */

document
  .getElementById("stationsLayer")
  .addEventListener("change", function() {

    if (this.checked) {
      stationLayer.addTo(map);
    } else {
      map.removeLayer(stationLayer);
    }

  });


document
  .getElementById("coverageLayer")
  .addEventListener("change", function() {

    if (this.checked) {
      coverageLayer.addTo(map);
    } else {
      map.removeLayer(coverageLayer);
    }

  });


document
  .getElementById("radarLayer")
  .addEventListener("change", function() {

    if (!radarLayer) return;

    if (this.checked) {
      radarLayer.addTo(map);
    } else {
      map.removeLayer(radarLayer);
    }

  });


/* =========================================================
   PRODUCT
   ========================================================= */

document
  .getElementById("product")
  .addEventListener("change", function() {

    const product = this.value;

    console.log(
      "Выбран продукт:",
      product
    );

    /*
       Здесь переключается настоящий продукт:

       reflectivity
       precipitation
       velocity
       echo-top
    */

  });


/* =========================================================
   AUTO UPDATE
   ========================================================= */

let updateTimer = null;


function startAutoUpdate() {

  if (updateTimer) {
    clearInterval(updateTimer);
  }

  updateTimer = setInterval(() => {

    loadRealRadar();

  }, 60000);

}


document
  .getElementById("autoUpdate")
  .addEventListener("change", function() {

    if (this.checked) {

      startAutoUpdate();

    } else {

      clearInterval(updateTimer);
      updateTimer = null;

    }

  });


/* =========================================================
   FULLSCREEN
   ========================================================= */

document
  .getElementById("fullscreenBtn")
  .addEventListener("click", function() {

    if (!document.fullscreenElement) {

      document.documentElement.requestFullscreen()
        .catch(() => {});

    } else {

      document.exitFullscreen()
        .catch(() => {});

    }

  });


/* =========================================================
   GEOLOCATION
   ========================================================= */

document
  .getElementById("locateBtn")
  .addEventListener("click", function() {

    if (!navigator.geolocation) {
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position => {

        const lat =
          position.coords.latitude;

        const lon =
          position.coords.longitude;

        map.setView(
          [lat, lon],
          8
        );

      }
    );

  });


/* =========================================================
   INITIALIZATION
   ========================================================= */

showRussia();

updateTimeline();

loadRealRadar();

startAutoUpdate();


/* =========================================================
   END
   ========================================================= */
</script>

</body>
</html>
