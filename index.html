<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Метео Радар Pro</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --bg-glass: rgba(15, 20, 32, 0.78);
            --bg-glass-hover: rgba(28, 36, 56, 0.9);
            --bg-card: rgba(18, 24, 38, 0.94);
            --border: rgba(255, 255, 255, 0.12);
            --border-light: rgba(255, 255, 255, 0.22);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07090e;
            color: var(--text-primary);
            user-select: none;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #07090e;
        }

        /* Плавные слои радара для crossfade */
        .leaflet-tile-container {
            will-change: opacity;
            transition: opacity 0.25s var(--ease-smooth);
        }

        /* Попап погоды */
        .leaflet-popup-content-wrapper {
            background: var(--bg-card) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-light) !important;
            box-shadow: var(--shadow) !important;
            border-radius: 20px !important;
            backdrop-filter: blur(24px);
            padding: 4px !important;
            animation: popupScale 0.25s var(--ease-spring);
        }

        @keyframes popupScale {
            from { opacity: 0; transform: scale(0.85) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .leaflet-popup-tip {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-light) !important;
        }

        .leaflet-popup-content {
            margin: 12px 16px !important;
        }

        .weather-pop-card { min-width: 210px; }
        .pop-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .pop-temp {
            font-size: 28px;
            font-weight: 800;
            color: #60a5fa;
            letter-spacing: -0.5px;
        }
        .pop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 11px;
        }
        .pop-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-secondary);
        }
        .pop-item b { color: var(--text-primary); }

        /* Кнопки зума */
        .leaflet-control-zoom {
            border: none !important;
            margin-bottom: 120px !important;
            margin-right: 14px !important;
        }
        .leaflet-control-zoom a {
            background: var(--bg-glass) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border) !important;
            border-radius: 14px !important;
            width: 42px !important;
            height: 42px !important;
            line-height: 42px !important;
            margin-top: 8px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            transition: all 0.2s var(--ease-spring);
        }
        .leaflet-control-zoom a:active {
            transform: scale(0.92);
        }

        /* Верхняя панель */
        .top-deck {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            pointer-events: none;
        }

        .glass-pill {
            pointer-events: auto;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            transition: all 0.25s var(--ease-spring);
        }

        .brand-pill {
            padding: 0 16px;
            height: 46px;
            font-size: 13px;
            font-weight: 800;
            gap: 10px;
            color: #fff;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .brand-pill i {
            color: var(--accent);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 380px;
            pointer-events: auto;
        }

        .search-pill {
            height: 46px;
            padding: 0 16px;
            gap: 10px;
            width: 100%;
        }

        .search-pill input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
            font-weight: 500;
        }

        .search-results {
            position: absolute;
            top: 54px;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: none;
            z-index: 50;
            animation: fadeIn 0.2s var(--ease-spring);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-item {
            padding: 12px 16px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: rgba(255, 255, 255, 0.08); }

        .tools-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .btn-glass {
            width: 46px;
            height: 46px;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s var(--ease-spring);
        }

        .btn-glass:hover {
            background: var(--bg-glass-hover);
            border-color: var(--border-light);
            transform: translateY(-2px);
        }

        .btn-glass:active {
            transform: scale(0.92);
        }

        .btn-glass.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        /* Быстрый бар городов */
        .cities-bar {
            position: absolute;
            top: 68px;
            left: 14px;
            right: 14px;
            z-index: 9;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            pointer-events: auto;
            scrollbar-width: none;
        }
        .cities-bar::-webkit-scrollbar { display: none; }

        .city-chip {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            box-shadow: var(--shadow);
        }
        .city-chip:hover {
            border-color: var(--accent);
            color: #60a5fa;
            transform: translateY(-1px);
        }
        .city-chip:active { transform: scale(0.94); }

        /* Легенда */
        .legend-pill {
            position: absolute;
            top: 112px;
            left: 14px;
            z-index: 9;
            padding: 6px 12px;
            flex-direction: column;
            gap: 4px;
            pointer-events: auto;
        }

        .legend-bar {
            width: 120px;
            height: 5px;
            border-radius: 3px;
            background: linear-gradient(to right, #00e676, #ffeb3b, #ff9800, #f44336, #9c27b0);
        }

        /* Линейка */
        .ruler-badge {
            position: absolute;
            top: 112px;
            right: 14px;
            z-index: 9;
            padding: 6px 14px;
            font-size: 12px;
            gap: 10px;
            pointer-events: auto;
            display: none;
        }
        .ruler-badge.active { display: flex; animation: fadeIn 0.2s var(--ease-spring); }

        /* Плеер */
        .player-deck {
            position: absolute;
            bottom: 20px;
            left: 14px;
            right: 14px;
            z-index: 10;
            max-width: 600px;
            margin: 0 auto;
            padding: 14px 18px;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            border-radius: 22px;
        }

        .player-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--warning);
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.35);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .time-readout {
            font-size: 16px;
            font-weight: 800;
            color: #60a5fa;
            letter-spacing: -0.2px;
        }

        .player-body {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .play-btn-main {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--accent);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 0 16px var(--accent-glow);
            transition: all 0.2s var(--ease-spring);
        }
        .play-btn-main:hover { transform: scale(1.05); }
        .play-btn-main:active { transform: scale(0.92); }

        .range-container {
            flex: 1;
            display: flex;
            align-items: center;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.18);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--accent);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.15s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* НАСТРОЙКА БОКОВОЙ ПАНЕЛИ (ШТОРКА) С ИДЕАЛЬНЫМИ АНИМАЦИЯМИ */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.35s var(--ease-smooth), visibility 0.35s;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .drawer-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 101;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            border-radius: 28px 28px 0 0;
            padding: 24px;
            max-height: 85vh;
            overflow-y: auto;
            transform: translate3d(0, 100%, 0);
            visibility: hidden;
            pointer-events: none;
            transition: transform 0.4s var(--ease-spring), visibility 0.4s;
            box-shadow: var(--shadow);
        }

        .drawer-sheet.active {
            transform: translate3d(0, 0, 0);
            visibility: visible;
            pointer-events: auto;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin: 16px 0 10px 0;
        }

        .option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: 0.3s var(--ease-smooth);
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s var(--ease-spring);
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        .base-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .btn-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 0;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
        }
        .btn-card:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-card.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.25);
            color: #60a5fa;
            font-weight: 700;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .drawer-cities-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .drawer-city-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .drawer-city-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
        }

        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            z-index: 200;
            background: var(--accent);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            pointer-events: none;
            opacity: 0;
            transform: translate3d(-50%, -15px, 0) scale(0.9);
            transition: all 0.3s var(--ease-spring);
            box-shadow: 0 10px 25px var(--accent-glow);
        }
        .toast.active {
            opacity: 1;
            transform: translate3d(-50%, 0, 0) scale(1);
        }

        @media (min-width: 640px) {
            .drawer-sheet {
                top: 70px;
                right: 14px;
                left: auto;
                bottom: auto;
                width: 340px;
                border-radius: 22px;
                border: 1px solid var(--border-light);
                transform: translate3d(20px, 0, 0) scale(0.95);
                opacity: 0;
            }
            .drawer-sheet.active {
                transform: translate3d(0, 0, 0) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div id="map"></div>
<div class="toast" id="toast"></div>

<!-- Верхняя панель -->
<div class="top-deck">
    <div class="glass-pill brand-pill">
        <i class="fa-solid fa-cloud-bolt"></i> РАДАР
    </div>

    <div class="search-container">
        <div class="glass-pill search-pill">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-secondary); font-size: 13px;"></i>
            <input type="text" id="searchInput" placeholder="Поиск города..." oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Enter') searchCity()">
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>

    <div class="tools-group">
        <button class="btn-glass" onclick="locateUser()" title="Мое местоположение">
            <i class="fa-solid fa-location-arrow"></i>
        </button>
        <button class="btn-glass" id="rulerBtn" onclick="toggleRuler()" title="Линейка">
            <i class="fa-solid fa-ruler-combined"></i>
        </button>
        <button class="btn-glass" onclick="toggleDrawer()" title="Слои и настройки">
            <i class="fa-solid fa-sliders"></i>
        </button>
    </div>
</div>

<!-- Горизонтальный бар быстрых городов -->
<div class="cities-bar">
    <div class="city-chip" onclick="flyToCity(55.7512, 37.6184, 'Москва')">Москва</div>
    <div class="city-chip" onclick="flyToCity(59.9386, 30.3141, 'Санкт-Петербург')">СПб</div>
    <div class="city-chip" onclick="flyToCity(43.5855, 39.7231, 'Сочи')">Сочи</div>
    <div class="city-chip" onclick="flyToCity(56.8389, 60.6057, 'Екатеринбург')">Екатеринбург</div>
    <div class="city-chip" onclick="flyToCity(55.0302, 82.9204, 'Новосибирск')">Новосибирск</div>
    <div class="city-chip" onclick="flyToCity(55.7887, 49.1221, 'Казань')">Казань</div>
    <div class="city-chip" onclick="flyToCity(43.1155, 131.8855, 'Владивосток')">Владивосток</div>
</div>

<!-- Легенда -->
<div class="glass-pill legend-pill">
    <span style="font-size: 9px; color: var(--text-secondary); font-weight:800;">ОСАДКИ</span>
    <div class="legend-bar"></div>
</div>

<!-- Табло измерителя -->
<div class="glass-pill ruler-badge" id="rulerBadge">
    <span>Дистанция: <b id="rulerDist" style="color:var(--accent);">0 км</b></span>
    <i class="fa-solid fa-xmark" style="cursor:pointer; color:var(--danger);" onclick="clearRuler()"></i>
</div>

<!-- Плеер -->
<div class="glass-pill player-deck">
    <div class="player-top">
        <div class="status-badge" id="statusBadge"><span id="statusText">АРХИВ</span></div>
        <div class="time-readout" id="timeReadout">--:--</div>
    </div>
    <div class="player-body">
        <button class="play-btn-main" id="playBtn" onclick="togglePlay()">
            <i class="fa-solid fa-play"></i>
        </button>
        <div class="range-container">
            <input type="range" id="timeSlider" min="0" max="100" value="0" oninput="onSeek(this.value)">
        </div>
        <button class="btn-glass" style="width:40px; height:40px; font-size:12px; font-weight:800;" onclick="changeSpeed()">
            <span id="speedVal">1x</span>
        </button>
    </div>
</div>

<!-- Боковая панель (Шторка) -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer-sheet" id="drawerSheet">
    <div class="drawer-header">
        <span>Слои и настройки</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:16px;" onclick="toggleDrawer()"></i>
    </div>

    <div class="section-title">Радар</div>
    <div class="option-row">
        <span>Отображать осадки</span>
        <label class="toggle-switch">
            <input type="checkbox" id="radarCheck" checked onchange="toggleRadar(this.checked)">
            <span class="slider"></span>
        </label>
    </div>
    <div style="margin: 6px 0 12px 0;">
        <div class="option-row" style="color:var(--text-secondary); font-size:12px;">
            <span>Прозрачность радара</span>
            <span id="opLabel">75%</span>
        </div>
        <input type="range" min="0" max="100" value="75" oninput="setOpacity(this.value)">
    </div>

    <div class="section-title">Карта-подложка</div>
    <div class="base-grid">
        <div class="btn-card active" onclick="setBase('dark', this)">Темная</div>
        <div class="btn-card" onclick="setBase('sat', this)">Спутник</div>
        <div class="btn-card" onclick="setBase('light', this)">Светлая</div>
        <div class="btn-card" onclick="setBase('osm', this)">Схема</div>
    </div>

    <div class="section-title">Быстрый переход к городам</div>
    <div class="drawer-cities-list">
        <div class="drawer-city-btn" onclick="flyToCity(55.7512, 37.6184, 'Москва'); toggleDrawer();">Москва</div>
        <div class="drawer-city-btn" onclick="flyToCity(59.9386, 30.3141, 'Санкт-Петербург'); toggleDrawer();">Санкт-Петербург</div>
        <div class="drawer-city-btn" onclick="flyToCity(43.5855, 39.7231, 'Сочи'); toggleDrawer();">Сочи</div>
        <div class="drawer-city-btn" onclick="flyToCity(56.8389, 60.6057, 'Екатеринбург'); toggleDrawer();">Екатеринбург</div>
        <div class="drawer-city-btn" onclick="flyToCity(55.0302, 82.9204, 'Новосибирск'); toggleDrawer();">Новосибирск</div>
        <div class="drawer-city-btn" onclick="flyToCity(55.7887, 49.1221, 'Казань'); toggleDrawer();">Казань</div>
    </div>
</div>

<script>
    // Инициализация карты Leaflet
    const map = L.map('map', {
        center: [55.7512, 37.6184],
        zoom: 6,
        zoomControl: false,
        fadeAnimation: true
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Базовые карты
    const basemaps = {
        dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }),
        sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
        light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }),
        osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
    };

    let activeBase = basemaps.dark;
    activeBase.addTo(map);

    function setBase(type, btn) {
        map.removeLayer(activeBase);
        activeBase = basemaps[type];
        activeBase.addTo(map);
        document.querySelectorAll('.btn-card').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    /* -------------------------------------------------------------
       ДВУХБУФЕРНЫЙ ПЛАВНЫЙ ДВИЖОК РАДАРА (БЕЗ ВЫЛЕТОВ И С ЛАГАМИ 0%)
    ------------------------------------------------------------- */
    let frames = [];
    let currentIndex = 0;
    let isPlaying = false;
    let playTimer = null;
    let animSpeed = 500;
    let targetOpacity = 0.75;
    let isRadarVisible = true;

    // Создаем ровно 2 слоя для плавной смены кадра (Crossfade)
    const radarLayers = [
        L.tileLayer('', { opacity: 0, zIndex: 100 }).addTo(map),
        L.tileLayer('', { opacity: 0, zIndex: 101 }).addTo(map)
    ];
    let activeBuffer = 0;

    async function initRadar() {
        try {
            const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const data = await res.json();
            const past = data.radar.past || [];
            const nowcast = data.radar.nowcast || [];
            frames = [...past, ...nowcast];

            if (!frames.length) return;

            currentIndex = past.length > 0 ? past.length - 1 : 0;
            showFrame(currentIndex, true);
        } catch (e) {
            document.getElementById('timeReadout').innerText = "Ошибка загрузки";
        }
    }

    function showFrame(idx, immediate = false) {
        if (!frames.length || !frames[idx]) return;

        const time = frames[idx].time;
        const newUrl = `https://tilecache.rainviewer.com/v2/radar/${time}/256/{z}/{x}/{y}/2/1_1.png`;

        if (isRadarVisible) {
            if (immediate) {
                radarLayers[activeBuffer].setUrl(newUrl);
                radarLayers[activeBuffer].setOpacity(targetOpacity);
            } else {
                const nextBuffer = 1 - activeBuffer;
                const nextLayer = radarLayers[nextBuffer];
                const currentLayer = radarLayers[activeBuffer];

                nextLayer.setUrl(newUrl);
                nextLayer.setOpacity(targetOpacity);
                currentLayer.setOpacity(0);

                activeBuffer = nextBuffer;
            }
        }

        // Обновление интерфейса
        const date = new Date(time * 1000);
        document.getElementById('timeReadout').innerText = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const nowSec = Math.floor(Date.now() / 1000);
        const statusText = document.getElementById('statusText');
        if (time > nowSec) {
            statusText.innerText = "ПРОГНОЗ";
        } else {
            statusText.innerText = "АРХИВ";
        }

        const slider = document.getElementById('timeSlider');
        const pct = (idx / (frames.length - 1)) * 100;
        slider.value = pct;
        slider.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, rgba(255,255,255,0.18) ${pct}%, rgba(255,255,255,0.18) 100%)`;
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('playBtn');
        if (isPlaying) {
            btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            playTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % frames.length;
                showFrame(currentIndex);
            }, animSpeed);
        } else {
            btn.innerHTML = '<i class="fa-solid fa-play"></i>';
            clearInterval(playTimer);
        }
    }

    function onSeek(val) {
        if (!frames.length) return;
        currentIndex = Math.round((val / 100) * (frames.length - 1));
        showFrame(currentIndex, true);
    }

    function changeSpeed() {
        const speeds = [500, 250, 1000];
        const labels = ['1x', '2x', '0.5x'];
        let i = speeds.indexOf(animSpeed);
        i = (i + 1) % speeds.length;
        animSpeed = speeds[i];
        document.getElementById('speedVal').innerText = labels[i];

        if (isPlaying) {
            clearInterval(playTimer);
            playTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % frames.length;
                showFrame(currentIndex);
            }, animSpeed);
        }
    }

    function toggleRadar(show) {
        isRadarVisible = show;
        if (show) {
            radarLayers[activeBuffer].setOpacity(targetOpacity);
        } else {
            radarLayers[0].setOpacity(0);
            radarLayers[1].setOpacity(0);
        }
    }

    function setOpacity(val) {
        document.getElementById('opLabel').innerText = val + '%';
        targetOpacity = val / 100;
        if (isRadarVisible) {
            radarLayers[activeBuffer].setOpacity(targetOpacity);
        }
    }

    /* -------------------------------------------------------------
       ИНСПЕКТОР ПОГОДЫ В ТОЧКЕ (OPEN-METEO)
    ------------------------------------------------------------- */
    map.on('click', async (e) => {
        if (rulerActive) {
            addRulerPoint(e.latlng);
            return;
        }

        const lat = e.latlng.lat.toFixed(4);
        const lon = e.latlng.lng.toFixed(4);

        const popup = L.popup({ offset: [0, -6] })
            .setLatLng(e.latlng)
            .setContent(`<div style="font-size:12px; color:var(--text-secondary); text-align:center; padding: 6px;"><i class="fa-solid fa-spinner fa-spin"></i> Загрузка погоды...</div>`)
            .openOn(map);

        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,wind_speed_10m&wind_speed_unit=ms`;
            const res = await fetch(url);
            const data = await res.json();
            const c = data.current;

            popup.setContent(`
                <div class="weather-pop-card">
                    <div class="pop-head">
                        <div>
                            <div style="font-size:13px; font-weight:800; color:#fff;">Погода в точке</div>
                            <div style="font-size:10px; color:var(--text-secondary);">${lat}, ${lon}</div>
                        </div>
                    </div>
                    <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:10px;">
                        <div class="pop-temp">${c.temperature_2m > 0 ? '+' : ''}${Math.round(c.temperature_2m)}°C</div>
                        <div style="font-size:11px; color:var(--text-secondary);">Ощущается <b style="color:#fff">${Math.round(c.apparent_temperature)}°C</b></div>
                    </div>
                    <div class="pop-grid">
                        <div class="pop-item">Ветер <b>${c.wind_speed_10m} м/с</b></div>
                        <div class="pop-item">Влажность <b>${c.relative_humidity_2m}%</b></div>
                        <div class="pop-item">Осадки <b>${c.precipitation} мм</b></div>
                    </div>
                </div>
            `);
        } catch (err) {
            popup.setContent(`<div style="font-size:12px; color:var(--danger); padding:4px;">Ошибка получения данных</div>`);
        }
    });

    /* -------------------------------------------------------------
       ПОИСК И АВТОКОМПЛИТ
    ------------------------------------------------------------- */
    let searchDebounce = null;
    function onSearchInput(val) {
        clearTimeout(searchDebounce);
        const resBox = document.getElementById('searchResults');

        if (!val.trim()) {
            resBox.style.display = 'none';
            return;
        }

        searchDebounce = setTimeout(async () => {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=4`);
                const data = await res.json();

                if (data.length > 0) {
                    resBox.innerHTML = data.map(item => `
                        <div class="search-item" onclick="selectSearch(${item.lat}, ${item.lon}, '${item.display_name.replace(/'/g, "\\'")}')">
                            <i class="fa-solid fa-location-dot" style="color:var(--accent); margin-right:8px;"></i>
                            ${item.display_name}
                        </div>
                    `).join('');
                    resBox.style.display = 'block';
                } else {
                    resBox.style.display = 'none';
                }
            } catch (e) {
                resBox.style.display = 'none';
            }
        }, 300);
    }

    function selectSearch(lat, lon, name) {
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('searchInput').value = name.split(',')[0];
        flyToCity(lat, lon, name.split(',')[0]);
    }

    function searchCity() {
        const q = document.getElementById('searchInput').value;
        if (!q) return;
        onSearchInput(q);
    }

    function flyToCity(lat, lon, name) {
        map.flyTo([lat, lon], 9, { duration: 1.4 });
        showToast(name);
    }

    function locateUser() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(
            pos => {
                flyToCity(pos.coords.latitude, pos.coords.longitude, "Ваша геопозиция");
            },
            () => showToast("Геолокация недоступна")
        );
    }

    /* -------------------------------------------------------------
       ЛИНЕЙКА (ИЗМЕРЕНИЕ РАССТОЯНИЙ)
    ------------------------------------------------------------- */
    let rulerActive = false;
    let rulerPoints = [];
    let rulerPolyline = null;
    let rulerMarkers = [];

    function toggleRuler() {
        rulerActive = !rulerActive;
        const btn = document.getElementById('rulerBtn');
        const badge = document.getElementById('rulerBadge');

        if (rulerActive) {
            btn.classList.add('active');
            badge.classList.add('active');
            showToast("Кликайте по карте для измерения");
        } else {
            btn.classList.remove('active');
            badge.classList.remove('active');
            clearRuler();
        }
    }

    function addRulerPoint(latlng) {
        rulerPoints.push(latlng);
        const m = L.circleMarker(latlng, { radius: 5, color: '#3b82f6', fillColor: '#ffffff', fillOpacity: 1 }).addTo(map);
        rulerMarkers.push(m);

        if (rulerPoints.length > 1) {
            if (rulerPolyline) map.removeLayer(rulerPolyline);
            rulerPolyline = L.polyline(rulerPoints, { color: '#3b82f6', weight: 3, dashArray: '6, 6' }).addTo(map);

            let total = 0;
            for (let i = 0; i < rulerPoints.length - 1; i++) {
                total += rulerPoints[i].distanceTo(rulerPoints[i + 1]);
            }
            document.getElementById('rulerDist').innerText = (total / 1000).toFixed(1) + ' км';
        }
    }

    function clearRuler() {
        rulerPoints = [];
        if (rulerPolyline) map.removeLayer(rulerPolyline);
        rulerMarkers.forEach(m => map.removeLayer(m));
        rulerMarkers = [];
        document.getElementById('rulerDist').innerText = '0 км';
    }

    /* -------------------------------------------------------------
       УПРАВЛЕНИЕ ШТОРКОЙ И УВЕДОМЛЕНИЯМИ
    ------------------------------------------------------------- */
    function toggleDrawer() {
        document.getElementById('drawerSheet').classList.toggle('active');
        document.getElementById('drawerOverlay').classList.toggle('active');
    }

    let toastTimer = null;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('active');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.classList.remove('active'); }, 2200);
    }

    // Старт радара
    initRadar();
</script>
</body>
</html>
