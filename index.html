<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Метеорадар - Веб-интерфейс</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Контейнер приложения */
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Область карты / радара */
        #radarCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Верхняя панель настроек */
        .top-nav {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 100;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .control-group label {
            color: var(--text-muted);
        }

        select, input[type="range"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:hover, input[type="range"]:hover {
            border-color: var(--accent-color);
        }

        /* Карточка данных среды (привязана к точке) */
        .env-callout {
            position: absolute;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 12px;
            width: 220px;
            pointer-events: none;
            z-index: 50;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5);
            transform: translate(-50%, -115%);
            transition: opacity 0.2s ease, transform 0.2s ease;
            opacity: 0;
        }

        .env-callout.visible {
            opacity: 1;
        }

        .env-callout::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 12px;
            height: 12px;
            background: #0f172a;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .env-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .env-metric {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .env-metric span:last-child {
            font-weight: 600;
        }

        /* Подсказка внизу */
        .hint-footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            pointer-events: none;
            backdrop-filter: blur(6px);
            border: 1px solid var(--border-color);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Радар / Карта -->
        <canvas id="radarCanvas"></canvas>

        <!-- Верхнее плавающее меню настроек -->
        <div class="top-nav">
            <div class="control-group">
                <label for="layerSelect">Слой:</label>
                <select id="layerSelect">
                    <option value="rain">Дождь (dBZ)</option>
                    <option value="wind">Ветер и потоки</option>
                    <option value="temp">Температурная карта</option>
                </select>
            </div>
            <div class="control-group">
                <label for="opacityRange">Прозрачность:</label>
                <input type="range" id="opacityRange" min="0.2" max="1" step="0.05" value="0.75">
            </div>
        </div>

        <!-- Всплывающая панель среды над точкой -->
        <div id="envCallout" class="env-callout">
            <div class="env-title">
                <span>Метео-точка</span>
                <span id="coordBadge">55.75, 37.61</span>
            </div>
            <div class="env-metric">
                <span style="color: var(--text-muted);">Температура:</span>
                <span id="valTemp">+18.4°C</span>
            </div>
            <div class="env-metric">
                <span style="color: var(--text-muted);">Осадки:</span>
                <span id="valRain">1.2 мм/ч</span>
            </div>
            <div class="env-metric">
                <span style="color: var(--text-muted);">Давление:</span>
                <span id="valPressure">752 мм рт. ст.</span>
            </div>
            <div class="env-metric">
                <span style="color: var(--text-muted);">Ветер:</span>
                <span id="valWind">4.1 м/с, СЗ</span>
            </div>
        </div>

        <!-- Текстовая подсказка -->
        <div class="hint-footer">Кликните в любую точку карты для анализа среды</div>
    </div>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const callout = document.getElementById('envCallout');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Параметры точки и анимаций
        let activePoint = { x: width / 2, y: height / 2 };
        let isPointActive = true;
        let radarAngle = 0;
        let pulseRadius = 0;

        // Генерация случайных погодных зон (пятна осадков)
        const stormCells = Array.from({ length: 7 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            radius: 60 + Math.random() * 100,
            intensity: Math.random()
        }));

        // Обработка клика по карте
        canvas.addEventListener('click', (e) => {
            activePoint = { x: e.clientX, y: e.clientY };
            isPointActive = true;
            updateCalloutPosition();
            
            // Рандомизация значений при клике для демонстрации динамики
            document.getElementById('valTemp').textContent = (15 + Math.random() * 10).toFixed(1) + '°C';
            document.getElementById('valRain').textContent = (Math.random() * 3).toFixed(1) + ' мм/ч';
            document.getElementById('coordBadge').textContent = `${(e.clientY / 10).toFixed(1)}, ${(e.clientX / 10).toFixed(1)}`;
            
            callout.classList.add('visible');
        });

        function updateCalloutPosition() {
            callout.style.left = `${activePoint.x}px`;
            callout.style.top = `${activePoint.y}px`;
        }

        // Инициализация позиции по умолчанию (центр)
        updateCalloutPosition();
        callout.classList.add('visible');

        // Главный цикл отрисовки и анимации
        function animate() {
            // Очистка экрана фона
            ctx.fillStyle = '#0b132b';
            ctx.fillRect(0, 0, width, height);

            // 1. Отрисовка сетки радара (концентрические кольца)
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
            ctx.lineWidth = 1;
            const centerX = width / 2;
            const centerY = height / 2;
            
            for (let r = 100; r < Math.max(width, height); r += 120) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Перекрестия сетки
            ctx.beginPath();
            ctx.moveTo(0, centerY); ctx.lineTo(width, centerY);
            ctx.moveTo(centerX, 0); ctx.lineTo(centerX, height);
            ctx.stroke();

            // 2. Отрисовка зон осадков / облачности
            const currentOpacity = parseFloat(document.getElementById('opacityRange').value);
            stormCells.forEach(cell => {
                const gradient = ctx.createRadialGradient(cell.x, cell.y, 0, cell.x, cell.y, cell.radius);
                gradient.addColorStop(0, `rgba(34, 197, 94, ${0.6 * currentOpacity})`);
                gradient.addColorStop(0.5, `rgba(234, 179, 8, ${0.4 * currentOpacity})`);
                gradient.addColorStop(1, 'rgba(239, 68, 68, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(cell.x, cell.y, cell.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Анимированный радарный луч (Sweep)
            radarAngle += 0.025;
            const sweepRadius = Math.max(width, height);
            const sweepGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, sweepRadius);
            sweepGradient.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
            sweepGradient.addColorStop(1, 'rgba(56, 189, 248, 0)');

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, sweepRadius, radarAngle, radarAngle + 0.5);
            ctx.closePath();
            ctx.fillStyle = sweepGradient;
            ctx.fill();
            ctx.restore();

            // 4. Пульсирующий маркер выбранной точки
            if (isPointActive) {
                pulseRadius = (pulseRadius + 0.5) % 30;
                
                // Внешняя расходящаяся волна
                ctx.strokeStyle = `rgba(56, 189, 248, ${1 - pulseRadius / 30})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(activePoint.x, activePoint.y, pulseRadius + 6, 0, Math.PI * 2);
                ctx.stroke();

                // Ядро маркера
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(activePoint.x, activePoint.y, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
