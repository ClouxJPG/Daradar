<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>Daradar — Метеорадар</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
/* =========================================================
   DARADAR — FULL INTERFACE
   Один index.html
   Адаптация ПК + телефон
   ========================================================= */

:root {
    --bg: #101216;
    --panel: rgba(20, 23, 29, .96);
    --panel2: rgba(28, 32, 40, .96);
    --border: rgba(255,255,255,.09);
    --text: #f4f5f7;
    --muted: #9da4af;
    --accent: #4d9cff;
    --danger: #ff4d5f;
    --radius: 14px;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
}

button,
select,
input {
    font: inherit;
}

button {
    color: inherit;
}

/* =========================================================
   MAP
   ========================================================= */

#map {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: #101216;
}

.leaflet-control-attribution {
    background: rgba(10,10,12,.72) !important;
    color: #8c929c !important;
}

.leaflet-control-attribution a {
    color: #aeb8c7 !important;
}

/* =========================================================
   TOP BAR
   ========================================================= */

#topbar {
    position: fixed;
    z-index: 1000;

    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;

    height: 54px;

    display: flex;
    align-items: center;

    padding: 0 10px;

    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow: 0 8px 30px rgba(0,0,0,.28);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 19px;
    font-weight: 800;
    letter-spacing: -.4px;

    padding: 0 10px;
}

.logo-mark {
    width: 29px;
    height: 29px;

    display: grid;
    place-items: center;

    border-radius: 9px;
    background: linear-gradient(135deg, #4d9cff, #2867d9);

    font-size: 15px;
    font-weight: 900;
}

.top-spacer {
    flex: 1;
}

.top-button {
    width: 40px;
    height: 40px;

    border: 0;
    border-radius: 10px;

    background: transparent;

    display: grid;
    place-items: center;

    cursor: pointer;
}

.top-button:hover {
    background: rgba(255,255,255,.07);
}

/* =========================================================
   LEFT PANEL
   ========================================================= */

#side-panel {
    position: fixed;
    z-index: 1000;

    top: 78px;
    left: 12px;
    bottom: 118px;

    width: 310px;

    padding: 12px;

    overflow-y: auto;

    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow: 0 8px 30px rgba(0,0,0,.28);

    scrollbar-width: thin;
}

.panel-section {
    margin-bottom: 15px;
}

.panel-title {
    margin: 4px 5px 8px;

    color: var(--muted);

    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .7px;
}

.panel-row {
    display: flex;
    gap: 7px;
}

.panel-button {
    width: 100%;
    min-height: 43px;

    padding: 9px 11px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: var(--panel2);

    text-align: left;
    cursor: pointer;

    transition: background .15s, border-color .15s;
}

.panel-button:hover {
    background: rgba(255,255,255,.07);
}

.panel-button.active {
    border-color: rgba(77,156,255,.55);
    background: rgba(77,156,255,.13);
}

select {
    width: 100%;
    height: 43px;

    padding: 0 11px;

    border: 1px solid var(--border);
    border-radius: 10px;

    color: var(--text);
    background: var(--panel2);

    outline: none;
}

/* =========================================================
   RADAR LIST
   ========================================================= */

.radar-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.radar-item {
    display: flex;
    align-items: center;
    gap: 9px;

    min-height: 40px;

    padding: 7px 9px;

    border-radius: 9px;

    cursor: pointer;
}

.radar-item:hover {
    background: rgba(255,255,255,.06);
}

.radar-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #49a0ff;

    box-shadow: 0 0 8px rgba(73,160,255,.7);
}

.radar-name {
    flex: 1;

    font-size: 13px;
}

.radar-state {
    color: #7f8792;
    font-size: 11px;
}

/* =========================================================
   PRODUCT BUTTONS
   ========================================================= */

.products {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.product {
    min-height: 42px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: var(--panel2);

    cursor: pointer;

    font-size: 12px;
}

.product.active {
    border-color: rgba(77,156,255,.6);
    background: rgba(77,156,255,.14);
}

/* =========================================================
   MAP INFORMATION
   ========================================================= */

#point-info {
    position: fixed;
    z-index: 999;

    right: 14px;
    top: 78px;

    min-width: 185px;

    padding: 12px 14px;

    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow: 0 8px 30px rgba(0,0,0,.25);

    pointer-events: none;
}

.info-title {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
}

.info-value {
    font-size: 15px;
    font-weight: 700;
}

/* =========================================================
   LEGEND
   ========================================================= */

#legend {
    position: fixed;
    z-index: 1000;

    right: 14px;
    bottom: 118px;

    width: 285px;

    padding: 11px 12px;

    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow: 0 8px 30px rgba(0,0,0,.25);
}

.legend-title {
    margin-bottom: 7px;

    color: var(--muted);

    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.legend-bar {
    width: 100%;
    height: 14px;

    border-radius: 4px;

    background:
        linear-gradient(
            90deg,
            #646464 0%,
            #2447ff 12%,
            #00aaff 25%,
            #00e600 38%,
            #ffff00 50%,
            #ffb000 63%,
            #ff5400 76%,
            #ff0000 88%,
            #ff00ff 100%
        );
}

.legend-labels {
    display: flex;
    justify-content: space-between;

    margin-top: 5px;

    color: #b4bac4;
    font-size: 10px;
}

/* =========================================================
   TIMELINE
   ========================================================= */

#timeline {
    position: fixed;
    z-index: 1000;

    left: 12px;
    right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));

    min-height: 91px;

    padding: 10px 13px;

    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow: 0 8px 30px rgba(0,0,0,.3);
}

.timeline-top {
    display: flex;
    align-items: center;

    margin-bottom: 5px;
}

.timeline-time {
    font-size: 12px;
    font-weight: 700;
}

.timeline-status {
    margin-left: 8px;

    color: var(--muted);
    font-size: 11px;
}

.timeline-controls {
    display: flex;
    align-items: center;
    gap: 6px;

    margin-left: auto;
}

.time-button {
    width: 33px;
    height: 30px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--panel2);

    cursor: pointer;
}

.time-button:hover {
    background: rgba(255,255,255,.08);
}

#time-range {
    width: 100%;
    margin: 0;

    accent-color: var(--accent);
}

.frame-labels {
    display: flex;
    justify-content: space-between;

    color: var(--muted);
    font-size: 9px;

    margin-top: 2px;
}

/* =========================================================
   MOBILE MENU BUTTON
   ========================================================= */

#mobile-menu {
    display: none;
}

/* =========================================================
   SETTINGS DRAWER
   ========================================================= */

#settings {
    position: fixed;
    z-index: 1100;

    top: 78px;
    right: 12px;

    width: 300px;

    padding: 15px;

    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow: 0 12px 40px rgba(0,0,0,.4);

    display: none;
}

#settings.open {
    display: block;
}

.settings-title {
    font-size: 16px;
    font-weight: 800;

    margin-bottom: 14px;
}

.setting {
    margin-bottom: 14px;
}

.setting-name {
    display: block;

    margin-bottom: 6px;

    color: var(--muted);
    font-size: 12px;
}

.range-line {
    display: flex;
    align-items: center;
    gap: 9px;
}

.range-line input {
    flex: 1;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    #topbar {
        left: 8px;
        right: 8px;

        top: max(8px, env(safe-area-inset-top));

        height: 50px;
    }

    .logo {
        padding: 0 5px;
        font-size: 17px;
    }

    .logo-mark {
        width: 27px;
        height: 27px;
    }

    #mobile-menu {
        display: grid;
    }

    #side-panel {
        top: 66px;
        left: 8px;

        bottom: 112px;

        width: min(320px, calc(100vw - 16px));

        transform: translateX(-110%);
        transition: transform .2s ease;

        z-index: 1200;
    }

    #side-panel.open {
        transform: translateX(0);
    }

    #point-info {
        top: 66px;
        right: 8px;

        min-width: 150px;

        padding: 9px 11px;
    }

    #legend {
        left: 8px;
        right: 8px;

        bottom: 108px;

        width: auto;

        padding: 8px 10px;
    }

    #timeline {
        left: 8px;
        right: 8px;

        bottom: max(8px, env(safe-area-inset-bottom));

        min-height: 82px;

        padding: 8px 10px;
    }

    .timeline-time {
        font-size: 11px;
    }

    .time-button {
        width: 36px;
        height: 34px;
    }

    #settings {
        top: 66px;
        left: 8px;
        right: 8px;

        width: auto;
    }

    .leaflet-control-zoom {
        margin-top: 62px !important;
    }
}

/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 390px) {

    .logo {
        font-size: 15px;
    }

    #point-info {
        display: none;
    }

    .legend-labels {
        font-size: 8px;
    }

    .products {
        grid-template-columns: 1fr;
    }
}

/* =========================================================
   DARK LEAFLET CONTROLS
   ========================================================= */

.leaflet-control-zoom a {
    background: #1b1f26 !important;
    color: white !important;
    border-color: rgba(255,255,255,.08) !important;
}

.leaflet-control-zoom a:hover {
    background: #272d36 !important;
}

/* =========================================================
   RADAR PLACEHOLDER MESSAGE
   ========================================================= */

#radar-status {
    position: fixed;
    z-index: 998;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    padding: 13px 18px;

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;

    background: rgba(15,17,21,.9);

    color: #aab1bc;

    font-size: 12px;

    pointer-events: none;

    backdrop-filter: blur(12px);
}

/* =========================================================
   MOBILE OVERLAY
   ========================================================= */

#mobile-overlay {
    position: fixed;
    z-index: 1100;

    inset: 0;

    background: rgba(0,0,0,.45);

    display: none;
}

#mobile-overlay.active {
    display: block;
}

@media (min-width: 701px) {
    #mobile-overlay {
        display: none !important;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     MAP
     ======================================================= -->

<div id="map"></div>


<!-- =======================================================
     TOP BAR
     ======================================================= -->

<header id="topbar">

    <button
        id="mobile-menu"
        class="top-button"
        aria-label="Меню">
        ☰
    </button>

    <div class="logo">
        <div class="logo-mark">D</div>
        <span>Daradar</span>
    </div>

    <div class="top-spacer"></div>

    <button
        id="settings-button"
        class="top-button"
        aria-label="Настройки">
        ⚙
    </button>

</header>


<!-- =======================================================
     MOBILE OVERLAY
     ======================================================= -->

<div id="mobile-overlay"></div>


<!-- =======================================================
     SIDE PANEL
     ======================================================= -->

<aside id="side-panel">

    <section class="panel-section">

        <div class="panel-title">
            Сеть радаров
        </div>

        <select id="radar-select">
            <option value="network">
                Общая сеть
            </option>
            <option value="moscow">
                Москва
            </option>
            <option value="ufa">
                Уфа
            </option>
            <option value="kazan">
                Казань
            </option>
            <option value="novosibirsk">
                Новосибирск
            </option>
        </select>

    </section>


    <section class="panel-section">

        <div class="panel-title">
            ДМРЛ
        </div>

        <div class="radar-list">

            <div class="radar-item">
                <span class="radar-dot"></span>
                <span class="radar-name">
                    Общая сеть
                </span>
                <span class="radar-state">
                    —
                </span>
            </div>

            <div class="radar-item">
                <span class="radar-dot"></span>
                <span class="radar-name">
                    Москва
                </span>
                <span class="radar-state">
                    —
                </span>
            </div>

            <div class="radar-item">
                <span class="radar-dot"></span>
                <span class="radar-name">
                    Уфа
                </span>
                <span class="radar-state">
                    —
                </span>
            </div>

            <div class="radar-item">
                <span class="radar-dot"></span>
                <span class="radar-name">
                    Казань
                </span>
                <span class="radar-state">
                    —
                </span>
            </div>

            <div class="radar-item">
                <span class="radar-dot"></span>
                <span class="radar-name">
                    Новосибирск
                </span>
                <span class="radar-state">
                    —
                </span>
            </div>

        </div>

    </section>


    <section class="panel-section">

        <div class="panel-title">
            Радиолокационный продукт
        </div>

        <div class="products">

            <button class="product active">
                Отражаемость
            </button>

            <button class="product">
                Скорость
            </button>

            <button class="product">
                Интенсивность
            </button>

            <button class="product">
                Высота ВГО
            </button>

        </div>

    </section>


    <section class="panel-section">

        <div class="panel-title">
            Дополнительно
        </div>

        <button class="panel-button" id="stations-button">
            ● Станции ДМРЛ
        </button>

        <button
            class="panel-button"
            id="coverage-button"
            style="margin-top:6px">
            ◯ Зоны обзора
        </button>

    </section>

</aside>


<!-- =======================================================
     POINT INFO
     ======================================================= -->

<div id="point-info">

    <div class="info-title">
        Координаты
    </div>

    <div
        class="info-value"
        id="coordinates">
        —
    </div>

    <div
        class="info-title"
        style="margin-top:9px">
        Отражаемость
    </div>

    <div
        class="info-value"
        id="dbz-value">
        —
    </div>

</div>


<!-- =======================================================
     RADAR STATUS
     ======================================================= -->

<div id="radar-status">
    Радиолокационный источник не подключён
</div>


<!-- =======================================================
     LEGEND
     ======================================================= -->

<div id="legend">

    <div class="legend-title">
        Отражаемость, dBZ
    </div>

    <div class="legend-bar"></div>

    <div class="legend-labels">
        <span>-30</span>
        <span>-10</span>
        <span>10</span>
        <span>30</span>
        <span>50</span>
        <span>70+</span>
    </div>

</div>


<!-- =======================================================
     TIMELINE
     ======================================================= -->

<div id="timeline">

    <div class="timeline-top">

        <div>
            <span
                class="timeline-time"
                id="time-label">
                Сейчас
            </span>

            <span
                class="timeline-status"
                id="frame-status">
                Нет данных
            </span>
        </div>

        <div class="timeline-controls">

            <button
                class="time-button"
                id="previous-frame">
                ‹
            </button>

            <button
                class="time-button"
                id="play-button">
                ▶
            </button>

            <button
                class="time-button"
                id="next-frame">
                ›
            </button>

        </div>

    </div>


    <input
        id="time-range"
        type="range"
        min="0"
        max="0"
        value="0"
        step="1"
    >

    <div class="frame-labels">

        <span>
            Архив
        </span>

        <span>
            Сейчас
        </span>

    </div>

</div>


<!-- =======================================================
     SETTINGS
     ======================================================= -->

<div id="settings">

    <div class="settings-title">
        Настройки
    </div>

    <div class="setting">

        <span class="setting-name">
            Прозрачность радара
        </span>

        <div class="range-line">

            <input
                id="opacity-range"
                type="range"
                min="0"
                max="100"
                value="70"
            >

            <span id="opacity-value">
                70%
            </span>

        </div>

    </div>


    <div class="setting">

        <button
            class="panel-button"
            id="dark-map-button">
            🌙 Тёмная карта
        </button>

    </div>


    <div class="setting">

        <button
            class="panel-button"
            id="labels-button">
            ● Метки ДМРЛ
        </button>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   DARADAR — CORE
   ========================================================= */

/* ---------------------------------------------------------
   MAP
   --------------------------------------------------------- */

const map = L.map("map", {
    zoomControl: true,
    attributionControl: true,
    preferCanvas: true
}).setView([55.7558, 37.6173], 4);


const baseLayer = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 18,
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
).addTo(map);


/* ---------------------------------------------------------
   UI ELEMENTS
   --------------------------------------------------------- */

const sidePanel =
    document.getElementById("side-panel");

const mobileMenu =
    document.getElementById("mobile-menu");

const mobileOverlay =
    document.getElementById("mobile-overlay");

const settings =
    document.getElementById("settings");

const settingsButton =
    document.getElementById("settings-button");


/* ---------------------------------------------------------
   MOBILE MENU
   --------------------------------------------------------- */

function openMobileMenu() {

    sidePanel.classList.add("open");

    mobileOverlay.classList.add("active");
}

function closeMobileMenu() {

    sidePanel.classList.remove("open");

    mobileOverlay.classList.remove("active");
}

mobileMenu.addEventListener(
    "click",
    openMobileMenu
);

mobileOverlay.addEventListener(
    "click",
    closeMobileMenu
);


/* ---------------------------------------------------------
   SETTINGS
   --------------------------------------------------------- */

settingsButton.addEventListener(
    "click",
    () => {
        settings.classList.toggle("open");
    }
);


/* ---------------------------------------------------------
   MAP COORDINATES
   --------------------------------------------------------- */

map.on("mousemove", event => {

    const lat =
        event.latlng.lat.toFixed(4);

    const lon =
        event.latlng.lng.toFixed(4);

    document.getElementById(
        "coordinates"
    ).textContent =
        `${lat}°, ${lon}°`;

});


map.on("click", event => {

    const lat =
        event.latlng.lat.toFixed(4);

    const lon =
        event.latlng.lng.toFixed(4);

    document.getElementById(
        "coordinates"
    ).textContent =
        `${lat}°, ${lon}°`;

});


/* ---------------------------------------------------------
   OPACITY
   --------------------------------------------------------- */

const opacityRange =
    document.getElementById("opacity-range");

const opacityValue =
    document.getElementById("opacity-value");

opacityRange.addEventListener(
    "input",
    () => {

        const value =
            opacityRange.value;

        opacityValue.textContent =
            value + "%";

        /*
         * Здесь позже будет:
         *
         * radarLayer.setOpacity(value / 100);
         */
    }
);


/* ---------------------------------------------------------
   PRODUCT SELECTION
   --------------------------------------------------------- */

document
    .querySelectorAll(".product")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".product")
                    .forEach(
                        item =>
                            item.classList.remove("active")
                    );

                button.classList.add("active");

                /*
                 * Здесь позже подключается:
                 *
                 * reflectivity
                 * velocity
                 * precipitation
                 * echo top
                 */
            }
        );

    });


/* ---------------------------------------------------------
   RADAR SELECT
   --------------------------------------------------------- */

document
    .getElementById("radar-select")
    .addEventListener(
        "change",
        event => {

            const radar =
                event.target.value;

            console.log(
                "Выбран радар:",
                radar
            );

        }
    );


/* ---------------------------------------------------------
   TIMELINE
   --------------------------------------------------------- */

const timeRange =
    document.getElementById("time-range");

const timeLabel =
    document.getElementById("time-label");

const frameStatus =
    document.getElementById("frame-status");

const previousFrame =
    document.getElementById("previous-frame");

const nextFrame =
    document.getElementById("next-frame");

const playButton =
    document.getElementById("play-button");


let playing = false;

let playTimer = null;


/* Пока кадров нет */

function updateTimeline() {

    const value =
        Number(timeRange.value);

    const max =
        Number(timeRange.max);

    if (max === 0) {

        timeLabel.textContent =
            "Сейчас";

        frameStatus.textContent =
            "Нет данных";

        return;
    }

    timeLabel.textContent =
        `Кадр ${value + 1}`;

    frameStatus.textContent =
        `${value + 1} / ${max + 1}`;
}


timeRange.addEventListener(
    "input",
    updateTimeline
);


/* ---------------------------------------------------------
   PREVIOUS FRAME
   --------------------------------------------------------- */

previousFrame.addEventListener(
    "click",
    () => {

        let value =
            Number(timeRange.value);

        if (value > 0) {
            value--;
        }

        timeRange.value =
            value;

        updateTimeline();

    }
);


/* ---------------------------------------------------------
   NEXT FRAME
   --------------------------------------------------------- */

nextFrame.addEventListener(
    "click",
    () => {

        let value =
            Number(timeRange.value);

        const max =
            Number(timeRange.max);

        if (value < max) {
            value++;
        }

        timeRange.value =
            value;

        updateTimeline();

    }
);


/* ---------------------------------------------------------
   PLAY
   --------------------------------------------------------- */

playButton.addEventListener(
    "click",
    () => {

        if (playing) {

            playing = false;

            clearInterval(playTimer);

            playButton.textContent =
                "▶";

            return;
        }


        playing = true;

        playButton.textContent =
            "Ⅱ";


        playTimer =
            setInterval(
                () => {

                    let value =
                        Number(timeRange.value);

                    const max =
                        Number(timeRange.max);


                    if (value >= max) {

                        value = 0;

                    } else {

                        value++;

                    }


                    timeRange.value =
                        value;

                    updateTimeline();

                },
                700
            );

    }
);


/* ---------------------------------------------------------
   STATIONS
   --------------------------------------------------------- */

let stationsVisible = true;

const stationLayer =
    L.layerGroup().addTo(map);


/*
 * Пока показываем только несколько
 * тестовых точек интерфейса.
 *
 * Это НЕ радиолокационные данные.
 * Позже сюда подключается настоящий
 * список ДМРЛ.
 */

const demoStations = [

    {
        name: "Москва",
        lat: 55.75,
        lon: 37.62
    },

    {
        name: "Уфа",
        lat: 54.74,
        lon: 55.97
    },

    {
        name: "Казань",
        lat: 55.79,
        lon: 49.12
    },

    {
        name: "Новосибирск",
        lat: 55.03,
        lon: 82.92
    }

];


demoStations.forEach(
    station => {

        const marker =
            L.circleMarker(
                [
                    station.lat,
                    station.lon
                ],
                {
                    radius: 5,
                    weight: 1,
                    color: "#ffffff",
                    fillColor: "#4d9cff",
                    fillOpacity: .9
                }
            );

        marker.bindTooltip(
            station.name
        );

        stationLayer.addLayer(
            marker
        );

    }
);


document
    .getElementById("stations-button")
    .addEventListener(
        "click",
        () => {

            stationsVisible =
                !stationsVisible;

            if (stationsVisible) {

                stationLayer.addTo(map);

            } else {

                map.removeLayer(
                    stationLayer
                );

            }

        }
    );

document
    .getElementById("dark-map-button")

/* ---------------------------------------------------------
   INITIAL STATE
   --------------------------------------------------------- */

updateTimeline();
