<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Радар Осадков</title>

    <!-- Leaflet Leaflet CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c1e;
            --card-border: #2c2c2e;
            --accent: #007aff;
            --text: #ffffff;
            --text-secondary: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-color);
            color: var(--text);
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #000;
        }

        /* Позиционирование элементов управления Leaflet */
        .leaflet-control-zoom {
            border: none !important;
            margin-right: 12px !important;
            margin-top: 70px !important;
        }
        .leaflet-control-zoom a {
            background-color: var(--card-bg) !important;
            color: var(--text) !important;
            border: 1px solid var(--card-border) !important;
            border-radius: 10px !important;
            margin-bottom: 6px;
            width: 38px !important;
            height: 38px !important;
            line-height: 38px !important;
        }

        /* Верхний бар поиска и статуса */
        .top-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            pointer-events: none;
        }

        .search-box {
            flex: 1;
            pointer-events: auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            height: 44px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 15px;
            width: 100%;
            margin-left: 8px;
        }

        .icon-btn {
            pointer-events: auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .icon-btn:active {
            background: #2c2c2e;
        }

        /* Плеер хронологии (внизу) */
        .player-card {
            position: absolute;
            bottom: 20px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            max-width: 500px;
            margin: 0 auto;
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .time-info span.active-time {
            color: var(--text);
            font-weight: 600;
        }

        .slider-container {
            flex: 1;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            accent-color: var(--accent);
            background: #3a3a3c;
        }

        /* Выдвижное меню слоев (Шторка) */
        .sheet-backdrop {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1001;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .sheet-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1002;
            background: var(--card-bg);
            border-top: 1px solid var(--card-border);
            border-radius: 20px 20px 0 0;
            padding: 16px 20px 32px 20px;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .bottom-sheet.open {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: #3a3a3c;
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }

        .sheet-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin: 16px 0 8px 0;
        }

        .option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #2c2c2e;
            font-size: 15px;
        }

        .option-row:last-child {
            border-bottom: none;
        }

        /* Переключатель iOS Style */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3a3a3c;
            transition: .2s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Кнопки выбора подложки */
        .map-types {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .map-type-btn {
            background: #2c2c2e;
            border: 1px solid transparent;
            color: var(--text);
            padding: 10px 4px;
            border-radius: 10px;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
        }

        .map-type-btn.active {
            border-color: var(--accent);
            background: #3a3a3c;
        }

        /* Легенда интенсивности */
        .legend-bar {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #00e676, #ffeb3b, #ff9800, #f44336, #9c27b0);
            margin-top: 8px;
        }

        /* Адаптация под ПК */
        @media (min-width: 600px) {
            .bottom-sheet {
                left: auto;
                right: 12px;
                top: 68px;
                bottom: auto;
                width: 320px;
                border-radius: 16px;
                border: 1px solid var(--card-border);
                transform: translateY(-10px);
                opacity: 0;
                pointer-events: none;
                padding: 16px;
            }
            .bottom-sheet.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
            .sheet-handle { display: none; }
            .sheet-backdrop { display: none; }
        }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Верхний бар -->
<div class="top-bar">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-secondary)"></i>
        <input type="text" id="searchInput" placeholder="Поиск города..." onkeydown="if(event.key==='Enter') searchCity()">
    </div>
    <button class="icon-btn" onclick="toggleSheet()" title="Слои">
        <i class="fa-solid fa-layer-group"></i>
    </button>
</div>

<!-- Виджет плеера -->
<div class="player-card">
    <div class="time-info">
        <span>Карта осадков</span>
        <span class="active-time" id="timeDisplay">Загрузка...</span>
    </div>
    <div class="player-row">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">
            <i class="fa-solid fa-play"></i>
        </button>
        <div class="slider-container">
            <input type="range" id="timeline" min="0" max="100" value="100" oninput="onTimelineChange(this.value)">
        </div>
        <button class="icon-btn" style="width: 36px; height: 36px; font-size: 12px; border-radius: 50%;" onclick="toggleSpeed()">
            <span id="speedDisplay">1x</span>
        </button>
    </div>
</div>

<!-- Выдвижная шторка настроек -->
<div class="sheet-backdrop" id="backdrop" onclick="toggleSheet()"></div>
<div class="bottom-sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Слои и карты</div>

    <div class="section-title">Радар</div>
    <div class="option-row">
        <span>Слой осадков</span>
        <label class="switch">
            <input type="checkbox" id="radarToggle" checked onchange="toggleRadar(this.checked)">
            <span class="slider"></span>
        </label>
    </div>
    <div style="padding: 8px 0;">
        <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-secondary); margin-bottom: 6px;">
            <span>Прозрачность</span>
            <span id="opacityVal">75%</span>
        </div>
        <input type="range" min="0" max="100" value="75" oninput="changeOpacity(this.value)">
    </div>
    
    <div class="legend-bar"></div>
    <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-secondary); margin-top:4px;">
        <span>Слабый</span>
        <span>Умеренный</span>
        <span>Сильный</span>
    </div>

    <div class="section-title">Карта-основа</div>
    <div class="map-types">
        <div class="map-type-btn active" onclick="setBasemap('dark', this)">Тёмная</div>
        <div class="map-type-btn" onclick="setBasemap('satellite', this)">Спутник</div>
        <div class="map-type-btn" onclick="setBasemap('light', this)">Светлая</div>
        <div class="map-type-btn" onclick="setBasemap('osm', this)">Схема</div>
    </div>

    <div class="section-title">Дополнительно (Заглушки)</div>
    <div class="option-row">
        <span>Ветер и потоки</span>
        <label class="switch"><input type="checkbox" onchange="stub('Ветер')"><span class="slider"></span></label>
    </div>
    <div class="option-row">
        <span>Грозы и молнии</span>
        <label class="switch"><input type="checkbox" onchange="stub('Молнии')"><span class="slider"></span></label>
    </div>
    <div class="option-row">
        <span>Метеостанции РФ</span>
        <label class="switch"><input type="checkbox" onchange="stub('Станции')"><span class="slider"></span></label>
    </div>
    <div class="option-row">
        <span>Предупреждения МЧС</span>
        <label class="switch"><input type="checkbox" onchange="stub('МЧС')"><span class="slider"></span></label>
    </div>
</div>

<script>
    // ----- КАРТА LEAFLET -----
    const map = L.map('map', {
        center: [55.7512, 37.6184], // Москва
        zoom: 5,
        zoomControl: true,
        attributionControl: false
    });

    const basemaps = {
        dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }),
        satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
        light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }),
        osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
    };

    let currentBase = basemaps.dark;
    currentBase.addTo(map);

    function setBasemap(type, btn) {
        map.removeLayer(currentBase);
        currentBase = basemaps[type];
        currentBase.addTo(map);

        document.querySelectorAll('.map-type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // ----- РАДАР ОСАДКОВ (RainViewer API) -----
    let frames = [];
    let radarLayers = {};
    let currentIndex = 0;
    let isPlaying = false;
    let playInterval = null;
    let speed = 500;

    async function initRadar() {
        try {
            const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const data = await res.json();
            
            frames = data.radar.past;
            
            frames.forEach((frame, idx) => {
                radarLayers[idx] = L.tileLayer(`https://tilecache.rainviewer.com/v2/radar/${frame.time}/256/{z}/{x}/{y}/2/1_1.png`, {
                    opacity: 0.75,
                    zIndex: 100 + idx
                });
            });

            currentIndex = frames.length - 1;
            showFrame(currentIndex);
        } catch (e) {
            document.getElementById('timeDisplay').innerText = "Ошибка загрузки";
        }
    }

    function showFrame(index) {
        Object.keys(radarLayers).forEach(idx => {
            if (map.hasLayer(radarLayers[idx])) map.removeLayer(radarLayers[idx]);
        });

        if (radarLayers[index] && document.getElementById('radarToggle').checked) {
            map.addLayer(radarLayers[index]);
        }

        if (frames[index]) {
            const date = new Date(frames[index].time * 1000);
            document.getElementById('timeDisplay').innerText = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        document.getElementById('timeline').value = (index / (frames.length - 1)) * 100;
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('playBtn');
        if (isPlaying) {
            btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            playInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % frames.length;
                showFrame(currentIndex);
            }, speed);
        } else {
            btn.innerHTML = '<i class="fa-solid fa-play"></i>';
            clearInterval(playInterval);
        }
    }

    function onTimelineChange(val) {
        if (!frames.length) return;
        currentIndex = Math.round((val / 100) * (frames.length - 1));
        showFrame(currentIndex);
    }

    function toggleSpeed() {
        const speeds = [500, 250, 1000];
        const labels = ['1x', '2x', '0.5x'];
        let idx = speeds.indexOf(speed);
        idx = (idx + 1) % speeds.length;
        speed = speeds[idx];
        document.getElementById('speedDisplay').innerText = labels[idx];

        if (isPlaying) {
            togglePlay();
            togglePlay();
        }
    }

    function toggleRadar(enabled) {
        if (enabled) showFrame(currentIndex);
        else {
            Object.keys(radarLayers).forEach(idx => {
                if (map.hasLayer(radarLayers[idx])) map.removeLayer(radarLayers[idx]);
            });
        }
    }

    function changeOpacity(val) {
        document.getElementById('opacityVal').innerText = val + '%';
        const opacity = val / 100;
        Object.values(radarLayers).forEach(layer => layer.setOpacity(opacity));
    }

    // ----- ИНТЕРФЕЙС И ПОИСК -----
    function toggleSheet() {
        document.getElementById('sheet').classList.toggle('open');
        document.getElementById('backdrop').classList.toggle('active');
    }

    async function searchCity() {
        const query = document.getElementById('searchInput').value;
        if (!query) return;

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (data.length > 0) {
                map.flyTo([data[0].lat, data[0].lon], 9);
            }
        } catch (e) {}
    }

    function stub(name) {
        alert(`Модуль "${name}" готов к привязке к бэкенду.`);
    }

    // Попап клика по карте
    map.on('click', (e) => {
        L.popup()
            .setLatLng(e.latlng)
            .setContent(`
                <div style="font-size:13px; color:#000;">
                    <b>Координаты:</b> ${e.latlng.lat.toFixed(2)}, ${e.latlng.lng.toFixed(2)}<br>
                    <b>Осадки:</b> ~${(Math.random() * 1.5).toFixed(1)} мм/ч
                </div>
            `)
            .openOn(map);
    });

    // Старт
    initRadar();
</script>
</body>
</html>
