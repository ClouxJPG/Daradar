<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АСУ-ДМРЛ ВОИ — Оригинальный кадр ДМРЛ</title>
  <style>
    :root {
      --win-bg: #d4d0c8;
      --win-panel: #ece9d8;
      --win-border-dark: #716f64;
      --win-border-shadow: #808080;
      --win-border-light: #ffffff;
      --win-blue: #000080;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Tahoma", "Segoe UI", Geneva, sans-serif;
      font-size: 11px;
      user-select: none;
    }

    body {
      background-color: var(--win-bg);
      color: #000;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Верхняя панель */
    .top-bar {
      display: flex;
      align-items: center;
      background: var(--win-panel);
      border-bottom: 2px solid var(--win-border-dark);
      padding: 2px 4px;
      gap: 6px;
      height: 28px;
      flex-shrink: 0;
      overflow-x: auto;
      white-space: nowrap;
    }

    .toolbar-grid-nums {
      display: flex;
      border: 1px solid var(--win-border-shadow);
      background: #fff;
    }

    .toolbar-grid-nums span {
      padding: 1px 3px;
      border-right: 1px solid #d4d0c8;
      font-size: 10px;
    }

    .menu-title { font-weight: bold; font-size: 11px; }

    .btn-win {
      background: var(--win-panel);
      border: 1px solid #000;
      box-shadow: inset 1px 1px var(--win-border-light), inset -1px -1px var(--win-border-shadow);
      padding: 2px 6px;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }
    .btn-win:active, .btn-win.active {
      box-shadow: inset 1px 1px var(--win-border-shadow), inset -1px -1px var(--win-border-light);
      background: #c0c0c0;
    }

    .status-badge {
      background: #008080;
      color: #fff;
      padding: 2px 6px;
      font-weight: bold;
      font-family: monospace;
      font-size: 11px;
      margin-left: auto;
    }

    /* Главный контейнер */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Область карты с оригинальным снимком */
    .map-container {
      flex: 1;
      position: relative;
      background: #c0c0c0;
      border: 2px inset var(--win-border-light);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
    }

    #radarImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Правая панель управления */
    .sidebar {
      width: 220px;
      background: var(--win-panel);
      border-left: 2px solid var(--win-border-light);
      box-shadow: -1px 0 var(--win-border-dark);
      display: flex;
      flex-direction: column;
      padding: 4px;
      gap: 5px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .info-box {
      border: 1px solid var(--win-border-shadow);
      background: #fff;
      padding: 4px;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.3;
      box-shadow: inset 1px 1px var(--win-border-shadow);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .file-list {
      border: 1px solid var(--win-border-shadow);
      background: #fff;
      height: 140px;
      overflow-y: scroll;
      font-family: monospace;
      font-size: 10px;
      box-shadow: inset 1px 1px var(--win-border-shadow);
    }

    .file-item {
      padding: 1px 3px;
      cursor: pointer;
      white-space: nowrap;
    }
    .file-item:hover { background: #e0e0ff; }
    .file-item.active {
      background: var(--win-blue);
      color: #fff;
    }

    .header-tag {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      border-bottom: 1px solid var(--win-border-shadow);
      padding-bottom: 1px;
    }

    /* Легенда цветов */
    .legend-box {
      border: 1px solid var(--win-border-shadow);
      background: #fff;
      flex: 1;
      min-height: 160px;
      overflow-y: auto;
      padding: 2px;
      box-shadow: inset 1px 1px var(--win-border-shadow);
    }

    .legend-title {
      font-weight: bold;
      background: var(--win-bg);
      padding: 1px 3px;
      margin-bottom: 2px;
      border: 1px solid var(--win-border-shadow);
      text-align: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      height: 13px;
    }

    .color-swatch {
      width: 12px;
      height: 10px;
      border: 1px solid #000;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .map-container { height: 60vh; flex: none; }
      .sidebar { width: 100%; height: 40vh; border-left: none; border-top: 2px solid var(--win-border-light); }
    }
  </style>
</head>
<body>

  <!-- Верхнее меню -->
  <div class="top-bar">
    <div class="toolbar-grid-nums">
      <span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
      <span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span>
    </div>
    <div class="menu-title">Метеоявления</div>
    <div>ПГ: теплый</div>
    <button class="btn-win">Опасные явления</button>
    <div class="status-badge">V=14.79 м/с az=29 СВ</div>
  </div>

  <!-- Главное окно -->
  <div class="main-container">
    
    <!-- Карта с оригинальным эхо-снимком ДМРЛ -->
    <div class="map-container" id="mapBox">
      <img src="https://i.postimg.co/Jz5T5X5b/radar-map.jpg" id="radarImage" alt="Карта ДМРЛ">
      <canvas id="overlayCanvas"></canvas>
    </div>

    <!-- Правая панель АСУ-ДМРЛ -->
    <div class="sidebar">
      
      <div class="info-box">
        <div>Az: <span id="valAz">307.48</span>°</div>
        <div>R:  <span id="valR">127.54</span> км</div>
        <div style="color: #808080;">Значение:</div>
        <div id="valPhenomenon" style="font-weight: bold; color: #a00000;">Гроза (R)</div>
      </div>

      <div class="controls-row">
        <button class="btn-win" id="btnLoop">🎦</button>
        <button class="btn-win" id="btnPlay">▶</button>
        <strong style="margin-left: auto;">15.06.2022</strong>
      </div>

      <div style="text-align: right; font-weight: bold; font-family: monospace; font-size: 12px;" id="currentTime">
        10:30:00
      </div>

      <div class="header-tag">
        <span>ДМРЛ</span>
        <span>nr</span>
      </div>

      <div class="file-list" id="fileList"></div>

      <div class="legend-box" id="legendBox"></div>

    </div>
  </div>

  <script>
    const mapBox = document.getElementById('mapBox');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');

    let cursorX = 0;
    let cursorY = 0;

    function resizeCanvas() {
      canvas.width = mapBox.clientWidth;
      canvas.height = mapBox.clientHeight;
      drawCrosshair();
    }

    function drawCrosshair() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (cursorX === 0 && cursorY === 0) return;

      ctx.strokeStyle = "#000";
      ctx.lineWidth = 1;

      // Рамка визира
      ctx.strokeRect(cursorX - 12, cursorY - 12, 24, 24);
      ctx.strokeRect(cursorX - 22, cursorY - 22, 44, 44);

      // Вектор скорости
      ctx.beginPath();
      ctx.moveTo(cursorX, cursorY);
      ctx.lineTo(cursorX + 70, cursorY - 110);
      ctx.stroke();
    }

    mapBox.addEventListener('click', function(e) {
      const rect = canvas.getBoundingClientRect();
      cursorX = e.clientX - rect.left;
      cursorY = e.clientY - rect.top;

      // Расчет относительных координат
      const az = ((cursorX / canvas.width) * 360).toFixed(2);
      const r = ((cursorY / canvas.height) * 250).toFixed(2);

      document.getElementById('valAz').innerText = az;
      document.getElementById('valR').innerText = r;

      drawCrosshair();
    });

    // Список файлов снимков
    const fileList = document.getElementById('fileList');
    const times = ["09:40","09:50","10:00","10:10","10:20","10:30","10:40","10:50","11:00","11:10","11:20","11:30"];
    
    times.forEach(t => {
      const div = document.createElement('div');
      div.className = 'file-item' + (t === "10:30" ? ' active' : '');
      div.innerText = `20220615_${t.replace(':','')}_1.Inr`;
      div.onclick = () => {
        document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
        div.classList.add('active');
        document.getElementById('currentTime').innerText = t + ":00";
      };
      fileList.appendChild(div);
    });

    // Отрисовка легенды
    function renderLegend() {
      const legendBox = document.getElementById('legendBox');
      const items = [
        { name: "Обл.в.ср.ярус", color: "#00c0c0" },
        { name: "Сп.образн.", color: "#00a000" },
        { name: "Осадки слабы", color: "#00e000" },
        { name: "Осадки умерен", color: "#00ff00" },
        { name: "Осадки сильн", color: "#ffff00" },
        { name: "Кучевая обл.", color: "#ff8000" },
        { name: "Ливень слабы", color: "#0000ff" },
        { name: "Ливень умерен", color: "#0000a0" },
        { name: "Ливень сильн", color: "#808080" },
        { name: "Гроза (R)", color: "#ff0000" },
        { name: "Гроза R)", color: "#a00000" },
        { name: "Гроза R", color: "#ff8080" },
        { name: "Град слабый", color: "#804000" },
        { name: "Град умеренн", color: "#800000" },
        { name: "Град сильный", color: "#400000" },
        { name: "Шквал слабый", color: "#808080" },
        { name: "Шквал умерен", color: "#404040" },
        { name: "Шквал сильный", color: "#000000" }
      ];

      let html = `<div class="legend-title">Метеоявления</div>`;
      items.forEach(item => {
        html += `
          <div class="legend-item">
            <div class="color-swatch" style="background:${item.color};"></div>
            <span>${item.name}</span>
          </div>
        `;
      });
      legendBox.innerHTML = html;
    }

    window.addEventListener('resize', resizeCanvas);
    renderLegend();
    setTimeout(resizeCanvas, 100);
  </script>
</body>
</html>
