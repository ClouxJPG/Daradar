<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий Радар на Leaflet</title>
    
    <!-- Скрипты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        /* Главное исправление: даем карте четкие размеры, чтобы она не была нулевой */
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
        }
        .radar-control {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 5px;
            font-family: sans-serif;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="radar-control">
        <h4 style="margin:0 0 5px 0;">Данные ДМРЛ-С</h4>
        <div id="timestamp">Загрузка времени...</div>
    </div>

    <script>
        // Инициализируем карту, центрируем на Москву/Европейскую часть РФ
        const map = L.map('map').setView([55.7558, 37.6173], 5);

        // Добавляем бесплатную красивую подложку
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Получаем свежие данные ДМРЛ через глобальный метео-агрегатор RainViewer
        // Он забирает сырой поток у Росгидромета, но перепроецирует в удобный формат
        fetch('https://rainviewer.com')
            .then(res => res.json())
            .then(data => {
                // Берем самый последний доступный снимок из архива (крайний в массиве radar.past)
                const lastRadar = data.radar.past[data.radar.past.length - 1];
                
                // Выводим время снимка в интерфейс
                const radarTime = new Date(lastRadar.time * 1000).toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
                document.getElementById('timestamp').innerHTML = `<b>Осадки на:</b> ${radarTime}`;

                // Добавляем радарный слой на карту Leaflet
                L.tileLayer(`https://rainviewer.com${lastRadar.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                    tileSize: 256,
                    opacity: 0.65,
                    transparent: true,
                    attribution: 'Росгидромет / RainViewer'
                }).addTo(map);
            })
            .catch(err => {
                console.error("Ошибка обновления радара:", err);
                document.getElementById('timestamp').innerText = "Ошибка сети";
            });
    </script>
</body>
</html>
