<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>CLOrad — Radar Russia</title>

<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
/* =========================================================
   CLOrad — Radar Russia
   Mobile-first radar interface
   ========================================================= */

:root {
    --bg: #071019;
    --panel: rgba(11, 20, 31, .88);
    --panel2: rgba(17, 29, 43, .94);
    --line: rgba(255,255,255,.09);
    --text: #f4f7fb;
    --muted: #8e9baa;
    --accent: #4da3ff;
    --accent2: #72c8ff;
    --danger: #ff4968;
    --good: #44d49a;
    --shadow: 0 16px 50px rgba(0,0,0,.38);
    --radius: 18px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    color: inherit;
}

/* =========================================================
   MAP
   ========================================================= */

#map {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: #08111b;
}

.leaflet-control-attribution {
    display: none !important;
}

.leaflet-control-zoom {
    display: none;
}

.leaflet-tile {
    transition:
        opacity .22s ease,
        filter .22s ease;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
    position: fixed;
    z-index: 1000;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;

    height: 66px;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 9px 12px;

    pointer-events: none;
}

.topbar > * {
    pointer-events: auto;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 8px 13px;

    background: rgba(8,17,27,.84);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    border: 1px solid var(--line);
    border-radius: 15px;

    box-shadow: var(--shadow);
}

.logo {
    width: 34px;
    height: 34px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background:
        radial-gradient(circle at 35% 35%, #9bdeff, #2788ef 42%, #1454a2);

    box-shadow:
        0 0 25px rgba(64,158,255,.38),
        inset 0 1px 0 rgba(255,255,255,.4);
}

.logo span {
    font-size: 17px;
    font-weight: 900;
}

.brand-name {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -.3px;
}

.brand-status {
    display: flex;
    align-items: center;
    gap: 5px;

    margin-top: 1px;

    color: var(--muted);
    font-size: 10px;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 9px var(--good);
}

.top-actions {
    margin-left: auto;

    display: flex;
    gap: 7px;
}

.icon-btn {
    width: 42px;
    height: 42px;

    display: grid;
    place-items: center;

    border-radius: 14px;

    background: rgba(8,17,27,.84);
    border: 1px solid var(--line);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow: var(--shadow);

    font-size: 18px;

    transition:
        transform .22s cubic-bezier(.2,.8,.2,1),
        background .22s ease;
}

.icon-btn:active {
    transform: scale(.91);
}

/* =========================================================
   RIGHT MAP TOOLS
   ========================================================= */

.map-tools {
    position: fixed;
    z-index: 900;

    right: 12px;
    top: 84px;

    display: flex;
    flex-direction: column;
    gap: 8px;
}

.map-tool {
    width: 43px;
    height: 43px;

    display: grid;
    place-items: center;

    border-radius: 14px;

    background: rgba(8,17,27,.82);
    border: 1px solid var(--line);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow: var(--shadow);

    transition: transform .2s ease;
}

.map-tool:active {
    transform: scale(.9);
}

/* =========================================================
   SOURCE PILL
   ========================================================= */

.source-pill {
    position: fixed;
    z-index: 950;

    left: 12px;
    top: 82px;

    padding: 8px 12px;

    border-radius: 999px;

    background: rgba(8,17,27,.78);
    border: 1px solid var(--line);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow: var(--shadow);

    font-size: 11px;
    font-weight: 700;

    color: #dce8f5;
}

/* =========================================================
   BOTTOM CONTROL PANEL
   ========================================================= */

.bottom-panel {
    position: fixed;
    z-index: 1000;

    left: 10px;
    right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));

    border-radius: 23px;

    background: var(--panel);
    border: 1px solid var(--line);

    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);

    box-shadow: var(--shadow);

    overflow: hidden;

    transition:
        transform .45s cubic-bezier(.22,1,.36,1),
        opacity .3s ease;
}

.panel-head {
    display: flex;
    align-items: center;

    padding: 12px 13px 8px;

    gap: 9px;
}

.dragger {
    position: absolute;

    top: 7px;
    left: 50%;

    width: 38px;
    height: 4px;

    transform: translateX(-50%);

    border-radius: 99px;
    background: rgba(255,255,255,.17);
}

.frame-info {
    flex: 1;
}

.frame-title {
    font-size: 12px;
    color: var(--muted);
}

.frame-time {
    margin-top: 2px;

    font-size: 17px;
    font-weight: 800;
    letter-spacing: -.4px;
}

.live-badge {
    padding: 5px 8px;

    border-radius: 8px;

    background: rgba(68,212,154,.12);
    color: #70e1b3;

    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
}

/* =========================================================
   TIMELINE
   ========================================================= */

.timeline-wrap {
    padding: 3px 13px 10px;
}

.timeline {
    width: 100%;
    height: 5px;

    appearance: none;
    -webkit-appearance: none;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            var(--accent) 0%,
            var(--accent) var(--progress, 0%),
            rgba(255,255,255,.11) var(--progress, 0%),
            rgba(255,255,255,.11) 100%
        );

    outline: none;
}

.timeline::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 17px;
    height: 17px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 0 4px rgba(77,163,255,.2),
        0 2px 9px rgba(0,0,0,.35);
}

.timeline::-moz-range-thumb {
    width: 17px;
    height: 17px;

    border: 0;
    border-radius: 50%;

    background: white;
}

/* =========================================================
   CONTROL ROW
   ========================================================= */

.controls {
    display: flex;
    align-items: center;

    gap: 7px;

    padding: 0 13px 12px;
}

.play {
    width: 45px;
    height: 45px;

    flex: 0 0 auto;

    display: grid;
    place-items: center;

    border-radius: 14px;

    background: var(--accent);

    box-shadow:
        0 7px 20px rgba(77,163,255,.24);

    font-size: 18px;

    transition:
        transform .2s ease,
        filter .2s ease;
}

.play:active {
    transform: scale(.91);
}

.control {
    min-width: 0;
    flex: 1;

    height: 45px;

    padding: 0 12px;

    border-radius: 14px;

    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.055);

    text-align: left;

    transition: background .2s ease;
}

.control strong {
    display: block;

    font-size: 11px;
}

.control span {
    display: block;

    margin-top: 2px;

    color: var(--muted);

    font-size: 9px;
}

/* =========================================================
   SIDE SHEET
   ========================================================= */

.sheet {
    position: fixed;
    z-index: 1500;

    top: 0;
    right: 0;
    bottom: 0;

    width: min(410px, 92vw);

    padding:
        calc(18px + env(safe-area-inset-top, 0px))
        14px
        calc(18px + env(safe-area-inset-bottom, 0px));

    background: rgba(7,15,24,.96);

    border-left: 1px solid var(--line);

    box-shadow: -20px 0 70px rgba(0,0,0,.45);

    transform: translateX(105%);

    transition:
        transform .48s cubic-bezier(.22,1,.36,1);
}

.sheet.open {
    transform: translateX(0);
}

.sheet-title {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;

    font-size: 20px;
    font-weight: 850;
}

.close {
    width: 40px;
    height: 40px;

    border-radius: 13px;

    background: rgba(255,255,255,.06);
}

.section {
    margin-bottom: 18px;
}

.section-label {
    margin-bottom: 8px;

    color: var(--muted);

    font-size: 10px;
    font-weight: 800;
    letter-spacing: .7px;
    text-transform: uppercase;
}

.source-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.source {
    padding: 13px;

    border-radius: 15px;

    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.06);

    text-align: left;

    transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;
}

.source.active {
    background: rgba(77,163,255,.13);
    border-color: rgba(77,163,255,.42);
}

.source:active {
    transform: scale(.97);
}

.source-name {
    font-size: 12px;
    font-weight: 800;
}

.source-desc {
    margin-top: 4px;

    color: var(--muted);

    font-size: 9px;
    line-height: 1.35;
}

.layer-list {
    display: grid;
    gap: 7px;
}

.layer {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 11px;

    border-radius: 14px;

    background: rgba(255,255,255,.045);
}

.layer input {
    width: 18px;
    height: 18px;

    accent-color: var(--accent);
}

.layer-text {
    flex: 1;
}

.layer-title {
    font-size: 12px;
    font-weight: 700;
}

.layer-sub {
    color: var(--muted);
    font-size: 9px;
    margin-top: 2px;
}

/* =========================================================
   INFO CARD
   ========================================================= */

.point-card {
    position: fixed;
    z-index: 1400;

    left: 12px;
    right: 12px;

    top: 50%;

    max-width: 360px;

    margin: auto;

    padding: 15px;

    border-radius: 19px;

    background: rgba(8,17,27,.94);
    border: 1px solid var(--line);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    box-shadow: var(--shadow);

    transform:
        translateY(-40%)
        scale(.94);

    opacity: 0;
    pointer-events: none;

    transition:
        opacity .28s ease,
        transform .35s cubic-bezier(.22,1,.36,1);
}

.point-card.open {
    opacity: 1;
    pointer-events: auto;

    transform:
        translateY(-50%)
        scale(1);
}

.point-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.point-title {
    flex: 1;

    font-size: 15px;
    font-weight: 850;
}

.point-close {
    width: 30px;
    height: 30px;

    border-radius: 9px;

    background: rgba(255,255,255,.06);
}

.point-value {
    margin-top: 13px;

    font-size: 32px;
    font-weight: 900;
    letter-spacing: -1px;
}

.point-unit {
    color: var(--muted);
    font-size: 11px;
}

.point-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;

    margin-top: 13px;
}

.stat {
    padding: 9px;

    border-radius: 11px;

    background: rgba(255,255,255,.045);
}

.stat-label {
    color: var(--muted);
    font-size: 8px;
}

.stat-value {
    margin-top: 2px;

    font-size: 11px;
    font-weight: 750;
}

/* =========================================================
   LEGEND
   ========================================================= */

.legend {
    position: fixed;
    z-index: 800;

    left: 12px;
    bottom: 170px;

    padding: 9px 10px;

    border-radius: 14px;

    background: rgba(8,17,27,.78);
    border: 1px solid var(--line);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow: var(--shadow);
}

.legend-title {
    margin-bottom: 6px;

    color: var(--muted);

    font-size: 8px;
    font-weight: 800;
    text-transform: uppercase;
}

.legend-bar {
    width: 145px;
    height: 7px;

    border-radius: 99px;

    background:
        linear-gradient(
            90deg,
            #5b6470,
            #49c7ff,
            #3b78ff,
            #48e36f,
            #ffe447,
            #ff8b38,
            #ff3d48,
            #d51cff
        );
}

.legend-values {
    display: flex;
    justify-content: space-between;

    margin-top: 4px;

    color: var(--muted);

    font-size: 7px;
}

/* =========================================================
   LOADING
   ========================================================= */

.loading {
    position: fixed;
    z-index: 3000;

    inset: 0;

    display: grid;
    place-items: center;

    background: #071019;

    transition:
        opacity .55s ease,
        visibility .55s ease;
}

.loading.hidden {
    opacity: 0;
    visibility: hidden;
}

.loader {
    text-align: center;
}

.loader-ring {
    width: 48px;
    height: 48px;

    margin: auto;

    border: 3px solid rgba(255,255,255,.08);
    border-top-color: var(--accent);

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

.loader-name {
    margin-top: 13px;

    font-weight: 850;
    font-size: 17px;
}

.loader-sub {
    margin-top: 4px;

    color: var(--muted);
    font-size: 10px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 800px) {

    .bottom-panel {
        left: 50%;
        right: auto;

        width: min(720px, calc(100vw - 40px));

        transform: translateX(-50%);
    }

    .brand {
        margin-left: 4px;
    }

    .legend {
        bottom: 115px;
    }
}

/* =========================================================
   REDUCE MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     LOADING
     ======================================================= -->

<div class="loading" id="loading">
    <div class="loader">
        <div class="loader-ring"></div>
        <div class="loader-name">CLOrad</div>
        <div class="loader-sub">Инициализация радарной сети</div>
    </div>
</div>

<!-- =======================================================
     MAP
     ======================================================= -->

<div id="map"></div>

<!-- =======================================================
     TOP BAR
     ======================================================= -->

<div class="topbar">

    <div class="brand">

        <div class="logo">
            <span>CL</span>
        </div>

        <div>
            <div class="brand-name">CLOrad</div>

            <div class="brand-status">
                <span class="status-dot"></span>
                <span id="networkStatus">сеть онлайн</span>
            </div>
        </div>

    </div>

    <div class="top-actions">

        <button class="icon-btn"
                id="searchBtn"
                aria-label="Поиск">
            ⌕
        </button>

        <button class="icon-btn"
                id="layersBtn"
                aria-label="Слои">
            ◫
        </button>

    </div>

</div>

<!-- =======================================================
     SOURCE
     ======================================================= -->

<div class="source-pill" id="sourcePill">
    РГМЦ · Композит
</div>

<!-- =======================================================
     MAP TOOLS
     ======================================================= -->

<div class="map-tools">

    <button class="map-tool"
            id="locateBtn"
            title="Моё местоположение">
        ◎
    </button>

    <button class="map-tool"
            id="zoomIn">
        +
    </button>

    <button class="map-tool"
            id="zoomOut">
        −
    </button>

    <button class="map-tool"
            id="fullscreenBtn">
        ⛶
    </button>

</div>

<!-- =======================================================
     LEGEND
     ======================================================= -->

<div class="legend">

    <div class="legend-title">
        Reflectivity · dBZ
    </div>

    <div class="legend-bar"></div>

    <div class="legend-values">
        <span>0</span>
        <span>20</span>
        <span>40</span>
        <span>60+</span>
    </div>

</div>

<!-- =======================================================
     POINT CARD
     ======================================================= -->

<div class="point-card" id="pointCard">

    <div class="point-top">

        <div class="point-title" id="pointTitle">
            Радарная точка
        </div>

        <button class="point-close" id="pointClose">
            ×
        </button>

    </div>

    <div class="point-value">
        <span id="pointValue">—</span>
        <span class="point-unit">dBZ</span>
    </div>

    <div class="point-grid">

        <div class="stat">
            <div class="stat-label">Источник</div>
            <div class="stat-value" id="pointSource">—</div>
        </div>

        <div class="stat">
            <div class="stat-label">Время</div>
            <div class="stat-value" id="pointTime">—</div>
        </div>

        <div class="stat">
            <div class="stat-label">Широта</div>
            <div class="stat-value" id="pointLat">—</div>
        </div>

        <div class="stat">
            <div class="stat-label">Долгота</div>
            <div class="stat-value" id="pointLon">—</div>
        </div>

    </div>

</div>

<!-- =======================================================
     BOTTOM PANEL
     ======================================================= -->

<div class="bottom-panel">

    <div class="dragger"></div>

    <div class="panel-head">

        <div class="frame-info">

            <div class="frame-title">
                Радарный кадр
            </div>

            <div class="frame-time"
                 id="frameTime">
                Загрузка…
            </div>

        </div>

        <div class="live-badge"
             id="liveBadge">
            LIVE
        </div>

    </div>

    <div class="timeline-wrap">

        <input
            class="timeline"
            id="timeline"
            type="range"
            min="0"
            max="11"
            value="11"
            step="1">

    </div>

    <div class="controls">

        <button class="play"
                id="playBtn">
            ▶
        </button>

        <button class="control"
                id="sourceBtn">

            <strong id="sourceName">
                РГМЦ
            </strong>

            <span>
                источник данных
            </span>

        </button>

        <button class="control"
                id="productBtn">

            <strong id="productName">
                Reflectivity
            </strong>

            <span>
                продукт
            </span>

        </button>

        <button class="control"
                id="modelsBtn">

            <strong>
                Модели
            </strong>

            <span>
                прогноз
            </span>

        </button>

    </div>

</div>

<!-- =======================================================
     SIDE SHEET
     ======================================================= -->

<aside class="sheet" id="sheet">

    <div class="sheet-title">

        <span>Слои и данные</span>

        <button class="close"
                id="sheetClose">
            ×
        </button>

    </div>

    <div class="section">

        <div class="section-label">
            Источник
        </div>

        <div class="source-grid">

            <button class="source active"
                    data-source="rgmc">

                <div class="source-name">
                    РГМЦ
                </div>

                <div class="source-desc">
                    Российская радарная сеть
                </div>

            </button>

            <button class="source"
                    data-source="baltrad">

                <div class="source-name">
                    BALTRAD
                </div>

                <div class="source-desc">
                    BUFR / radar network
                </div>

            </button>

            <button class="source"
                    data-source="composite">

                <div class="source-name">
                    Composite
                </div>

                <div class="source-desc">
                    объединённая отражаемость
                </div>

            </button>

            <button class="source"
                    data-source="models">

                <div class="source-name">
                    Models
                </div>

                <div class="source-desc">
                    численные прогнозы
                </div>

            </button>

        </div>

    </div>

    <div class="section">

        <div class="section-label">
            Радарные продукты
        </div>

        <div class="layer-list">

            <label class="layer">
                <input type="checkbox"
                       checked
                       data-layer="reflectivity">

                <div class="layer-text">

                    <div class="layer-title">
                        Reflectivity
                    </div>

                    <div class="layer-sub">
                        Z / dBZ
                    </div>

                </div>
            </label>

            <label class="layer">
                <input type="checkbox"
                       data-layer="velocity">

                <div class="layer-text">

                    <div class="layer-title">
                        Doppler Velocity
                    </div>

                    <div class="layer-sub">
                        радиальная скорость
                    </div>

                </div>
            </label>

            <label class="layer">
                <input type="checkbox"
                       data-layer="spectrum">

                <div class="layer-text">

                    <div class="layer-title">
                        Spectrum Width
                    </div>

                    <div class="layer-sub">
                        спектральная ширина
                    </div>

                </div>
            </label>

            <label class="layer">
                <input type="checkbox"
                       data-layer="stations">

                <div class="layer-text">

                    <div class="layer-title">
                        DMRL / Radar Stations
                    </div>

                    <div class="layer-sub">
                        станции и зоны покрытия
                    </div>

                </div>
            </label>

            <label class="layer">
                <input type="checkbox"
                       data-layer="cities">

                <div class="layer-text">

                    <div class="layer-title">
                        Города
                    </div>

                    <div class="layer-sub">
                        основные населённые пункты
                    </div>

                </div>
            </label>

        </div>

    </div>

    <div class="section">

        <div class="section-label">
            Дополнительные продукты
        </div>

        <div class="layer-list">

            <label class="layer">
                <input type="checkbox"
                       data-layer="lightning">

                <div class="layer-text">

                    <div class="layer-title">
                        Lightning
                    </div>

                    <div class="layer-sub">
                        молниевые разряды
                    </div>

                </div>
            </label>

            <label class="layer">
                <input type="checkbox"
                       data-layer="hail">

                <div class="layer-text">

                    <div class="layer-title">
                        Hail Potential
                    </div>

                    <div class="layer-sub">
                        потенциальный град
                    </div>

                </div>
            </label>

            <label class="layer">
                <input type="checkbox"
                       data-layer="mesocyclone">

                <div class="layer-text">

                    <div class="layer-title">
                        Mesocyclone
                    </div>

                    <div class="layer-sub">
                        автоматическое обнаружение
                    </div>

                </div>
            </label>

        </div>

    </div>

</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   CLOrad
   API CONFIGURATION
   ========================================================= */

/*
   ВАЖНО:

   Здесь специально нет выдуманного URL настоящего
   BALTRAD/РГМЦ API.

   Сервер должен отдавать фронтенду уже подготовленные
   GeoJSON / raster tiles / PNG / WMS.

   Пример:

   /api/radar?source=rgmc&product=reflectivity
   /api/radar?source=baltrad&product=reflectivity
   /api/radar?source=baltrad&product=velocity
   /api/model?model=icon
*/

const API = {

    radar:
        "/api/radar",

    models:
        "/api/model",

    stations:
        "/api/stations",

    lightning:
        "/api/lightning"

};


/* =========================================================
   MAP
   ========================================================= */

const map = L.map("map", {

    zoomControl: false,

    minZoom: 3,
    maxZoom: 13,

    zoomAnimation: true,
    fadeAnimation: false,
    markerZoomAnimation: true,

    preferCanvas: true

}).setView([61.5, 90], 4);


/* =========================================================
   DARK BASEMAP
   ========================================================= */

const base = L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    {
        subdomains: "abcd",

        maxZoom: 20,

        attribution:
            "&copy; OpenStreetMap &copy; CARTO",

        updateWhenZooming: false,
        keepBuffer: 4
    }
);

base.addTo(map);


/* =========================================================
   STATE
   ========================================================= */

const state = {

    source: "rgmc",

    product: "reflectivity",

    frame: 11,

    frames: [],

    playing: false,

    playTimer: null,

    radarLayer: null,

    stationLayer: null,

    lightningLayer: null,

    modelLayer: null

};


/* =========================================================
   DOM
   ========================================================= */

const $ = selector =>
    document.querySelector(selector);

const $$ = selector =>
    document.querySelectorAll(selector);


/* =========================================================
   SOURCE NAMES
   ========================================================= */

const sourceNames = {

    rgmc:
        "РГМЦ · Композит",

    baltrad:
        "BALTRAD · BUFR",

    composite:
        "Radar Composite",

    models:
        "Модели"

};


/* =========================================================
   PRODUCTS
   ========================================================= */

const products = {

    reflectivity:
        "Reflectivity",

    velocity:
        "Doppler Velocity",

    spectrum:
        "Spectrum Width"

};


/* =========================================================
   FRAME GENERATION
   ========================================================= */

function createFrames() {

    const now = Date.now();

    state.frames = [];

    for (let i = 0; i < 12; i++) {

        state.frames.push({

            time:
                new Date(
                    now - (11 - i) * 10 * 60 * 1000
                ),

            index:
                i

        });

    }

}


/* =========================================================
   TIME FORMAT
   ========================================================= */

function formatTime(date) {

    return new Intl.DateTimeFormat(
        "ru-RU",
        {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    ).format(date);

}


/* =========================================================
   UPDATE TIMELINE
   ========================================================= */

function updateTimeline() {

    const timeline =
        $("#timeline");

    timeline.value =
        state.frame;

    const percent =
        state.frame /
        (state.frames.length - 1) *
        100;

    timeline.style
        .setProperty(
            "--progress",
            percent + "%"
        );

    const frame =
        state.frames[state.frame];

    if (frame) {

        $("#frameTime")
            .textContent =
            formatTime(frame.time);

    }

}


/* =========================================================
   API URL
   ========================================================= */

function buildRadarURL() {

    const frame =
        state.frames[state.frame];

    if (!frame)
        return null;

    const params =
        new URLSearchParams({

            source:
                state.source,

            product:
                state.product,

            time:
                frame.time.toISOString()

        });

    return (
        API.radar +
        "?" +
        params.toString()
    );

}


/* =========================================================
   LOAD RADAR
   ========================================================= */

async function loadRadar() {

    const url =
        buildRadarURL();

    if (!url)
        return;

    /*
       Ожидаемый ответ API:

       {
           "type": "tile",
           "url": "/radar/{z}/{x}/{y}.png"
       }

       либо:

       {
           "type": "geojson",
           "data": {...}
       }

       либо:

       {
           "type": "wms",
           "url": "...",
           "layers": "..."
       }
    */

    try {

        const response =
            await fetch(url, {
                cache: "no-store"
            });

        if (!response.ok)
            throw new Error(
                "Radar API " +
                response.status
            );

        const data =
            await response.json();

        renderRadar(data);

        $("#networkStatus")
            .textContent =
            "сеть онлайн";

    }

    catch (error) {

        console.warn(
            "Radar API:",
            error
        );

        $("#networkStatus")
            .textContent =
            "ожидание данных";

    }

}


/* =========================================================
   RENDER RADAR
   ========================================================= */

function renderRadar(data) {

    if (state.radarLayer) {

        map.removeLayer(
            state.radarLayer
        );

        state.radarLayer = null;

    }


    /* -----------------------------------------------------
       TILE
       ----------------------------------------------------- */

    if (data.type === "tile") {

        state.radarLayer =
            L.tileLayer(
                data.url,
                {

                    opacity: 0,

                    minZoom:
                        data.minZoom ?? 3,

                    maxZoom:
                        data.maxZoom ?? 13,

                    tileSize:
                        data.tileSize ?? 256,

                    updateWhenZooming: false,

                    keepBuffer: 5

                }
            );

        state.radarLayer
            .addTo(map);


        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                if (state.radarLayer) {

                    state.radarLayer
                        .setOpacity(.92);

                }

            });

        });

        return;

    }


    /* -----------------------------------------------------
       GEOJSON
       ----------------------------------------------------- */

    if (data.type === "geojson") {

        state.radarLayer =
            L.geoJSON(
                data.data,
                {

                    style:
                        feature =>
                            radarStyle(
                                feature
                            )

                }
            )
            .addTo(map);

        return;

    }


    /* -----------------------------------------------------
       WMS
       ----------------------------------------------------- */

    if (data.type === "wms") {

        state.radarLayer =
            L.tileLayer.wms(
                data.url,
                {

                    layers:
                        data.layers,

                    format:
                        data.format ||
                        "image/png",

                    transparent:
                        true,

                    opacity:
                        .92,

                    version:
                        data.version ||
                        "1.3.0",

                    attribution:
                        data.attribution ||
                        ""

                }
            )
            .addTo(map);

    }

}


/* =========================================================
   RADAR STYLE
   ========================================================= */

function radarStyle(feature) {

    const value =
        Number(
            feature?.properties?.dbz ??
            feature?.properties?.value ??
            0
        );

    return {

        color:
            dbzColor(value),

        weight:
            0,

        fillColor:
            dbzColor(value),

        fillOpacity:
            .85

    };

}


/* =========================================================
   DBZ COLOR
   ========================================================= */

function dbzColor(value) {

    if (value < 5)
        return "#53606d";

    if (value < 15)
        return "#49c7ff";

    if (value < 25)
        return "#3b78ff";

    if (value < 35)
        return "#48e36f";

    if (value < 45)
        return "#ffe447";

    if (value < 55)
        return "#ff8b38";

    if (value < 65)
        return "#ff3d48";

    return "#d51cff";

}


/* =========================================================
   SOURCE SWITCH
   ========================================================= */

function setSource(source) {

    state.source =
        source;

    $(".source-pill")
        .textContent =
        sourceNames[source] ||
        source;

    $("#sourceName")
        .textContent =
        sourceNames[source] ||
        source;

    $$(".source")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.source === source
            );

        });

    loadRadar();

}


/* =========================================================
   PRODUCT SWITCH
   ========================================================= */

function setProduct(product) {

    state.product =
        product;

    $("#productName")
        .textContent =
        products[product] ||
        product;

    loadRadar();

}


/* =========================================================
   PLAY
   ========================================================= */

function togglePlay() {

    state.playing =
        !state.playing;

    if (state.playing) {

        $("#playBtn")
            .textContent =
            "Ⅱ";

        state.playTimer =
            setInterval(() => {

                state.frame++;

                if (
                    state.frame >=
                    state.frames.length
                ) {

                    state.frame = 0;

                }

                updateTimeline();
                loadRadar();

            }, 850);

    }

    else {

        $("#playBtn")
            .textContent =
            "▶";

        clearInterval(
            state.playTimer
        );

    }

}


/* =========================================================
   TIMELINE
   ========================================================= */

$("#timeline")
    .addEventListener(
        "input",
        event => {

            state.frame =
                Number(
                    event.target.value
                );

            updateTimeline();

            loadRadar();

        }
    );


/* =========================================================
   PLAY BUTTON
   ========================================================= */

$("#playBtn")
    .addEventListener(
        "click",
        togglePlay
    );


/* =========================================================
   SOURCE BUTTON
   ========================================================= */

$("#sourceBtn")
    .addEventListener(
        "click",
        () => {

            $("#sheet")
                .classList.add("open");

        }
    );


/* =========================================================
   PRODUCT BUTTON
   ========================================================= */

$("#productBtn")
    .addEventListener(
        "click",
        () => {

            $("#sheet")
                .classList.add("open");

        }
    );


/* =========================================================
   MODEL BUTTON
   ========================================================= */

$("#modelsBtn")
    .addEventListener(
        "click",
        () => {

            $("#sheet")
                .classList.add("open");

            setSource("models");

        }
    );


/* =========================================================
   LAYERS
   ========================================================= */

$("#layersBtn")
    .addEventListener(
        "click",
        () => {

            $("#sheet")
                .classList.add("open");

        }
    );


$("#sheetClose")
    .addEventListener(
        "click",
        () => {

            $("#sheet")
                .classList.remove("open");

        }
    );


/* =========================================================
   SOURCE BUTTONS
   ========================================================= */

$$(".source")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                setSource(
                    button.dataset.source
                );

            }
        );

    });


/* =========================================================
   LAYER SWITCHES
   ========================================================= */

$$(".layer input")
    .forEach(input => {

        input.addEventListener(
            "change",
            () => {

                const layer =
                    input.dataset.layer;

                handleLayer(
                    layer,
                    input.checked
                );

            }
        );

    });


/* =========================================================
   EXTRA LAYERS
   ========================================================= */

async function handleLayer(
    layer,
    enabled
) {

    if (layer === "stations") {

        if (enabled)
            await loadStations();

        else if (
            state.stationLayer
        ) {

            map.removeLayer(
                state.stationLayer
            );

            state.stationLayer =
                null;

        }

    }


    if (layer === "lightning") {

        if (enabled)
            await loadLightning();

        else if (
            state.lightningLayer
        ) {

            map.removeLayer(
                state.lightningLayer
            );

            state.lightningLayer =
                null;

        }

    }

}


/* =========================================================
   STATIONS
   ========================================================= */

async function loadStations() {

    try {

        const response =
            await fetch(
                API.stations,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok)
            throw new Error(
                "Stations API"
            );

        const data =
            await response.json();

        state.stationLayer =
            L.geoJSON(
                data,
                {

                    pointToLayer:
                        (feature, latlng) => {

                            return L.circleMarker(
                                latlng,
                                {

                                    radius: 5,

                                    color:
                                        "#8dd4ff",

                                    weight: 1,

                                    fillColor:
                                        "#2788ef",

                                    fillOpacity:
                                        .9

                                }
                            );

                        },

                    onEachFeature:
                        (feature, layer) => {

                            const name =
                                feature
                                    ?.properties
                                    ?.name ||
                                "Радар";

                            layer.bindTooltip(
                                name,
                                {
                                    direction:
                                        "top"
                                }
                            );

                        }

                }
            )
            .addTo(map);

    }

    catch (error) {

        console.warn(
            "Stations:",
            error
        );

    }

}


/* =========================================================
   LIGHTNING
   ========================================================= */

async function loadLightning() {

    try {

        const response =
            await fetch(
                API.lightning,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok)
            throw new Error(
                "Lightning API"
            );

        const data =
            await response.json();

        state.lightningLayer =
            L.geoJSON(
                data,
                {

                    pointToLayer:
                        (feature, latlng) => {

                            return L.circleMarker(
                                latlng,
                                {

                                    radius: 4,

                                    color:
                                        "#fff1a8",

                                    fillColor:
                                        "#ffe447",

                                    fillOpacity:
                                        1,

                                    weight:
                                        1

                                }
                            );

                        }

                }
            )
            .addTo(map);

    }

    catch (error) {

        console.warn(
            "Lightning:",
            error
        );

    }

}


/* =========================================================
   MAP CLICK
   ========================================================= */

map.on(
    "click",
    event => {

        /*
           В будущем сюда можно добавить
           query к radar API:

           /api/radar/value?
           lat=...
           lon=...
           time=...
        */

        showPoint(
            event.latlng
        );

    }
);


/* =========================================================
   POINT CARD
   ========================================================= */

function showPoint(latlng) {

    $("#pointTitle")
        .textContent =
        "Радарная точка";

    $("#pointValue")
        .textContent =
        "—";

    $("#pointSource")
        .textContent =
        sourceNames[state.source];

    $("#pointTime")
        .textContent =
        $("#frameTime")
            .textContent;

    $("#pointLat")
        .textContent =
        latlng.lat
            .toFixed(3);

    $("#pointLon")
        .textContent =
        latlng.lng
            .toFixed(3);

    $("#pointCard")
        .classList.add("open");

}


$("#pointClose")
    .addEventListener(
        "click",
        () => {

            $("#pointCard")
                .classList.remove(
                    "open"
                );

        }
    );


/* =========================================================
   MAP CONTROLS
   ========================================================= */

$("#zoomIn")
    .addEventListener(
        "click",
        () => map.zoomIn()
    );

$("#zoomOut")
    .addEventListener(
        "click",
        () => map.zoomOut()
    );


/* =========================================================
   LOCATE
   ========================================================= */

$("#locateBtn")
    .addEventListener(
        "click",
        () => {

            map.locate({
                setView: true,
                maxZoom: 9,
                enableHighAccuracy: true
            });

        }
    );


map.on(
    "locationfound",
    event => {

        L.circleMarker(
            event.latlng,
            {

                radius: 8,

                color:
                    "#ffffff",

                weight:
                    2,

                fillColor:
                    "#4da3ff",

                fillOpacity:
                    .9

            }
        )
        .addTo(map);

    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

$("#fullscreenBtn")
    .addEventListener(
        "click",
        async () => {

            try {

                if (!document.fullscreenElement) {

                    await document
                        .documentElement
                        .requestFullscreen();

                }

                else {

                    await document
                        .exitFullscreen();

                }

            }

            catch {}

        }
    );


/* =========================================================
   SEARCH
   ========================================================= */

$("#searchBtn")
    .addEventListener(
        "click",
        () => {

            const city =
                prompt(
                    "Введите город России"
                );

            if (!city)
                return;

            /*
               Здесь позже можно подключить
               собственный geocoder.

               Пока — примерный поиск через
               Nominatim.
            */

            fetch(
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({

                    q:
                        city + ", Russia",

                    format:
                        "json",

                    limit:
                        "1"

                })
            )
            .then(
                response =>
                    response.json()
            )
            .then(
                results => {

                    if (!results.length)
                        return;

                    const result =
                        results[0];

                    map.flyTo(
                        [
                            Number(result.lat),
                            Number(result.lon)
                        ],
                        9,
                        {
                            duration:
                                1.15,
                            easeLinearity:
                                .18
                        }
                    );

                }
            )
            .catch(
                console.warn
            );

        }
    );


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            " "
        ) {

            event.preventDefault();

            togglePlay();

        }

        if (
            event.key ===
            "ArrowLeft"
        ) {

            state.frame =
                Math.max(
                    0,
                    state.frame - 1
                );

            updateTimeline();
            loadRadar();

        }

        if (
            event.key ===
            "ArrowRight"
        ) {

            state.frame =
                Math.min(
                    state.frames.length - 1,
                    state.frame + 1
                );

            updateTimeline();
            loadRadar();

        }

    }
);


/* =========================================================
   INITIALIZATION
   ========================================================= */

function init() {

    createFrames();

    updateTimeline();

    /*
       Пока endpoint не подключён,
       карта всё равно нормально
       запускается как интерфейс.
    */

    setTimeout(
        () => {

            $("#loading")
                .classList.add(
                    "hidden"
                );

        },
        650
    );

    loadRadar();

}


init();

</script>

</body>
</html>
