<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест Радара</title>
    
    <!-- Подключаем Leaflet напрямую из надёжного источника -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        /* Жестко прописываем размеры, чтобы карта не схлопнулась в ноль */
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #111;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // Создаем карту и ставим координаты центра (Москва) и зум 5
        const map = L.map('map').setView([55.7558, 37.6173], 5);

        // 1. Загружаем базовую темную карту
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        // 2. Накладываем живой слой осадков (обновляется сервером автоматически)
        L.tileLayer('https://rainviewer.com{z}/{x}/{y}/2/1_1.png', {
            opacity: 0.6,
            transparent: true
        }).addTo(map);
    </script>

</body>
</html>
