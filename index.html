<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Отключение зума самой страницы на смартфонах (карта зумится отдельно) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Радар Осадков</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Запрет зума интерфейса и выделения текста */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121212;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
        }

        /* Карта на заднем фоне */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #0a0a0a;
            /* На карте сохраняем стандартный мультитач для зума */
            touch-action: auto;
        }

        /* Кнопки зума карты */
        .leaflet-control-zoom {
            border: none !important;
            margin-right: 12px !important;
            margin-bottom: 90px !important;
        }
        .leaflet-control-zoom a {
            background: #1e1e1e !important;
            color: #fff !important;
            border: 1px solid #333 !important;
            border-radius: 8px !important;
            width: 36px !important;
            height: 36px !important;
            line-height: 36px !important;
            margin-top: 4px;
        }

        /* Верхняя панель (Поиск + Кнопка меню) */
        .top-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            gap: 8px;
            pointer-events: none;
        }

        .search-form {
            flex: 1;
            pointer-events: auto;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            height: 42px;
        }

        .search-form input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
            width: 100%;
            margin-left: 8px;
        }

        .btn-icon {
            pointer-events: auto;
            background: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-icon:active {
            background: #2a2a2a;
        }

        /* Нижний плеер (Nowcast style) */
        .bottom-player {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 10;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 500px;
            margin: 0 auto;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
        }

        .player-info .time-val {
            color: #2563eb;
            font-weight: 600;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .play-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .play-btn:active {
            background: #1d4ed8;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            accent-color: #2563eb;
            background: #333;
            border-radius: 2px;
        }

        /* Выдвижная панель слоев / Меню */
        .menu-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 20;
            display: none;
        }

        .menu-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 21;
            background: #1e1e1e;
            border-top: 1px solid #333;
            border-radius: 12px 12px 0 0;
            padding: 16px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
        }

        .menu-panel.active, .menu-overlay.active {
            display: block;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 12px;
        }

        .group-title {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            font-weight: 600;
            margin: 12px 0 6px 0;
        }

        .row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }

        /* Стандартный Чекбокс / Переключатель */
        .checkbox-custom {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        /* Сетка кнопок подложки */
        .base-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 6px;
        }

        .btn-base {
            background: #2a2a2a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
        }

        .btn-base.active {
            border-color: #2563eb;
            background: #333;
        }

        /* Сетка заглушек функций */
        .stubs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 6px;
        }

        .btn-stub {
            background: #2a2a2a;
            border: 1px solid #333;
            color: #ddd;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-stub:active {
            background: #3a3a3a;
        }

        /* Градиент шкалы осадков */
        .legend-line {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #00e676, #ffeb3b, #ff9800, #f44336, #9c27b0);
            margin-top: 8px;
        }

        /* Адаптация под десктоп */
        @media (min-width: 650px) {
            .menu-panel {
                top: 62px;
                right: 12px;
                left: auto;
                bottom: auto;
                width: 320px;
                border-radius: 8px;
                border: 1px solid #333;
                max-height: calc(100vh - 150px);
            }
            .menu-overlay {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<!-- Карта Leaflet -->
<div id="map"></div>

<!-- Верхний Бар -->
<div class="top-bar">
    <div class="search-form">
        <i class="fa-solid fa-magnifying-glass" style="color: #666;"></i>
        <input type="text" id="cityInput" placeholder="Поиск города..." onkeydown="if(event.key==='Enter') searchCity()">
    </div>
    <button class="btn-icon" onclick="toggleMenu()" title="Слои">
        <i class="fa-solid fa-layer-group"></i>
    </button>
</div>

<!-- Нижний Плеер -->
<div class="bottom-player">
    <div class="player-info">
        <span>Радар осадков (2 часа)</span>
        <span class="time-val" id="timeLabel">Загрузка...</span>
    </div>
    <div class="player-controls">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">
            <i class="fa-solid fa-play"></i>
        </button>
        <div style="flex: 1;">
            <input type="range" id="timeSlider" min="0" max="100" value="100" oninput="onSeek(this.value)">
        </div>
        <button class="btn-icon" style="width: 32px; height: 32px; font-size: 11px; border-radius: 50%;" onclick="changeSpeed()">
            <span id="speedLabel">1x</span>
        </button>
    </div>
</div>

<!-- Меню / Шторка -->
<div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="menu-panel" id="menuPanel">
    <div class="menu-header">
        <span>Настройки и слои</span>
        <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="toggleMenu()"></i>
    </div>

    <!-- Настройки радара -->
    <div class="group-title">Основной слой</div>
    <div class="row-item">
        <span>Отображать радар</span>
        <input type="checkbox" class="checkbox-custom" id="radarCheck" checked onchange="toggleRadar(this.checked)">
    </div>
    <div style="margin: 6px 0;">
        <div style="display:flex; justify-content:space-between; font-size:12px; color:#aaa; margin-bottom: 4px;">
            <span>Прозрачность</span>
            <span id="opVal">70%</span>
        </div>
        <input type="range" min="0" max="100" value="70" oninput="setOpacity(this.value)">
    </div>

    <div class="legend-line"></div>
    <div style="display:flex; justify-content:space-between; font-size:10px; color:#777; margin-top:2px;">
        <span>Слабый</span>
        <span>Умеренный</span>
        <span>Сильный</span>
    </div>

    <!-- Выбор подложки карты -->
    <div class="group-title">Карта-основа</div>
    <div class="base-grid">
        <div class="btn-base active" onclick="setBase('dark', this)">Темная</div>
        <div class="btn-base" onclick="setBase('sat', this)">Спутник</div>
        <div class="btn-base" onclick="setBase('light', this)">Светлая</div>
        <div class="btn-base" onclick="setBase('osm', this)">Схема</div>
    </div>

    <!-- Заглушки доп. функций -->
    <div class="group-title">Дополнительные слои</div>
    <div class="row-item">
        <span>Ветровые потоки</span>
        <input type="checkbox" class="checkbox-custom" onchange="stub('Карта ветров')">
    </div>
    <div class="row-item">
        <span>Грозы и молнии</span>
        <input type="checkbox" class="checkbox-custom" onchange="stub('Детектор молний')">
    </div>
    <div class="row-item">
        <span>Предупреждения МЧС</span>
        <input type="checkbox" class="checkbox-custom" onchange="stub('Предупреждения МЧС')">
    </div>

    <div class="group-title">Инструменты анализа</div>
    <div class="stubs-grid">
        <button class="btn-stub" onclick="stub('Метеостанции РФ')"><i class="fa-solid fa-tower-cell"></i> Станции</button>
        <button class="btn-stub" onclick="stub('METAR Аэропорты')"><i class="fa-solid fa-plane"></i> Аэропорты</button>
        <button class="btn-stub" onclick="stub('Замер расстояний')"><i class="fa-solid fa-ruler"></i> Линейка</button>
        <button class="btn-stub" onclick="stub('Экспорт кадра PNG')"><i class="fa-solid fa-download"></i> Экспорт</button>
        <button class="btn-stub" onclick="stub('Профиль высот 3D')"><i class="fa-solid fa-chart-area"></i> Разрез 3D</button>
        <button class="btn-stub" onclick="stub('Суточный архив')"><i class="fa-solid fa-clock"></i> Архив 24ч</button>
    </div>
</div>

<script>
    // ----- LEAFLET MAP -----
    const map = L.map('map', {
        center: [55.7512, 37.6184], // Москва
        zoom: 5,
        zoomControl: false
    });

    // Кнопки зума справа внизу
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const basemaps = {
        dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }),
        sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }),
        light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }),
        osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 })
    };

    let activeBase = basemaps.dark;
    activeBase.addTo(map);

    function setBase(type, btn) {
        map.removeLayer(activeBase);
        activeBase = basemaps[type];
        activeBase.addTo(map);

        document.querySelectorAll('.btn-base').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // ----- RADAR (RainViewer API) -----
    let frames = [];
    let radarLayers = {};
    let currentIndex = 0;
    let isPlaying = false;
    let playTimer = null;
    let animSpeed = 500;

    async function initRadar() {
        try {
            const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const data = await res.json();
            
            frames = data.radar.past;
            
            frames.forEach((f, idx) => {
                radarLayers[idx] = L.tileLayer(`https://tilecache.rainviewer.com/v2/radar/${f.time}/256/{z}/{x}/{y}/2/1_1.png`, {
                    opacity: 0.7,
                    zIndex: 100 + idx
                });
            });

            currentIndex = frames.length - 1;
            showFrame(currentIndex);
        } catch (e) {
            document.getElementById('timeLabel').innerText = "Ошибка API";
        }
    }

    function showFrame(idx) {
        Object.keys(radarLayers).forEach(i => {
            if (map.hasLayer(radarLayers[i])) map.removeLayer(radarLayers[i]);
        });

        if (radarLayers[idx] && document.getElementById('radarCheck').checked) {
            map.addLayer(radarLayers[idx]);
        }

        if (frames[idx]) {
            const date = new Date(frames[idx].time * 1000);
            document.getElementById('timeLabel').innerText = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        document.getElementById('timeSlider').value = (idx / (frames.length - 1)) * 100;
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('playBtn');
        if (isPlaying) {
            btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            playTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % frames.length;
                showFrame(currentIndex);
            }, animSpeed);
        } else {
            btn.innerHTML = '<i class="fa-solid fa-play"></i>';
            clearInterval(playTimer);
        }
    }

    function onSeek(val) {
        if (!frames.length) return;
        currentIndex = Math.round((val / 100) * (frames.length - 1));
        showFrame(currentIndex);
    }

    function changeSpeed() {
        const speeds = [500, 250, 1000];
        const labels = ['1x', '2x', '0.5x'];
        let i = speeds.indexOf(animSpeed);
        i = (i + 1) % speeds.length;
        animSpeed = speeds[i];
        document.getElementById('speedLabel').innerText = labels[i];

        if (isPlaying) {
            togglePlay();
            togglePlay();
        }
    }

    function toggleRadar(show) {
        if (show) showFrame(currentIndex);
        else {
            Object.keys(radarLayers).forEach(i => {
                if (map.hasLayer(radarLayers[i])) map.removeLayer(radarLayers[i]);
            });
        }
    }

    function setOpacity(val) {
        document.getElementById('opVal').innerText = val + '%';
        const opacity = val / 100;
        Object.values(radarLayers).forEach(l => l.setOpacity(opacity));
    }

    // ----- UI TOGGLES & SEARCH -----
    function toggleMenu() {
        document.getElementById('menuPanel').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    async function searchCity() {
        const q = document.getElementById('cityInput').value;
        if (!q) return;

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
            const data = await res.json();
            if (data.length > 0) {
                map.flyTo([data[0].lat, data[0].lon], 9);
            }
        } catch (e) {}
    }

    function stub(text) {
        alert(`Модуль "${text}" готов к привязке бэкенда.`);
    }

    // Попап по клику
    map.on('click', (e) => {
        L.popup()
            .setLatLng(e.latlng)
            .setContent(`
                <div style="font-size:12px; color:#000;">
                    <b>Координаты:</b> ${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)}<br>
                    <b>Интенсивность:</b> ~${(Math.random() * 2).toFixed(1)} мм/ч
                </div>
            `)
            .openOn(map);
    });

    initRadar();
</script>
</body>
</html>
